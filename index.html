function pick(a){return a[Math.floor(rng()*a.length)]}

function inferredTags(name,fr){const n=name.toLowerCase();let t=[...(VERSE_TAGS[fr]||[])];const add=x=>{if(!t.includes(x))t.push(x)};if(/uchiha|sasuke|itachi|madara|obito|sarada/.test(n)){add('sharingan');add('illusion');add('sense')}if(/kakashi/.test(n)){add('sharingan');add('copy');add('sense')}if(/gojo/.test(n))add('infinity');if(/rimuru|kirby|mercer/.test(n))add('absorb');if(/asta/.test(n))add('anti-magic');if(/accelerator/.test(n))add('vector');if(/giorno/.test(n))add('return-zero');if(/homura|dio|jotaro|pucci/.test(n))add('time');if(/sung jin|ashborn|bellion|beru|igris/.test(n))add('summon');if(/sonic|shadow|flash|killua|raiden/.test(n))add('speed');if(/alucard|denji|pochita|meliodas|malenia|mercer/.test(n))add('regen');if(/featherine|madoka|anti-spiral|anos|yhwach/.test(n)){add('concept');add('reality')}if(/vergil|obito|sasuke|anti-spiral/.test(n))add('space');if(/obito/.test(n)){add('intangible');add('kamui')}if(/meliodas/.test(n))add('full-counter');if(/escanor/.test(n)){add('sun');add('fire')}if(/bayonetta|jeanne/.test(n))add('witch-time');if(/meruem|garou/.test(n))add('adaptation');if(/aizen/.test(n))add('illusion');if(/gojo|sukuna|yuta|kenjaku|mahito|jogo|hakari/.test(n))add('domain');if(/sword|blade|samurai|belmont|link|cloud|sephiroth|ichigo|zoro/.test(n))add('sword');return t.slice(0,8)}
function genChar(name,fr,i){const uid=slug(fr)+'--'+slug(name),old=oldByKey.get(fr+'|'+name);if(old)return {...old,id:uid,signature:SIGNATURE_OVERRIDES[name]||null};const h=hash(name+fr), tier=i===0?'God':i<5?'High':'Mid';const base=tier==='God'?91:tier==='High'?77:62;const role=roleCycle[(h>>>5)%roleCycle.length];const jitter=k=>Math.max(45,Math.min(100,base+((h>>>k)%17)-8));let c={id:uid,name,franchise:fr,source:['Prototype','Metal Gear Rising','Street Fighter','Tekken','Minecraft','God of War','Asura’s Wrath','Bayonetta','Kirby','Metroid','DOOM','Halo','Super Mario','The Legend of Zelda','Sonic the Hedgehog','Pokémon','Mortal Kombat','Elden Ring','Devil May Cry','Final Fantasy VII','Castlevania'].includes(fr)?'Game':'Anime',tier,rarity:rarityFor(tier,i),role,power:jitter(1),hax:jitter(7),speed:jitter(13),durability:jitter(19),tags:inferredTags(name,fr)};if(role==='Hax'||role==='Mage')c.hax=Math.min(100,c.hax+9);if(role==='Assassin')c.speed=Math.min(100,c.speed+9);if(role==='Bruiser')c.power=Math.min(100,c.power+7);if(role==='Support')c.hax=Math.min(100,c.hax+5);c.signature=null;return c}
let CHARACTERS=[];for(const [fr,names] of Object.entries(VERSE_ROSTERS)){names.slice(0,Math.max(18,names.length)).forEach((n,i)=>CHARACTERS.push(genChar(n,fr,i)))}

function validateRoster(){const bad=[];for(const [fr,n] of Object.entries(VERSE_ROSTERS)){const u=new Set(n);if(u.size<18)bad.push(fr+': '+u.size)}const ids=CHARACTERS.map(c=>c.id),duplicateIds=ids.filter((id,i)=>ids.indexOf(id)!==i);const invalid=CHARACTERS.filter(c=>!c.name||!c.franchise||!['Mid','High','God'].includes(c.tier)||!Number.isFinite(c.power)||!Array.isArray(c.tags));return {ok:bad.length===0&&duplicateIds.length===0&&invalid.length===0,bad,total:CHARACTERS.length,verses:Object.keys(VERSE_ROSTERS).length,duplicateIds:[...new Set(duplicateIds)],invalid:invalid.map(c=>c.name)}}

function newGame(mode='classic'){const seed=(Date.now()^Math.floor(Math.random()*0xffffffff))>>>0;rng=mulberry32(seed);return {version:VERSION,seed,mode,phase:'setup',active:1,turnPicks:0,candidate:null,forced:false,teams:{1:[],2:[]},missed:{1:[],2:[]},bans:{1:null,2:null},discarded:[],tokens:{1:{joker:1,mystery:1,double:1,trade:1,revive:1},2:{joker:1,mystery:1,double:1,trade:1,revive:1}},tradeDone:{1:false,2:false},captains:{1:null,2:null},order:{1:[],2:[]},verse:{1:null,2:null},allowedVerses:Object.keys(VERSE_ROSTERS),history:[],result:null,rematch:{1:false,2:false},matchNo:1}}

function home(){stopTTS();game=null;online.mode='local';app.innerHTML=`<section class="screen"><div class="hero"><div class="card hero-main"><div class="kicker">V${VERSION} · 7V7 CINEMATIC DRAFT</div><h1>ANIME <span>VERSUS GAME</span></h1><p class="lede">7 gegen 7. Take/Switch, Joker, Mystery, Trades, Captains, Trait-Counter und ein langsam erzähltes TTS-Finale. Neu: <b>ShowFight</b> — Verse gegen Verse mit mindestens 18 Figuren pro vorhandener Serie.</p><div class="actions"><button class="btn" onclick="startLocal('classic')">🎮 CLASSIC LOCAL</button><button class="btn gold" onclick="showFightSetup('local')">🔥 SHOWFIGHT LOCAL</button><button class="btn p2" onclick="createRoom('classic')">🌐 CLASSIC ONLINE</button><button class="btn secondary" onclick="showFightSetup('host')">🌐 SHOWFIGHT ONLINE</button><button class="btn secondary" onclick="joinPrompt()">🔗 ROOM JOINEN</button></div></div><div class="card mode-stack"><div class="mode"><div><b>⚖️ BALANCED ROLLS</b><p>Mid häufig, High selten, God sehr selten. Team-Power beeinflusst die nächsten Roll-Chancen.</p></div><div class="em">🎲</div></div><div class="mode"><div><b>🔥 GOD REVEALS</b><p>High- und God-Tier-Pulls bekommen eigene SFX, Screen-Flash und Reveal-Sequenz.</p></div><div class="em">🌌</div></div><div class="mode"><div><b>🎬 STORY FINALE</b><p>Trait-basierte Duelle, KO-Karten, TTS blockweise und Sieger erst ganz am Schluss.</p></div><div class="em">⚔️</div></div><div class="mode"><div><b>44 VERSES</b><p>${Object.keys(VERSE_ROSTERS).length} vorhandene Franchises · ${CHARACTERS.length} spielbare Figuren · mindestens 18 pro Verse.</p></div><div class="em">📚</div></div></div></div>${settingsHTML()}</section>`;bindSettings();ensureMusicDock()}
function settingsHTML(){const t=[['franchiseLimit','Franchise-Limit','Classic: maximal ein Pick pro Verse und Team. ShowFight ignoriert das bewusst.'],['ban','Ban-System','Jeder bannt einen Pick.'],['joker','Joker','Zwei neue Optionen, eine wählen.'],['mystery','Mystery Box','Neuer Secret-Pick, Gegner sieht ???.'],['double','Double or Nothing','Blind zwischen zwei Karten gambeln.'],['trade','Trade','Nach Pick 4 einmal austauschen.'],['captain','Captain','Kleiner Team-/Clutch-Bonus.'],['lineup','Lineup','Priorität 1–7 festlegen.'],['revive','Revive','Ein einmaliges Comeback im Finale.'],['events','Arena Events','Map-spezifische Modifikatoren.'],['bestOf3','Best of 3','Drei Arenen statt einer.'],['balance','Balance Director','God/High-Rolls und Team-Power ausgleichen.'],['synergy','Team-Synergie','Rollen und Teamzusammenstellung wirken im Fight.'],['counters','Trait-Counter','Sharingan, Anti-Magic, Regeneration, Raum, Zeit usw. werden gegeneinander bewertet.'],['tts','Auto TTS','Story blockweise vorlesen.'],['sfx','SFX','Reveals, Hits, KOs, Winner.'],['music','Battle OST','Synth-Anime-OST unten links.']];return `<div class="section-head"><div><h2>Match-Regeln</h2><p>V2.5 Standard: 7v7 + Balance Director.</p></div></div><div class="settings"><div class="setting"><label>Power Cap</label><select id="powerCap"><option>No Limit</option><option>God</option><option>High</option><option>Mid</option></select><small>Maximales Tier im Pool.</small></div>${t.map(x=>`<div class="setting"><label>${x[1]}<input class="switch" type="checkbox" data-setting="${x[0]}" ${settings[x[0]]?'checked':''}></label><small>${x[2]}</small></div>`).join('')}</div>`}
function bindSettings(){$$('[data-setting]').forEach(x=>x.onchange=()=>{settings[x.dataset.setting]=x.checked;saveSettings();if(x.dataset.setting==='music')settings.music?Music.start():Music.stop()});const p=$('#powerCap');if(p){p.value=settings.powerCap;p.onchange=()=>{settings.powerCap=p.value;saveSettings()}}}
function startLocal(mode='classic'){settings.powerCap=$('#powerCap')?.value||settings.powerCap;game=newGame(mode);online={mode:'local',role:1,room:null,connected:false};if(mode==='classic')classicVerseSetup('local');else showFightSetup('local')}
function classicVerseSetup(target='local'){if(!game)game=newGame('classic');const verses=Object.keys(VERSE_ROSTERS).sort();const active=new Set(game.allowedVerses?.length?game.allowedVerses:verses);modal(`<button class="x" onclick="closeModal()">×</button><div class="kicker">CLASSIC · VERSE FILTER</div><h2>Welche Anime/Game-Verse dürfen rollen?</h2><p>Standardmäßig sind alle aktiviert. Lokal entscheidet ihr gemeinsam; online legt der Host den Pool für beide Spieler fest.</p><div class="versefilter"><div class="versefilter-head"><input id="verseSearch" placeholder="Verse suchen…" style="flex:1;min-width:180px;padding:11px;border-radius:10px;background:#060b15;border:1px solid var(--border);color:#fff"><div class="actions" style="margin:0"><button class="btn secondary" id="allVersesBtn">ALLE</button><button class="btn secondary" id="noneVersesBtn">KEINE</button></div></div><div class="versefilter-grid" id="verseFilterGrid">${verses.map(v=>`<label class="versecheck" data-vname="${esc(v.toLowerCase())}"><input type="checkbox" value="${esc(v)}" ${active.has(v)?'checked':''}><span>${esc(v)}<small>${VERSE_ROSTERS[v].length} Charaktere</small></span></label>`).join('')}</div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">ZURÜCK</button><button class="btn gold" id="applyVersesBtn">POOL BESTÄTIGEN</button></div>`);const grid=$('#verseFilterGrid'),search=$('#verseSearch');search.oninput=()=>{$$('.versecheck').forEach(x=>x.style.display=x.dataset.vname.includes(search.value.toLowerCase())?'':'none')};$('#allVersesBtn').onclick=()=>$$('#verseFilterGrid input').forEach(x=>x.checked=true);$('#noneVersesBtn').onclick=()=>$$('#verseFilterGrid input').forEach(x=>x.checked=false);$('#applyVersesBtn').onclick=()=>{const selected=$$('#verseFilterGrid input:checked').map(x=>x.value);if(!selected.length)return toast('Mindestens ein Verse muss aktiviert bleiben.');game.allowedVerses=selected;game.history.push({type:'verseFilter',count:selected.length});sync();closeModal();if(target==='local')beginConfiguredGame();else renderLobby()}}

function showFightSetup(target='local'){const verses=Object.keys(VERSE_ROSTERS).sort();modal(`<button class="x" onclick="closeModal()">×</button><div class="kicker">SHOWFIGHT · VERSE VS VERSE</div><h2>Wie werden die Verse verteilt?</h2><p>Random sucht zwei unterschiedliche, vom Durchschnitt her möglichst passende Verse. Manuell lässt den Host beide auswählen.</p><div class="actions"><button class="btn gold" onclick="showFightRandom('${target}')">🎲 VERSES ROLLEN</button><button class="btn secondary" onclick="showFightManual('${target}')">🎯 SELBST AUSWÄHLEN</button></div><p style="margin-top:18px;color:var(--muted)">${verses.length} Verse verfügbar, jeweils mindestens 18 Figuren.</p>`)}

function balancedVersePair(){const v=Object.keys(VERSE_ROSTERS),a=pick(v),pa=versePower(a);let candidates=v.filter(x=>x!==a).sort((x,y)=>Math.abs(versePower(x)-pa)-Math.abs(versePower(y)-pa)).slice(0,Math.min(12,v.length-1));return [a,pick(candidates)]}

function beginConfiguredGame(){game.phase=settings.ban?'ban':'draft';game.active=1;if(!settings.ban)game.candidate=drawCharacter(1);sync();route()}
function poolFor(p,includeDiscarded=false){let pool=CHARACTERS.filter(c=>settings.powerCap==='No Limit'||tierRank(c.tier)<=tierRank(settings.powerCap));if(game?.mode==='showfight')pool=pool.filter(c=>c.franchise===game.verse[p]);if(game?.mode==='classic'&&game.allowedVerses?.length)pool=pool.filter(c=>game.allowedVerses.includes(c.franchise));if(game?.mode==='classic'&&settings.franchiseLimit){const owned=new Set(game.teams[p].map(x=>x.franchise));const varied=pool.filter(c=>!owned.has(c.franchise));if(varied.length)pool=varied}if(!includeDiscarded&&game){const used=new Set([...game.discarded,...game.teams[1].map(x=>x.id),...game.teams[2].map(x=>x.id),...Object.values(game.bans).filter(Boolean)]);pool=pool.filter(c=>!used.has(c.id))}return pool}
function teamTierCount(p,t){return game.teams[p].filter(c=>c.tier===t).length}
function teamImpact(p){const t=game.teams[p];return t.length?t.reduce((s,c)=>s+impact(c),0)/t.length:0}
function weightedTier(p,pool){const have={God:pool.some(c=>c.tier==='God'),High:pool.some(c=>c.tier==='High'),Mid:pool.some(c=>c.tier==='Mid')};let w={Mid:.72,High:.23,God:.05};if(settings.balance){const mine=teamImpact(p),opp=teamImpact(p===1?2:1),diff=mine-opp;if(diff>18){w.God*=.18;w.High*=.55}else if(diff>8){w.God*=.45;w.High*=.75}else if(diff<-18){w.God*=1.7;w.High*=1.25}else if(diff<-8){w.God*=1.35;w.High*=1.12}if(teamTierCount(p,'God')>=1)w.God=0;if(teamTierCount(p,'High')>=3)w.High=0}for(const k of Object.keys(w))if(!have[k])w[k]=0;const sum=w.Mid+w.High+w.God;if(!sum)return pool[0]?.tier||'Mid';let r=rng()*sum;for(const k of ['Mid','High','God']){r-=w[k];if(r<=0)return k}return 'Mid'}
function drawCharacter(p){let pool=poolFor(p);if(!pool.length)pool=poolFor(p,true).filter(c=>!game.teams[p].some(x=>x.id===c.id));const tier=weightedTier(p,pool);let tierPool=pool.filter(c=>c.tier===tier);if(!tierPool.length)tierPool=pool;const c=clone(pick(tierPool));game.discarded.push(c.id);return c}
function renderBan(){const p=game.active;if(!settings.ban){beginConfiguredGame();return}const pool=poolFor(p,true).filter(c=>!Object.values(game.bans).includes(c.id)).sort((a,b)=>a.name.localeCompare(b.name));app.innerHTML=`<section class="screen"><div class="phase"><div><h1>Ban Phase</h1><p>${game.mode==='showfight'?esc(game.verse[p])+' Pool':'Gesamter Pool'} · Player ${p===1?'One':'Two'} bannt einen Charakter.</p></div><span class="pill ${p===1?'p1c':'p2c'}">PLAYER ${p===1?'ONE':'TWO'}</span></div><input id="banq" style="width:100%;padding:13px;border-radius:12px;background:#080d18;border:1px solid var(--border);color:#fff" placeholder="Charakter suchen"><div id="banlist" class="select-grid" style="margin-top:10px"></div></section>`;const q=$('#banq');const draw=()=>{$('#banlist').innerHTML=pool.filter(c=>(c.name+' '+c.franchise).toLowerCase().includes(q.value.toLowerCase())).slice(0,60).map(c=>`<button class="select" ${canAct(p)?'':'disabled'} onclick="dispatch('ban',{id:'${c.id}',player:${p}})"><div><b>${esc(c.name)}</b><small>${esc(c.franchise)} · ${c.tier}</small></div></button>`).join('')};q.oninput=draw;draw();if(online.mode==='local'&&p===2)passScreen(2,'Ban auswählen')}

function renderDraft(){if(game.phase!=='draft')return route();const p=game.active;if(!game.candidate&&game.teams[p].length<TEAM_SIZE)game.candidate=drawCharacter(p);const c=game.candidate;app.innerHTML=`<section class="screen"><div class="phase"><div><h1>${game.mode==='showfight'?'SHOWFIGHT DRAFT':'CLASSIC DRAFT'}</h1><p>${game.mode==='showfight'?`P1 ${esc(game.verse[1])} · P2 ${esc(game.verse[2])}`:`7v7 Balanced Draft · ${selectedVerseCount()} Verse aktiv`} · Zwei Picks, dann Spielerwechsel.</p></div><span class="pill ${p===1?'p1c':'p2c'}">PLAYER ${p===1?'ONE':'TWO'} · ${game.teams[p].length+1}/${TEAM_SIZE}</span></div><div class="draft"><aside class="team">${teamHTML(1)}</aside><main><div class="progress">${Array.from({length:TEAM_SIZE*2},(_,i)=>{const pp=i<TEAM_SIZE?1:2,ix=i%TEAM_SIZE;return `<i class="${ix<game.teams[pp].length?'p'+pp:''}"></i>`}).join('')}</div>${cardHTML(c)}<div class="pick-actions"><button class="btn" ${canAct(p)?'':'disabled'} onclick="dispatch('take')">✅ NEHMEN</button><button class="btn p2" ${canAct(p)?'':'disabled'} onclick="dispatch('swap')">🎲 WECHSELN</button></div><div class="specials"><button class="btn secondary" ${!canAct(p)||!settings.joker||!game.tokens[p].joker||game.forced?'disabled':''} onclick="${online.mode==='guest'?"guestSpecialRequest('joker')":'openJoker()'}">🃏 JOKER</button><button class="btn secondary" ${!canAct(p)||!settings.mystery||!game.tokens[p].mystery||game.forced?'disabled':''} onclick="${online.mode==='guest'?"guestMysteryPrompt()":'openMystery()'}">🎁 MYSTERY</button><button class="btn secondary" ${!canAct(p)||!settings.double||!game.tokens[p].double||game.forced?'disabled':''} onclick="${online.mode==='guest'?"guestSpecialRequest('double')":'openDouble()'}">🎰 DOUBLE</button></div></main><aside class="team">${teamHTML(2)}</aside></div></section>`;loadImages();loadCardImage(c);if(online.mode==='local'&&game._needsPass){game._needsPass=false;passScreen(p,'Draft übernehmen')}setTimeout(()=>{playRareReveal(c);showP function cardHTML(c){if(!c)return '';return `<article class="pickcard"><div class="art"><img id="mainart" src="${avatar(c.name,c.franchise)}" alt="${esc(c.name)}"><div class="shade"></div><span class="badge left">${c.tier} · ${c.rarity}</span><span class="badge right">${esc(c.franchise)}</span></div><div class="body"><div class="eyebrow">${c.source} · ${c.role}</div><h2>${esc(c.name)}</h2><div class="tags">${c.tags.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="stats">${[['PWR',c.power],['HAX',c.hax],['SPD',c.speed],['DUR',c.durability]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('')}</div></div></article>`}
function take(){const p=game.active,c=clone(game.candidate),forced=game.forced;c.mystery=false;game.teams[p].push(c);game.history.push({type:forced?'forced':'take',p,id:c.id});game.candidate=null;game.forced=false;if(forced){sync();modal(`<button class="x" onclick="closeModal();afterPick(${p})">×</button><h2>⚠️ Pflichtpick: ${esc(c.name)}</h2><p>Der Wechsel hat diesen Charakter fest gemacht. Kein weiterer Missed-Pick.</p><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">WEITER</button></div>`);return}const miss=drawCharacter(p);game.missed[p].push(miss);game.history.push({type:'missed',p,id:miss.id});sync();revealTaken(c,miss,p)}
function swap(){const p=game.active,old=game.candidate;game.history.push({type:'swap',p,id:old.id});game.candidate=drawCharacter(p);game.forced=true;sync();modal(`<button class="x" onclick="closeModal();renderDraft()">×</button><h2>🎲 Wechsel bestätigt</h2><p>${esc(old.name)} ist weg. <b>${esc(game.candidate.name)}</b> ist jetzt Pflichtpick.</p><div class="modal-actions"><button class="btn p2" onclick="closeModal();renderDraft()">PFLICHTPICK ANSEHEN</button></div>`)}
async function revealTaken(a,b,p){const [ia,ib]=await Promise.all([resolveImage(a),resolveImage(b)]);modal(`<h2>${esc(a.name)} kommt ins Team</h2><div class="reveal-grid"><div class="mini"><img src="${ia}"><div class="copy"><b>${esc(a.name)}</b><small>${esc(a.franchise)}</small></div></div><div class="mini"><img src="${ib}"><div class="copy"><b>❌ VERPASST: ${esc(b.name)}</b><small>${esc(b.franchise)}</small></div></div></div><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">WEITER</button></div>`);SFX.pick();playRareReveal(a)}
function afterPick(p){if(settings.trade&&game.teams[p].length===4&&!game.tradeDone[p]&&game.tokens[p].trade){if(online.mode==='host'&&p===2){game.pendingRemote={type:'tradePrompt',player:2};sync();return}openTrade();return}advance(p)}
function advance(p){if(game.teams[1].length>=TEAM_SIZE&&game.teams[2].length>=TEAM_SIZE){game.phase=settings.captain?'captain':settings.lineup?'order':'battle';game.active=1;sync();route();return}game.turnPicks++;if(game.turnPicks>=2||game.teams[p].length>=TEAM_SIZE){game.turnPicks=0;game.active=p===1?2:1;game._needsPass=online.mode==='local'}if(game.teams[game.active].length>=TEAM_SIZE)game.active=game.active===1?2:1;game.candidate=drawCharacter(game.active);sync();renderDraft()}
function openJoker(){const p=game.active;if(!game.tokens[p].joker)return;const a=drawCharacter(p),b=drawCharacter(p);game._joker=[a,b];Promise.all([resolveImage(a),resolveImage(b)]).then(img=>modal(`<button class="x" onclick="cancelSpecial('joker')">×</button><h2>🃏 Joker</h2><p>Token wird erst verbraucht, wenn du wirklich einen auswählst.</p><div class="reveal-grid">${[a,b].map((c,i)=>`<button class="select" onclick="dispatch('jokerChoose',{id:'${c.id}'})"><img src="${img[i]}"><div><b>${esc(c.name)}</b><small>${c.tier} · ${esc(c.franchise)}</small></div></button>`).join('')}</div><div class="modal-actions"><button class="btn secondary" onclick="cancelSpecial('joker')">ZURÜCK</button></div>`))}
function jokerChoose(id){const p=game.active,opts=game._joker||[],c=opts.find(x=>x.id===id),other=opts.find(x=>x.id!==id);if(!c)return;game.tokens[p].joker=0;game.teams[p].push(c);game.missed[p].push(other);game.history.push({type:'joker',p,id:c.id,missed:other.id});delete game._joker;game.candidate=null;closeModal();sync();revealTaken(c,other,p)}
function openMystery(){const p=game.active;if(!game.tokens[p].mystery)return;modal(`<button class="x" onclick="closeModal()">×</button><h2>🎁 Mystery Box</h2><p>Der sichtbare Kandidat wird verworfen. Danach wird ein neuer Charakter gezogen, den nur du siehst. Der Gegner sieht bis zum Finale <b>???</b>.</p><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">ZURÜCK</button><button class="btn gold" onclick="dispatch('mysteryCommit')">BLIND ZIEHEN</button></div>`)}
async function mysteryCommit(){const p=game.active;if(!game.tokens[p].mystery)return;const old=game.candidate,secret=drawCharacter(p);secret.mystery=true;game.tokens[p].mystery=0;game.teams[p].push(secret);game.history.push({type:'mystery',p,id:secret.id,discarded:old.id});game.candidate=null;sync();const img=await resolveImage(secret);modal(`<h2>🎁 Dein Secret-Pick</h2><div class="mini"><img src="${img}"><div class="copy"><b>${esc(secret.name)}</b><small>${esc(secret.franchise)} · ${secret.tier}</small></div></div><p>Nur du solltest diese Karte sehen.</p><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">SECRET LOCKEN</button></div>`);playRareReveal(secret)}
function openDouble(){const p=game.active;if(!game.tokens[p].double)return;const a=drawCharacter(p),b=drawCharacter(p);game._double=[a,b];modal(`<button class="x" onclick="cancelSpecial('double')">×</button><h2>🎰 Double or Nothing</h2><p>Wähle blind A oder B. Wenn du den stärkeren Gesamt-Impact triffst, bekommst du ihn; sonst den schwächeren. Token erst bei Auswahl.</p><div class="actions"><button class="btn gold" onclick="dispatch('doubleChoose',{idx:0})">KARTE A</button><button class="btn p2" onclick="dispatch('doubleChoose',{idx:1})">KARTE B</button></div><div class="modal-actions"><button class="btn secondary" onclick="cancelSpecial('double')">ZURÜCK</button></div>`)}
function doubleChoose(idx){const p=game.active,o=game._double||[];if(o.length!==2)return;game.tokens[p].double=0;const strong=impact(o[0])>=impact(o[1])?o[0]:o[1],weak=strong===o[0]?o[1]:o[0],correct=o[idx]===strong,c=correct?strong:weak,m=correct?weak:strong;game.teams[p].push(c);game.missed[p].push(m);game.history.push({type:'double',p,id:c.id,correct});delete game._double;game.candidate=null;closeModal();sync();revealTaken(c,m,p)}
function cancelSpecial(k){if(k==='joker'&&game._joker){for(const c of game._joker)game.discarded=game.discarded.filter(x=>x!==c.id);delete game._joker}if(k==='double'&&game._double){for(const c of game._double)game.discarded=game.discarded.filter(x=>x!==c.id);delete game._double}closeModal();renderDraft()}
function openTrade(){const p=game.active;modal(`<button class="x" onclick="skipTrade(false)">×</button><h2>♻️ Trade-Fenster</h2><p>Du kannst einen bisherigen Pick opfern und erhältst einen neuen Pflicht-Ersatz. Mit × oder Behalten geht es ohne Tokenverbrauch weiter.</p><div class="modal-actions"><button class="btn secondary" onclick="skipTrade(false)">BEHALTEN</button><button class="btn gold" onclick="tradeSelect()">TRADE ANSEHEN</button></div>`)}
function tradeSelect(){const p=game.active;Promise.all(game.teams[p].map(resolveImage)).then(img=>modal(`<button class="x" onclick="openTrade()">×</button><h2>Welcher Slot soll raus?</h2><div class="select-grid">${game.teams[p].map((c,i)=>`<button class="select" onclick="dispatch('tradeCommit',{index:${i}})"><img src="${img[i]}"><div><b>${esc(c.name)}</b><small>${c.tier}</small></div></button>`).join('')}</div><div class="modal-actions"><button class="btn secondary" onclick="openTrade()">← ZURÜCK</button></div>`))}
function tradeCommit(index){const p=game.active;if(!game.tokens[p].trade)return;const old=game.teams[p][index],fresh=drawCharacter(p);game.tokens[p].trade=0;game.tradeDone[p]=true;game.teams[p][index]=fresh;game.history.push({type:'trade',p,old:old.id,id:fresh.id});closeModal();sync();modal(`<h2>♻️ Trade komplett</h2><p>${esc(old.name)} → <b>${esc(fresh.name)}</b></p><div class="modal-actions"><button class="btn" onclick="closeModal();advance(${p})">WEITER</button></div>`);playRareReveal(fresh)}
function skipTrade(){const p=game.active;game.tradeDone[p]=true;closeModal();sync();advance(p)}
function renderCaptain(){const p=game.captains[1]?2:1;game.active=p;if(!settings.captain){game.phase=settings.lineup?'order':'battle';route();return}Promise.all(game.teams[p].map(resolveImage)).then(img=>{app.innerHTML=`<section class="screen"><div class="phase"><div><h1>Captain wählen</h1><p>Kleiner Koordinations- und Clutch-Bonus.</p></div><span class="pill ${p===1?'p1c':'p2c'}">PLAYER ${p===1?'ONE':'TWO'}</span></div><div class="select-grid">${game.teams[p].map((c,i)=>`<button class="select" ${canAct(p)?'':'disabled'} onclick="dispatch('captain',{index:${i},player:${p}})"><img src="${img[i]}"><div><b>${esc(c.name)}</b><small>${c.role} · ${c.tier}</small></div></button>`).join('')}</div></section>`;if(online.mode==='local'&&p===2)passScreen(2,'Captain wählen')})}
function selectCaptain(index,p){if(game.active!==p)return;game.captains[p]=game.teams[p][index].id;game.history.push({type:'captain',p,id:game.captains[p]});if(game.captains[1]&&game.captains[2]){game.phase=settings.lineup?'order':'battle';game.active=1}else game.active=2;sync();route()}
function renderOrder(){const p=game.order[1].length?2:1;game.active=p;if(!settings.lineup){game.phase='battle';route();return}game._order=game._order||[];Promise.all(game.teams[p].map(resolveImage)).then(img=>{app.innerHTML=`<section class="screen"><div class="phase"><div><h1>Lineup 1–${TEAM_SIZE}</h1><p>Klicke die Priorität, in der dein Team die Matchups eröffnet.</p></div><span class="pill ${p===1?'p1c':'p2c'}">PLAYER ${p===1?'ONE':'TWO'} · ${game._order.length}/${TEAM_SIZE}</span></div><div class="select-grid">${game.teams[p].map((c,i)=>{const pos=game._order.indexOf(c.id);return `<button class="select" ${pos>=0||!canAct(p)?'disabled':''} onclick="orderPick('${c.id}')"><img src="${img[i]}"><div><b>${pos>=0?(pos+1)+' · ':''}${esc(c.name)}</b><small>${c.role}</small></div></button>`}).join('')}</div><div class="actions"><button class="btn secondary" onclick="game._order=[];renderOrder()">ZURÜCKSETZEN</button></div></section>`;if(online.mode==='local'&&p===2&&game._order.length===0)passScreen(2,'Lineup wählen')})}
function orderPick(id){if(game._order.includes(id))return;game._order.push(id);if(game._order.length===TEAM_SIZE)dispatch('order',{order:[...game._order],player:game.active});else renderOrder()}
function setOrder(order,p){game.order[p]=order;game._order=[];game.history.push({type:'order',p,order});if(game.order[1].length&&game.order[2].length){game.phase='battle';game.active=1}else game.active=2;sync();route()}
function rarityBonus(r){return {Rare:0,Epic:5,Legendary:10,God:15}[r]||0}
function impact(c){return c.power*1.02+c.hax*1.12+c.speed*.86+c.durability*.88+rarityBonus(c.rarity)}

const ROLE_EDGE={Assassin:{Mage:5,Support:5},Counter:{Bruiser:5,Mage:3},Summoner:{Assassin:5,Counter:2},Hax:{Bruiser:4},Bruiser:{Support:4},Mage:{Bruiser:3},Support:{Summoner:2}};
function traitCounter(a,b){if(!settings.counters)return {score:0,reasons:[]};let s=0,reasons=[];const A=new Set(a.tags),B=new Set(b.tags);for(const [atk,defs,val,why] of counterRules){if(A.has(atk)&&(!defs.length||defs.some(x=>B.has(x)))){s+=val;if(val>=6)reasons.push(why)}}if(B.has('infinity')&&!A.has('space')&&!A.has('concept')&&!A.has('reality')){s-=12;reasons.push('Infinity nimmt einem normalen direkten Treffer den Kontaktpunkt')}if(B.has('intangible')&&!A.has('space')&&!A.has('sense')&&!A.has('reality')){s-=9;reasons.push('Intangibility lässt den ersten Commit durch das Ziel hindurchlaufen')}if(B.has('barrier')&&!A.has('anti-magic')&&!A.has('concept')&&a.power<88){s-=5;reasons.push('die Barriereschicht frisst einen Teil des ersten Bursts')}if(B.has('regen')&&!A.has('concept')&&!A.has('absorb')&&!A.has('reality'))s-=3;if(a.speed>b.speed+14){s+=5;reasons.push('der deutliche Speed-Vorteil öffnet zuerst das Fenster')}if(a.hax>b.hax+18){s+=5;reasons.push('die Hax-Differenz zwingt eine spezielle Antwort statt eines normalen Trades')}s+=ROLE_EDGE[a.role]?.[b.role]||0;if((ROLE_EDGE[a.role]?.[b.role]||0)>=4)reasons.push(`${a.role} kann gegen ${b.role} taktisch ein günstiges Matchup erzwingen`);return {score:s,reasons:[...new Set(reasons)].slice(0,3)}}
function arenaMod(c,a){let s=0;if(a==='Megacity'){if(c.role==='Assassin')s+=7;if(c.tags.includes('environment'))s+=5;if(c.role==='Summoner')s+=4}if(a==='Fractured Multiverse'){if(c.tags.some(x=>['space','concept','reality','time'].includes(x)))s+=8}if(a==='Null Arena'){if(c.durability>90)s+=4}return s}
function event(){if(!settings.events)return {name:'Keine Modifikation',fn:c=>0};return pick([{name:'⚡ SPEED SURGE',fn:c=>c.speed*.05},{name:'🧿 HAX STORM',fn:c=>c.hax*.055},{name:'🥊 CLOSE QUARTERS',fn:c=>c.role==='Bruiser'?8:0},{name:'🌌 REALITY FRACTURE',fn:c=>c.tags.some(x=>['space','concept','reality'].includes(x))?9:0},{name:'🛡 LAST STAND',fn:c=>c.durability*.045},{name:'🎯 ASSASSIN WINDOW',fn:c=>c.role==='Assassin'?9:0}])}
function teamSynergy(p){if(!settings.synergy)return 0;const t=game.teams[p],roles=new Set(t.map(x=>x.role)).size;let s=roles*1.2;if(t.some(x=>x.role==='Support'))s+=3;if(t.some(x=>x.role==='Hax')&&t.some(x=>x.role==='Bruiser'))s+=2.5;if(t.some(x=>x.role==='Summoner')&&t.some(x=>x.role==='Assassin'))s+=2;return Math.min(14,s)}
function duelScore(a,b,arena,ev,p=1){const ctr=traitCounter(a,b),captain=game.captains[p]===a.id?7:0,base=impact(a)+arenaMod(a,arena)+ev.fn(a)+ctr.score*3.8+teamSynergy(p)+captain;return {score:Math.max(35,base),ctr}}
function orderedTeam(p){const ids=game.order[p]?.length?game.order[p]:game.teams[p].map(x=>x.id);return ids.map(id=>BY_ID.get(id)||game.teams[p].find(c=>c.id===id)).filter(Boolean)}

const ROLE_ACTIONS={Bruiser:['zieht den Kampf in einen harten direkten Clash, aber hält genug Timing für einen späten Richtungswechsel zurück','nimmt Raum mit konstantem Vorwärtsdruck und zwingt den Gegner, beim Rückzug gleichzeitig zu verteidigen','erzwingt einen Krafttest und verwandelt jeden verlorenen Meter in mehr Druck'],Hax:['greift Bedingungen des Matchups an statt nur den Körper','legt mehrere Effekte übereinander und zwingt eine spezielle Antwort','verschiebt Ursache, Wahrnehmung oder Raum zugunsten des eigenen Setups'],Assassin:['bricht die Sichtlinie und explodiert aus dem Blind Spot','wartet auf genau einen Fehltritt und komprimiert alles in einen kurzen Burst','spielt Distanz und Timing statt einen offenen Schlagabtausch'],Mage:['öffnet mehrere Fernangriffsachsen und hält die Distanz unter Kontrolle','baut einen mehrschichtigen Zauber auf und bindet damit Bewegung','nutzt Reichweite und Kontrolle, um Nahkampf zu verweigern'],Support:['stabilisiert das eigene Team und schafft ein Fenster für den nächsten Angriff','verändert Positionen und Timing zugunsten der eigenen Seite','nimmt einen ungünstigen Winkel in Kauf, um das Team-Setup zu retten'],Counter:['lockt den ersten Angriff bewusst heraus und verwandelt ihn in eine Gegenchance','spielt reaktiv und wartet darauf, dass die gegnerische Fähigkeit sich selbst öffnet','macht den gegnerischen Commit zum Startpunkt des eigenen Angriffs'],Summoner:['überzieht das Feld mit zusätzlichen Einheiten und mehreren Angriffswinkeln','erzwingt gleichzeitig Front- und Seitendruck durch Beschwörungen','nutzt Masse und Positionierung, damit ein einzelner Verteidiger nie alles abdecken kann']};
function sig(c,seed=0){const options=[];if(SIGNATURE_OVERRIDES[c.name])options.push(SIGNATURE_OVERRIDES[c.name]);for(const t of c.tags){if(TRAIT_ACTIONS[t])options.push(...TRAIT_ACTIONS[t])}options.push(...(ROLE_ACTIONS[c.role]||ROLE_ACTIONS.Bruiser));return options[hash(c.id+'|'+seed)%options.length]}
function defense(c,seed=0){const options=[];if(c.tags.includes('infinity'))options.push('Infinity stoppt den ersten direkten Zugriff; der Gegner muss Raum, Regeln oder Timing statt nur Distanz lösen.');if(c.tags.includes('intangible'))options.push('Der Körper verschwindet aus dem Kontaktfenster und lässt den ersten Commit ins Leere laufen.');if(c.tags.includes('regen'))options.push('Der erste saubere Treffer ist kein Finish: Regeneration bringt den Körper zurück und zwingt einen zweiten, besser abgesicherten Abschluss.');if(c.tags.includes('time'))options.push('Zeit-Manipulation zerlegt das normale Timing und macht einen eigentlich sicheren Treffer unsicher.');if(c.tags.includes('illusion'))options.push('Wahrnehmung und echter Standort passen nicht sauber zusammen; der Angreifer muss erst prüfen, ob das Ziel überhaupt real ist.');if(c.tags.includes('barrier'))options.push('Eine Barriere nimmt dem ersten Burst genug Energie, dass aus dem geplanten Finish nur ein Positionsgewinn wird.');if(c.durability>90)options.push('Die enorme Haltbarkeit frisst den ersten Burst. Erst kumulierter Schaden und verlorener Raum machen einen echten KO möglich.');options.push('Die Defensive hält den ersten Kontakt, verliert aber mit jedem erzwungenen Schritt etwas Raum und Information.');return options[hash(c.id+'def'+seed)%options.length]}
function composeDuelNarrative(winner,loser,ctr,arena,ev,turn,roundNo){const open=sig(winner,turn+roundNo*31),answer=sig(loser,turn+roundNo*47+7),def=defense(loser,turn),reasons=ctr.reasons.length?`Der entscheidende Matchup-Punkt: ${ctr.reasons.join('; ')}.`:'Hier gibt es keinen automatischen Hard-Counter; Timing, Ressourcen und Position entscheiden mehr als ein einzelnes Label.';const tempo=winner.speed>loser.speed+12?`${winner.name} besitzt den klareren Tempo-Vorteil. Das heißt nicht automatisch Sieg, aber der zweite Schritt beginnt, bevor ${loser.name} den ersten vollständig neu ausrichten kann.`:loser.speed>winner.speed+12?`${loser.name} ist nominell schneller und bekommt deshalb zuerst gute Winkel. ${winner.name} muss diese Geschwindigkeit lesen statt versuchen, sie stumpf zu überholen.`:`Beim Tempo liegen beide nah genug beieinander, dass Reads und Fähigkeiten wichtiger werden als eine reine Speed-Zahl.`;const hax=winner.hax>loser.hax+15?`${winner.name} zwingt mit der größeren Hax-Tiefe mehrere Verteidigungsfragen gleichzeitig auf.`:loser.hax>winner.hax+15?`${loser.name} hat auf dem Papier die gefährlicheren Spezialeffekte; der spätere Sieger muss deshalb den Kampf enger und kontrollierter halten.`:`Keiner kann den anderen nur mit Hax-Wert überfahren.`;return `${winner.name} ${open}. ${loser.name} antwortet nicht passiv, sondern ${answer}.\n\n${def} ${tempo} ${hax}\n\n${reasons} In ${arena} unter ${ev} wird deshalb der erste starke Kontakt noch nicht zum Ende. Beide Seiten ändern nach diesem Test ihre Linie. ${winner.name} täuscht den offensichtlichen Finisher an, zwingt ${loser.name} zu genau der passenden Defensive und greift erst den Raum an, der dadurch aufgegeben wird. Der nächste Zugriff sitzt sauberer als der erste; ${loser.name} findet keinen vollständigen Reset mehr und fällt aus dieser Runde.`}
function fightRound(arena,roundNo){const ev=event(),alive={1:orderedTeam(1).map(c=>clone(c)),2:orderedTeam(2).map(c=>clone(c))},revived={1:false,2:false},scenes=[];let turn=0;while(alive[1].length&&alive[2].length&&turn<48){const p=turn%2?2:1,q=p===1?2:1;let a=alive[p][0],b=alive[q][0];const A=duelScore(a,b,arena,ev,p),B=duelScore(b,a,arena,ev,q);let pa=A.score/(A.score+B.score);pa=Math.max(.13,Math.min(.87,pa));const awin=rng()<pa,winner=awin?a:b,loser=awin?b:a,wp=awin?p:q,lp=awin?q:p,ctr=awin?A.ctr:B.ctr;const tags=new Set(winner.tags);const effect=tags.has('fire')||tags.has('sun')||tags.has('rage')?'burn':tags.has('electric')||tags.has('ki')||tags.has('energy')?'lightning':tags.has('psychic')||tags.has('esper')?'psychicfx':tags.has('space')||tags.has('concept')||tags.has('reality')||tags.has('time')?'voidfx':'shatter';const text=composeDuelNarrative(winner,loser,ctr,arena,ev.name,turn,roundNo);scenes.push({kind:'ko',round:roundNo,arena,event:ev.name,attacker:winner,defender:loser,attackerP:wp,defenderP:lp,effect,text,title:`ROUND ${roundNo} · ${winner.name} vs ${loser.name}`});alive[lp]=alive[lp].filter(c=>c.id!==loser.id);if(settings.revive&&game.tokens[lp].revive&&!revived[lp]&&alive[lp].length<=2&&rng()<.42){revived[lp]=true;alive[lp].push(clone(loser));scenes.push({kind:'revive',round:roundNo,arena,attacker:loser,defender:winner,attackerP:lp,defenderP:wp,effect:'shatter',title:`REVIVE · ${loser.name}`,text:`Der KO bleibt nicht endgültig. Player ${lp===1?'One':'Two'} setzt den Revive ein: ${loser.name} kehrt angeschlagen zurück. Das ist kein vollständiger Reset — die vorher gezeigten Informationen bleiben beim Gegner. Gerade deshalb ändert ${loser.name} sofort die Eröffnung, während ${winner.name} versucht, den bekannten Finish ein zweites Mal zu erzwingen. Die Arena bekommt damit einen neuen Matchup-Winkel statt einfach denselben Kampf zu wiederholen.`})}if(alive[wp].length>1&&rng()<.62)alive[wp].push(alive[wp].shift());if(alive[lp].length>1&&rng()<.55)alive[lp].push(alive[lp].shift());turn++}const winner=alive[1].length?1:2;return {winner,arena,event:ev.name,scenes,remaining:{1:alive[1].map(x=>x.id),2:alive[2].map(x=>x.id)}}}
function simulateMatch(){hydrateRng();const arenas=settings.bestOf3?['Null Arena','Megacity','Fractured Multiverse']:['Null Arena'];const rounds=[];for(let i=0;i<arenas.length;i++){rounds.push(fightRound(arenas[i],i+1));if(settings.bestOf3&&rounds.filter(r=>r.winner===1).length===2)break;if(settings.bestOf3&&rounds.filter(r=>r.winner===2).length===2)break}const w1=rounds.filter(r=>r.winner===1).length,w2=rounds.length-w1,winner=w1>w2?1:2;const allScenes=[];rounds.forEach((r,i)=>{allScenes.push({kind:'intro',title:`ARENA ${i+1} · ${r.arena}`,arena:r.arena,event:r.event,attacker:game.teams[1][0],defender:game.teams[2][0],attackerP:1,defenderP:2,effect:'shatter',text:`Die ${r.arena} öffnet sich. ${r.event} verändert sofort die Bedingungen. Beide Teams kennen die gegnerischen Namen, aber nicht den exakten ersten Plan. Player One und Player Two testen Distanz, Hax und Reaktionszeit, bevor irgendjemand seinen stärksten Trumpf zeigt.`});allScenes.push(...r.scenes)});allScenes.push({kind:'suspense',title:'LETZTER CLASH',attacker:game.teams[winner][0],defender:game.teams[winner===1?2:1][0],attackerP:winner,defenderP:winner===1?2:1,effect:'voidfx',text:'Der letzte Einschlag frisst Farbe und Geräusch aus der Arena. Karten liegen verstreut, Rauch hängt vor der Kamera. Für ein paar Sekunden ist nicht sichtbar, welche Seite noch steht. Die Auswertung bleibt absichtlich verborgen.'});const impacts=[...game.teams[1].map(c=>({...c,p:1})),...game.teams[2].map(c=>({...c,p:2}))].sort((a,b)=>impact(b)-impact(a));return {winner,wins1:w1,wins2:w2,rounds,scenes:allScenes,mvp:impacts[0],prob:Math.round(50+Math.min(32,Math.abs(w1-w2)*10+Math.abs(teamImpact(1)-teamImpact(2))/7))}}
let battleState={i:0,timer:null,paused:false,nonce:0};
function startBattle(){game.phase='battle';if(!game.result){game.result=simulateMatch();sync()}battleState={i:0,timer:null,paused:false,nonce:0};renderBattleShell();showScene(0)}
function renderBattleShell(){app.innerHTML=`<section class="screen battle"><div class="cinema" id="cinema"><div class="arena-title"><small id="sceneK">CINEMATIC BATTLE</small><h2 id="sceneT">...</h2></div><div class="fighters"><div class="fighter" id="fa"><img><div class="name"></div></div><div class="versus">VS</div><div class="fighter" id="fb"><img><div class="name"></div></div></div><div class="storybox"><b id="storyTitle"></b><p id="storyText"></p></div><div class="ko" id="ko"></div></div><div class="actions"><button class="btn secondary" onclick="toggleBattlePause()" id="pauseBtn">⏸ PAUSE</button><button class="btn secondary" onclick="skipScene()">⏭ NEXT</button><button class="btn secondary" onclick="openVoice()">🎙 TTS</button></div></section>`}
async function showScene(i){clearTimeout(battleState.timer);stopTTS();const nonce=++battleState.nonce,s=game.result.scenes[i];if(!s)return revealWinner();battleState.i=i;const sceneK=$('#sceneK'),sceneT=$('#sceneT'),storyTitle=$('#storyTitle'),storyText=$('#storyText');if(!sceneK||!sceneT||!storyTitle||!storyText)return;sceneK.textContent=`${s.arena||'FINAL'} · ${s.event||'STORY'}`;sceneT.textContent=s.title;storyTitle.textContent=s.kind==='ko'?'ELIMINATION SEQUENCE':s.kind==='revive'?'COMEBACK':'BATTLE STORY';storyText.textContent=s.text;const [ia,ib]=await Promise.all([resolveImage(s.attacker),resolveImage(s.defender)]);if(nonce!==battleState.nonce)return;const A=$('#fa'),B=$('#fb');if(!A||!B)return;const ai=A.querySelector('img'),bi=B.querySelector('img'),an=A.querySelector('.name'),bn=B.querySelector('.name');if(!ai||!bi||!an||!bn)return;safeImg(ai,s.attacker);safeImg(bi,s.defender);ai.src=ia;bi.src=ib;an.textContent=s.attacker?.name||'PLAYER ONE';bn.textContent=s.defender?.name||'PLAYER TWO';A.className='fighter';B.className='fighter';if(s.kind==='ko'){const effectNonce=nonce;setTimeout(()=>{if(effectNonce!==battleState.nonce)return;const attackerCard=$('#fa'),victim=$('#fb'),cin=$('#cinema'),ko=$('#ko');if(!attackerCard||!victim||!cin||!ko)return;attackerCard.classList.add('aura-'+(s.effect||'shatter'));victim.classList.add(s.effect||'shatter');SFX.effect(s.effect);cin.classList.add('blur');ko.innerHTML=`<small>ELIMINATION CONFIRMED</small><br>${esc(s.attacker.name)} → ${esc(s.defender.name)}`;ko.classList.remove('show');void ko.offsetWidth;ko.classList.add('show');SFX.ko();setTimeout(()=>{if(effectNonce===battleState.nonce)cin?.classList.remove('blur')},700)},650)}SFX.hit();narrateBlock(s.text,()=>{if(nonce===battleState.nonce&&!battleState.paused)battleState.timer=setTimeout(()=>showScene(i+1),900)})}
function narrateBlock(text,done){if(settings.tts&&'speechSynthesis'in window){const u=new SpeechSynthesisUtterance(text);const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.name===localStorage.getItem('avg25-voice'))||vs.find(v=>v.lang?.startsWith('de'))||null;u.lang=u.voice?.lang||'de-DE';u.rate=Number(localStorage.getItem('avg25-rate')||.97);u.onend=done;u.onerror=()=>setTimeout(done,Math.min(24000,6000+text.split(/\s+/).length*90));speechSynthesis.speak(u)}else battleState.timer=setTimeout(done,Math.min(24000,6000+text.split(/\s+/).length*90))}
function toggleBattlePause(){battleState.paused=!battleState.paused;$('#pauseBtn').textContent=battleState.paused?'▶ WEITER':'⏸ PAUSE';if(battleState.paused)stopTTS();else showScene(battleState.i)}function skipScene(){stopTTS();showScene(battleState.i+1)}
function revealWinner(){battleState.nonce++;stopTTS();SFX.win();const r=game.result;modal(`<div class="kicker">FINAL REVEAL</div><div class="winner ${r.winner===1?'p1c':'p2c'}">PLAYER ${r.winner===1?'ONE':'TWO'}</div><h2 style="text-align:center">GEWINNT ${r.wins1}:${r.wins2}</h2><div class="modal-actions" style="justify-content:center"><button class="btn gold" onclick="closeModal();renderResult()">RESULTAT ÖFFNEN</button></div>`)}
function renderResult(){game.phase='result';sync();const r=game.result,kos=r.scenes.filter(s=>s.kind==='ko');app.innerHTML=`<section class="screen"><div class="result-hero"><div class="kicker">OFFICIAL MATCH RESULT · V${VERSION}</div><div class="winner ${r.winner===1?'p1c':'p2c'}">PLAYER ${r.winner===1?'ONE':'TWO'}</div><h2>GEWINNT ${r.wins1}:${r.wins2}</h2><p>MVP: <b>${esc(r.mvp.name)}</b> · ${kos.length} dokumentierte KOs · ${game.mode==='showfight'?esc(game.verse[1])+' vs '+esc(game.verse[2]):'Classic 7v7'}</p><div class="actions" style="justify-content:center"><button class="btn gold" onclick="replayBattle()">🎬 REPLAY + TTS</button><button class="btn secondary" onclick="requestRematch()">↻ REVANCHE</button><button class="btn secondary" onclick="home()">⌂ HOME</button></div></div><div class="result-grid"><div class="story"><h3>⚔️ Kampfgeschichte</h3>${r.scenes.map((s,i)=>`<div class="chapter"><b>${String(i+1).padStart(2,'0')} · ${esc(s.title)}</b><p>${esc(s.text)}</p></div>`).join('')}</div><div class="analytics"><h3>☠️ Kill Feed</h3><div class="ledger">${kos.map(s=>`<div><b class="${s.attackerP===1?'p1c':'p2c'}">${esc(s.attacker.name)}</b> → ${esc(s.defender.name)}</div>`).join('')}</div><h3>📊 Balance</h3><p>Player One Avg Impact: <b>${teamImpact(1).toFixed(1)}</b><br>Player Two Avg Impact: <b>${teamImpact(2).toFixed(1)}</b></p><p>God-Tiers: P1 ${teamTierCount(1,'God')} · P2 ${teamTierCount(2,'God')}<br>High-Tiers: P1 ${teamTierCount(1,'High')} · P2 ${teamTierCount(2,'High')}</p></div></div></section>`;loadImages()}
function replayBattle(){game.phase='battle';battleState={i:0,timer:null,paused:false,nonce:0};renderBattleShell();showScene(0)}
function requestRematch(){if(online.mode==='local'){const mode=game.mode,verse=clone(game.verse),allowed=clone(game.allowedVerses||Object.keys(VERSE_ROSTERS)),n=game.matchNo+1;game=newGame(mode);game.matchNo=n;game.verse=verse;game.allowedVerses=allowed;beginConfiguredGame();return}dispatch('rematch',{player:online.role})}
function doRematch(p){game.rematch[p]=!game.rematch[p];if(game.rematch[1]&&game.rematch[2]){const mode=game.mode,verse=clone(game.verse),allowed=clone(game.allowedVerses||Object.keys(VERSE_ROSTERS)),n=game.matchNo+1;game=newGame(mode);game.matchNo=n;game.verse=verse;game.allowedVerses=allowed;beginConfiguredGame()}else{sync();toast(`P${p} ${game.rematch[p]?'READY':'WAITING'} · gleicher Duel Code`);renderResult()}}

function handleGuestAction(a,p={}){
 if(a==='take')return hostGuestTake();
 if(a==='swap')return hostGuestSwap();
 if(a==='ack')return hostGuestAck();
 if(a==='specialRequest')return hostSpecialRequest(p.kind);
 if(a==='specialCancel')return hostSpecialCancel();
 if(a==='jokerChoose')return hostGuestJokerChoose(p.id);
 if(a==='doubleChoose')return hostGuestDoubleChoose(p.idx);
 if(a==='tradeCommit')return hostGuestTradeCommit(p.index);
 if(a==='skipTrade')return hostGuestSkipTrade();
 if(a==='ban')return doBan(p.id,2);
 if(a==='captain')return selectCaptain(p.index,2);
 if(a==='order')return setOrder(p.order,2);
 if(a==='rematch')return doRematch(2);
}
function hostGuestTake(){if(game.phase!=='draft'||game.active!==2||game.pendingRemote||!game.candidate)return;const c=clone(game.candidate),forced=game.forced;game.teams[2].push(c);game.history.push({type:forced?'forced':'take',p:2,id:c.id});game.candidate=null;game.forced=false;if(forced){game.pendingRemote={type:'forcedAck',player:2,taken:c};return sync()}const miss=drawCharacter(2);game.missed[2].push(miss);game.history.push({type:'missed',p:2,id:miss.id});game.pendingRemote={type:'takeAck',player:2,taken:c,missed:miss};sync()}
function hostGuestSwap(){if(game.phase!=='draft'||game.active!==2||game.pendingRemote||!game.candidate)return;const old=game.candidate;game.history.push({type:'swap',p:2,id:old.id});game.candidate=drawCharacter(2);game.forced=true;sync()}
function hostGuestAck(){if(!game.pendingRemote||game.pendingRemote.player!==2)return;delete game.pendingRemote;afterPick(2);sync()}
function hostSpecialRequest(kind){if(game.phase!=='draft'||game.active!==2||game.forced||game.pendingRemote||!game.candidate)return;if(kind==='joker'&&settings.joker&&game.tokens[2].joker){const a=drawCharacter(2),b=drawCharacter(2);game.pendingRemote={type:'joker',player:2,options:[a,b]}}else if(kind==='double'&&settings.double&&game.tokens[2].double){game.pendingRemote={type:'double',player:2,options:[drawCharacter(2),drawCharacter(2)]}}else if(kind==='mystery'&&settings.mystery&&game.tokens[2].mystery){const old=game.candidate,secret=drawCharacter(2);secret.mystery=true;game.tokens[2].mystery=0;game.teams[2].push(secret);game.history.push({type:'mystery',p:2,id:secret.id,discarded:old.id});game.candidate=null;game.pendingRemote={type:'mysteryAck',player:2,secret};}sync()}

function createRoom(mode='classic',verse=null){settings.powerCap=$('#powerCap')?.value||settings.powerCap;game=newGame(mode);if(verse)game.verse=verse;game.phase='lobby';online={mode:'host',role:1,room:String(Math.floor(100000+Math.random()*900000)),connected:false};Net.session=Net.id('s');Net.connect('host',online.room);renderLobby()}
function joinPrompt(){modal(`<button class="x" onclick="closeModal()">×</button><h2>Room beitreten</h2><input id="roomin" maxlength="6" inputmode="numeric" placeholder="123456" style="width:100%;padding:13px;background:#080d18;border:1px solid var(--border);color:#fff;border-radius:10px"><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">ZURÜCK</button><button class="btn p2" onclick="joinRoom()">JOIN</button></div>`)}
function joinRoom(){const code=$('#roomin').value.trim();if(!/^\d{6}$/.test(code))return toast('6-stelligen Code eingeben.');closeModal();game=newGame('classic');game.phase='lobby';online={mode:'guest',role:2,room:code,connected:false};Net.connect('guest',code);renderLobby()}
function renderLobby(){if(!online.room)return;const status=Net.clients.map(x=>`<span class="${x.connected?'on':''}">${x.name} ${x.connected?'●':'○'}</span>`).join('');app.innerHTML=`<section class="screen"><div class="card lobby" style="padding:28px"><div class="kicker">ONLINE DUEL · ${online.mode==='host'?'HOST':'GUEST'}</div><h1>${game?.mode==='showfight'?'SHOWFIGHT':'CLASSIC'} ROOM</h1><div class="roomcode">${online.room}</div><div class="net">${status}</div><p>${online.connected?'Player One und Player Two sind verbunden.':'Relay verbunden? Dann warte auf den zweiten Spieler.'}</p>${game?.mode==='showfight'&&game.verse[1]?`<p><b>${esc(game.verse[1])}</b> vs <b>${esc(game.verse[2])}</b></p>`:game?.mode==='classic'?`<p><b>${selectedVerseCount()}</b> von ${Object.keys(VERSE_ROSTERS).length} Verse im Draft-Pool.</p>`:''}<div class="actions" style="justify-content:center">${online.mode==='host'?`<button class="btn secondary" onclick="copyInvite()">🔗 INVITE LINK</button>${game?.mode==='classic'?`<button class="btn secondary" onclick="classicVerseSetup('host')">☑ VERSE AUSWÄHLEN</button>`:''}<button class="btn" ${online.connected?'':'disabled'} onclick="beginConfiguredGame()">MATCH STARTEN</button>`:''}<button class="btn danger" onclick="leaveRoom()">ROOM VERLASSEN</button></div></div></section>`}
function copyInvite(){const u=location.origin+location.pathname+'#room='+online.room;navigator.clipboard?.writeText(u).then(()=>toast('Einladungslink kopiert.')).catch(()=>toast(u))}
function leaveRoom(){Net.close();online={mode:'local',role:1,room:null,connected:false};home()}
function sync(){if(online.mode==='host')Net.sendState()}
/* deep-link join */
setTimeout(()=>{const m=location.hash.match(/room=(\d{6})/);if(m&&!game){online={mode:'guest',role:2,room:m[1],connected:false};game=newGame('classic');game.phase='lobby';Net.connect('guest',m[1]);renderLobby()}},40);

ensureMusicDock();home();
