/* ===== AVG V2 — CINEMATIC UI LAYER ===== */
:root{
  --bg:#050711;--panel:#0d1220;--panel2:#121a2b;--text:#f7f9ff;--muted:#93a0ba;
  --p1:#48e7ff;--p1b:#4f7cff;--p2:#ff4f91;--p2b:#9f55ff;--gold:#ffd76a;
  --good:#5ef2a0;--bad:#ff6d7a;--border:rgba(255,255,255,.085);

html{scroll-behavior:smooth} body{background:
 radial-gradient(circle at 15% -10%,rgba(79,124,255,.12),transparent 32%),

,255,.5)}.round-dot.p2{background:var(--p2);box-shadow:0 0 15px rgba(255,79,145,.5)}

function C(name,franchise,source,tier,rarity,role,power,hax,speed,durability,tags){return {id:slug(name),name,franchise,source,tier,rarity,role,power,hax,speed,durability,tags};}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

const modalRoot = document.querySelector('#modalRoot');
const toastEl = document.querySelector('#toast');

const SETTINGS_DEFAULT = {powerCap:'No Limit',franchiseLimit:true,joker:true,ban:true,synergy:true,counters:true,captain:true,lineup:true,revive:true,mystery:true,trade:true,double:true,events:true,bestOf3:true,tts:true};
let settings={...SETTINGS_DEFAULT};
let game=null, online={mode:'local',peer:null,conn:null,role:1,room:null,connected:false};

function newGame(seed=Date.now()){
  return {seed, rng:mulberry32(seed>>>0), phase:'ban', active:1, turnPicks:0, roundBlock:1, candidate:null, forced:false,
    bans:{1:null,2:null}, teams:{1:[],2:[]}, missed:{1:[],2:[]}, discarded:[],
    tokens:{1:{joker:1,double:1,mystery:1,revive:1,trade:1},2:{joker:1,double:1,mystery:1,revive:1,trade:1}},
    captains:{1:null,2:null}, order:{1:[],2:[]}, tradeDone:{1:false,2:false}, history:[], result:null};
}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function rint(max){return Math.floor(game.rng()*max)}
function choose(arr){return arr[rint(arr.length)]}
function deepClone(x){return JSON.parse(JSON.stringify(x))}

function renderHome(){game=null;app.innerHTML=`<section class="screen"><div class="hero"><div class="hero-copy"><div class="kicker">Draft. Risk. Counter. Dominate.</div><h1>ANIME <span>VERSUS GAME</span></h1><p class="lede">Baue ein 6er-Team im 1v1-Draft. Nimmst du den Charakter, siehst du danach, welchen du verpasst hast. Wechselst du, ist der nächste Pick Pflicht. Dazu kommen Bans, Joker, Mystery Slots, Trades, Captains, Counter, Synergien, Arena-Events und ein Best-of-3-Finale mit TTS.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:26px"><button class="btn" onclick="startLocal()">🎮 Lokales 1v1</button><button class="btn p2" onclick="createOnline()">🌐 Online Room erstellen</button><button class="btn secondary" onclick="joinPrompt()">🔗 Room beitreten</button></div></div><div class="hero-panel"><div class="mode-card"><div><strong>Take / Switch</strong><p>Jede Entscheidung kann dein Team retten — oder komplett ruinieren.</p></div><div class="emoji">🎲</div></div><div class="mode-card"><div><strong>6 + 6 Draft</strong><p>Immer zwei Picks pro Spieler, dann wechselt der Zug.</p></div><div class="emoji">⚔️</div></div><div class="mode-card"><div><strong>Best of 3</strong><p>Drei Arenen, Counters, Synergien und zufällige Events.</p></div><div class="emoji">🏆</div></div><div class="mode-card"><div><strong>Voice Finale</strong><p>Die Kampfstory kann am Ende automatisch vorgelesen werden.</p></div><div class="emoji">🔊</div></div></div></div>${settingsHTML()}</section>`; bindSettings();}

function settingsHTML(){
 const toggles=[['franchiseLimit','Franchise-Limit','Maximal ein Charakter pro Franchise im Team.'],['joker','Joker','Einmal zwei neue Charaktere sehen und einen wählen.'],['ban','Ban-System','Jeder bannt vor dem Draft einen Charakter.'],['synergy','Synergie','Team-Komposition beeinflusst das Finale.'],['counters','Counter','Hax/Rollen/TAGs können Matchups kontern.'],['captain','Captain','Nach dem Draft bekommt ein Charakter den Captain-Bonus.'],['lineup','Kampfreihenfolge','Jeder bestimmt seine Reihenfolge 1–6.'],['revive','Revive Token','Einmalige Comeback-Chance im Finale.'],['mystery','Mystery Slot','Ein Pick pro Team bleibt bis zum Finale verborgen.'],['trade','Trade-Runde','Nach Pick 4 darf einmal risikoreich getauscht werden.'],['double','Double or Nothing','Einmal Power-Duell zwischen zwei verdeckten Picks.'],['events','Arena-Events','Zufällige faire Modifikatoren im Best-of-3.'],['bestOf3','Best-of-3','Drei Szenarien statt nur einem Kampf.'],['tts','TTS','Finale automatisch vorlesen lassen.']];
 return `<div class="section-title"><div><h2>Match-Regeln</h2><p>Alles ist einzeln abschaltbar.</p></div></div><div class="settings"><div class="setting"><label>Power Cap</label><select id="powerCap"><option>No Limit</option><option>God</option><option>High</option><option>Mid</option></select><small>Begrenzt die maximale Stärke im Draft.</small></div>${toggles.map(([k,n,d])=>`<div class="setting"><label>${n}<input class="switch" type="checkbox" data-setting="${k}" ${settings[k]?'checked':''}></label><small>${d}</small></div>`).join('')}</div>`;
}
function bindSettings(){document.querySelectorAll('[data-setting]').forEach(x=>x.onchange=()=>settings[x.dataset.setting]=x.checked); const pc=document.querySelector('#powerCap'); if(pc){pc.value=settings.powerCap;pc.onchange=()=>settings.powerCap=pc.value;}}

function startLocal(){online={mode:'local',peer:null,conn:null,role:1,room:null,connected:false}; settings.powerCap=document.querySelector('#powerCap')?.value||settings.powerCap; game=newGame(Date.now()); renderBan();}

function createOnline(){
 settings.powerCap=document.querySelector('#powerCap')?.value||settings.powerCap;
 if(typeof Peer==='undefined'){toast('Online-Modul konnte nicht geladen werden. Lokales 1v1 funktioniert trotzdem.');return;}
 game=newGame(Date.now()); online.mode='host';online.role=1;online.room=Math.floor(100000+rnd()*900000).toString();
 const id='avg-'+online.room;
 try{online.peer=new Peer(id);online.peer.on('open',()=>{renderOnlineLobby('host');});online.peer.on('connection',conn=>{online.conn=conn;wireConn(conn,true);});online.peer.on('error',e=>{toast('Room konnte nicht erstellt werden: '+e.type);});}catch(e){toast('Online-Room nicht verfügbar.');}
 renderOnlineLobby('host');
}
function rnd(){return Math.random()}
function joinPrompt(){modal(`<h2>Room beitreten</h2><p>Gib den 6-stelligen Room-Code von Player One ein.</p><input id="roomInput" class="search-box" maxlength="6" inputmode="numeric" placeholder="123456"><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn p2" onclick="joinOnline()">Beitreten</button></div>`)}
function joinOnline(){const code=document.querySelector('#roomInput').value.trim(); if(!/^\d{6}$/.test(code)){toast('Bitte einen 6-stelligen Code eingeben.');return;} closeModal(); if(typeof Peer==='undefined'){toast('Online-Modul konnte nicht geladen werden.');return;} online.mode='guest';online.role=2;online.room=code;renderOnlineLobby('guest'); online.peer=new Peer();online.peer.on('open',()=>{const conn=online.peer.connect('avg-'+code,{reliable:true});online.conn=conn;wireConn(conn,false);}); online.peer.on('error',e=>toast('Verbindung fehlgeschlagen: '+e.type));}
function wireConn(conn,isHost){conn.on('open',()=>{online.connected=true;if(isHost){sendState();} else conn.send({type:'hello'}); renderOnlineLobby(online.mode);});conn.on('data',data=>{if(data.type==='state'){game=data.game;settings=data.settings;routeRender();}else if(data.type==='action'&&isHost){handleRemoteAction(data.action,data.payload);}else if(data.type==='hello'&&isHost){sendState();}});conn.on('close',()=>{online.connected=false;toast('Online-Verbindung getrennt.');});}
function sendState(){if(online.conn?.open)online.conn.send({type:'state',game:serializableGame(),settings});}
function serializableGame(){const g=deepClone(game); delete g.rng; return g;}
function hydrateGame(){if(game&&!game.rng)game.rng=mulberry32(game.seed>>>0)}
function renderOnlineLobby(kind){app.innerHTML=`<section class="screen"><div class="phase-head"><div class="phase-title"><h1>${kind==='host'?'Online Room':'Room beitreten'}</h1><p>Peer-to-peer 1v1. Player One hostet, Player Two joint.</p></div><span class="online-status"><i class="dot ${online.connected?'live':''}"></i>${online.connected?'Verbunden':'Warte auf Verbindung'}</span></div><div class="hero-panel" style="max-width:650px;margin:auto"><div class="kicker">ROOM CODE</div><div class="lobby-code">${online.room||'------'}</div><p class="small-note">Teile diesen Code mit Player Two. Sobald beide verbunden sind, synchronisiert Player One den Match-Status.</p>${kind==='host'?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="copyInvite()">🔗 Einladungslink kopieren</button><button class="btn" ${online.connected?'':'disabled'} onclick="beginOnline()">Match starten</button></div>`:''}</div></section>`}
function beginOnline(){if(!online.connected)return;game.phase='ban';sendState();renderBan();}

function copyInvite(){
  if(!online.room)return;
  if(!/^https?:$/.test(location.protocol)){toast('Für einen extern teilbaren Link muss die HTML-Datei zuerst auf einem Webhost liegen. Den Room-Code kannst du aber direkt teilen.');return;}
  const url=location.origin+location.pathname+'#room='+online.room;
  navigator.clipboard?.writeText(url).then(()=>toast('Einladungslink kopiert.')).catch(()=>{modal(`<h2>Einladungslink</h2><input class="search-box" value="${url}" readonly><div class="modal-actions"><button class="btn" onclick="closeModal()">OK</button></div>`)});
}

function routeRender(){hydrateGame(); if(!game){renderHome();return;} if(game.phase==='ban')renderBan(); else if(game.phase==='draft')renderDraft(); else if(game.phase==='captain')renderCaptain(); else if(game.phase==='order')renderOrder(); else if(game.phase==='result')renderResult();}

function canLocalAct(player){return online.mode==='local'||online.role===player||online.mode==='host'&&player===1;}
function dispatchAction(action,payload={}){if(online.mode==='guest'){online.conn?.send({type:'action',action,payload});return;}handleRemoteAction(action,payload);}
function handleRemoteAction(action,payload){hydrateGame();const map={ban:()=>doBan(payload.id,payload.player),take:()=>takePick(payload),swap:()=>swapPick(payload),joker:()=>useJoker(),double:()=>useDouble(),mystery:()=>toggleMystery(),trade:()=>tradeCharacter(payload.index),skipTrade:()=>skipTrade(),captain:()=>selectCaptain(payload.index,payload.player),order:()=>setOrder(payload.order,payload.player)}; if(map[action])map[action]();}

function renderBan(){
 if(!settings.ban){game.phase='draft';game.candidate=drawCharacter();renderDraft();sync();return;}
 const p=game.bans[1]?2:1;game.active=p;
 const disabled=!canLocalAct(p);
 app.innerHTML=`<section class="screen"><div class="phase-head"><div class="phase-title"><h1>Ban Phase</h1><p>Jeder entfernt genau einen Charakter aus diesem Match.</p></div><span class="turn-pill p${p}">PLAYER ${p===1?'ONE':'TWO'} BANNT</span></div><div class="ban-grid"><div class="ban-panel"><h3>Player One</h3><p class="small-note">${game.bans[1]?`Gebannt: <b>${byId(game.bans[1]).name}</b>`:'Noch kein Ban'}</p></div><div class="ban-panel"><h3>Player Two</h3><p class="small-note">${game.bans[2]?`Gebannt: <b>${byId(game.bans[2]).name}</b>`:'Noch kein Ban'}</p></div></div><div class="ban-panel" style="margin-top:18px"><input class="search-box" id="banSearch" placeholder="Charakter oder Franchise suchen…" ${disabled?'disabled':''}><div class="ban-list" id="banList"></div></div></section>`;
 const search=document.querySelector('#banSearch'); const renderList=()=>{const q=(search.value||'').toLowerCase();const list=eligiblePool(true).filter(c=>!Object.values(game.bans).includes(c.id)&&(`${c.name} ${c.franchise}`).toLowerCase().includes(q)).slice(0,50);document.querySelector('#banList').innerHTML=list.map(c=>`<button class="ban-item" ${disabled?'disabled':''} onclick="dispatchAction('ban',{id:'${c.id}',player:${p}})"><span><b>${c.name}</b><br><small>${c.franchise} · ${c.tier}</small></span><span>✕</span></button>`).join('')}; search?.addEventListener('input',renderList);renderList(); if(online.mode==='local'&&p===2&&!game.bans[2])maybePass(2,'Ban auswählen');
}
function doBan(id,p){if(game.active!==p||game.bans[p])return;game.bans[p]=id;game.history.push({type:'ban',p,id});if(game.bans[1]&&game.bans[2]){game.phase='draft';game.active=1;game.turnPicks=0;game.candidate=drawCharacter();sync();renderDraft();if(online.mode==='local')showPass(1,'Draft beginnt');}else{sync();renderBan();}}

function eligiblePool(forBan=false){
 const tierRank={Mid:1,High:2,God:3,'No Limit':9}; const max=tierRank[settings.powerCap]||9;
 return CHARACTERS.filter(c=>tierRank[c.tier]<=max && !game?.discarded.includes(c.id) && !Object.values(game?.bans||{}).includes(c.id) && !game?.teams[1].some(x=>x.id===c.id) && !game?.teams[2].some(x=>x.id===c.id));
}
function drawCharacter(player=game.active){let pool=eligiblePool(); if(settings.franchiseLimit){const fr=new Set(game.teams[player].map(x=>x.franchise));const filtered=pool.filter(c=>!fr.has(c.franchise));if(filtered.length)pool=filtered;} if(!pool.length)pool=eligiblePool(); const c=deepClone(choose(pool));game.discarded.push(c.id);return c;}
function byId(id){return CHARACTERS.find(c=>c.id===id)}

function renderDraft(){
 if(!game.candidate&&game.teams[1].length<6&&game.teams[2].length<6)game.candidate=drawCharacter();
 const p=game.active, c=game.candidate, disabled=!canLocalAct(p);
 app.innerHTML=`<section class="screen"><div class="phase-head"><div class="phase-title"><h1>Draft Arena</h1><p>Zwei Picks pro Spieler. Danach wechselt der Zug.</p></div><span class="turn-pill p${p}">PLAYER ${p===1?'ONE':'TWO'} · PICK ${game.teams[p].length+1}/6</span></div><div class="mobile-teams"><div class="turn-pill p1">P1 ${game.teams[1].length}/6</div><div class="turn-pill p2">P2 ${game.teams[2].length}/6</div></div><div class="draft-layout"><div class="team-panel left">${teamHTML(1)}</div><div class="center-stage"><div class="pick-counter">${game.forced?'<div class="forced-banner">⚠️ SWITCH — DIESER CHARAKTER IST PFLICHT</div>':''}</div><div id="candidateCard"></div><div class="action-panel"><button class="btn" ${disabled?'disabled':''} onclick="dispatchAction('take')">✓ NEHMEN</button><button class="btn p2" ${disabled||game.forced?'disabled':''} onclick="dispatchAction('swap')">↻ WECHSELN</button></div><div class="special-actions"><button class="btn gold" ${disabled||!settings.joker||!game.tokens[p].joker||game.forced?'disabled':''} onclick="dispatchAction('joker')">🃏 JOKER</button><button class="btn secondary" ${disabled||!settings.double||!game.tokens[p].double||game.forced?'disabled':''} onclick="dispatchAction('double')">🎰 DOUBLE</button><button class="btn secondary" ${disabled||!settings.mystery||!game.tokens[p].mystery?'disabled':''} onclick="dispatchAction('mystery')">🕵️ MYSTERY ${game._mysteryArmed?'ON':'OFF'}</button></div><p class="decision-hint">Nehmen = nächster Charakter wird als „verpasst“ aufgedeckt. Wechseln = nächster Charakter ist Pflicht.</p></div><div class="team-panel right">${teamHTML(2)}</div></div></section>`;
 mountCard(document.querySelector('#candidateCard'),c); if(online.mode==='local'&&game._needsPass){game._needsPass=false;showPass(p,'Du bist dran');}
}
function teamHTML(p){const hiddenToViewer=(x)=>x.mystery&&online.mode!=='local'&&online.role!==p&&game.phase!=='result';return `<h3 style="color:var(--p${p})">PLAYER ${p===1?'ONE':'TWO'}</h3>${Array.from({length:6},(_,i)=>{const x=game.teams[p][i]; if(!x)return `<div class="team-slot"><div class="avatar-fallback"></div><div><strong>Slot ${i+1}</strong><small>Leer</small></div></div>`;const hide=hiddenToViewer(x);return `<div class="team-slot ${hide?'mystery-slot':''}"><img data-char-img="${x.id}" alt="${hide?'Mystery':x.name}"><div><strong>${hide?'MYSTERY PICK':x.name}</strong><small>${hide?'???':x.role+' · '+x.rarity}</small></div>${game.captains[p]===x.id?'👑':''}</div>`}).join('')}<div class="token-row">${tokenHTML(p,'joker','Joker')} ${tokenHTML(p,'double','Double')} ${tokenHTML(p,'mystery','Mystery')} ${tokenHTML(p,'trade','Trade')} ${tokenHTML(p,'revive','Revive')}</div>`}
function tokenHTML(p,k,label){return `<span class="token ${game.tokens[p][k]?'':'used'}">${label}</span>`}

async function mountCard(root,c){const tpl=document.querySelector('#characterCardTpl').content.cloneNode(true); const card=tpl.querySelector('.character-card');card.querySelector('h2').textContent=c.name;card.querySelector('.eyebrow').textContent=c.franchise;card.querySelector('.rarity-badge').textContent=c.rarity.toUpperCase();card.querySelector('.source-badge').textContent=c.source.toUpperCase();card.querySelector('.tag-row').innerHTML=[c.role,...c.tags.slice(0,4)].map(t=>`<span class="tag">${t}</span>`).join('');card.querySelector('.stat-grid').innerHTML=[['PWR',c.power],['HAX',c.hax],['SPD',c.speed],['DUR',c.durability]].map(([n,v])=>`<div class="stat"><b>${v}</b><small>${n}</small></div>`).join('');root.replaceChildren(card);await setImg(card.querySelector('img'),c);}
async function setImg(img,c){img.alt=c.name;const u=await resolveImage(c);if(u){img.src=u;img.onload=()=>img.classList.add('loaded');img.onerror=()=>{img.classList.remove('loaded');img.style.display='none';}}}
async function resolveImage(c){if(imgCache[c.id])return imgCache[c.id]; try{if(c.source==='Anime'){
   const r=await fetch('https://api.jikan.moe/v4/characters?q='+encodeURIComponent(c.name.replace(/\s*\(.+\)$/,''))+'&limit=1');if(r.ok){const j=await r.json();const u=j.data?.[0]?.images?.jpg?.image_url;if(u){imgCache[c.id]=u;persistImgs();return u;}}}
 }catch(e){}
 try{const title=encodeURIComponent(c.name.replace(/\s*\(.+\)$/,''));const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+title);if(r.ok){const j=await r.json();const u=j.thumbnail?.source||j.originalimage?.source;if(u){imgCache[c.id]=u;persistImgs();return u;}}}catch(e){}
 return svgAvatar(c);
}
function svgAvatar(c){const initials=c.name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#202b45"/><stop offset="1" stop-color="#0b0f19"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="450" cy="360" r="170" fill="#39445e"/><path d="M170 900c35-230 170-350 280-350s245 120 280 350" fill="#2b344b"/><text x="450" y="400" text-anchor="middle" fill="#fff" font-family="Arial" font-size="120" font-weight="900">${initials}</text><text x="450" y="835" text-anchor="middle" fill="#aeb8d0" font-family="Arial" font-size="34">${c.name}</text></svg>`)}`}
function persistImgs(){localStorage.setItem('avg-img-cache',JSON.stringify(imgCache))}

function toggleMystery(){if(!settings.mystery||!game.tokens[game.active].mystery)return;game._mysteryArmed=!game._mysteryArmed;renderDraft();}
function takePick(){const p=game.active;const wasForced=game.forced;const taken=deepClone(game.candidate);taken.mystery=!!game._mysteryArmed;if(taken.mystery){game.tokens[p].mystery=0;game._mysteryArmed=false;}game.teams[p].push(taken);game.history.push({type:wasForced?'forced-take':'take',p,id:taken.id});game.forced=false;game.candidate=null;if(wasForced){sync();modal(`<h2>⚠️ Pflichtpick</h2><p><b>${taken.name}</b> ist jetzt fest in deinem Team. Weil dieser Pick durch WECHSELN erzwungen wurde, gibt es hier keinen zusätzlichen „verpassten“ Charakter.</p><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">Weiter</button></div>`);return;}const missed=drawCharacter(p);game.missed[p].push(missed);game.history.push({type:'missed',p,id:missed.id});sync();showReveal(taken,missed,p,()=>afterPick(p));}
function swapPick(){const p=game.active;const old=deepClone(game.candidate);game.history.push({type:'swap',p,id:old.id});const forced=drawCharacter(p);game.candidate=forced;game.forced=true;sync();modal(`<h2>🎲 Wechsel bestätigt</h2><p><b>${old.name}</b> ist raus. Der nächste Charakter ist jetzt Pflicht — kein Zurück.</p><div class="modal-actions"><button class="btn p2" onclick="closeModal();renderDraft()">Pflichtpick ansehen</button></div>`)}
function afterPick(p){if(settings.trade&&game.teams[p].length===4&&!game.tradeDone[p]&&game.tokens[p].trade){showTradePrompt(p);return;}advanceTurn(p);}
function advanceTurn(p){
 if(game.teams[1].length>=6&&game.teams[2].length>=6){game.phase=settings.captain?'captain':(settings.lineup?'order':'result');game.active=1;sync();if(game.phase==='captain')renderCaptain();else if(game.phase==='order')renderOrder();else simulateAndRender();return;}
 game.turnPicks++;if(game.turnPicks>=2||game.teams[p].length>=6){game.turnPicks=0;game.active=p===1?2:1;game._needsPass=online.mode==='local';}
 if(game.teams[game.active].length>=6)game.active=game.active===1?2:1;
 game.candidate=drawCharacter(game.active);sync();renderDraft();
}
function showReveal(taken,missed,p,cb){Promise.all([resolveImage(taken),resolveImage(missed)]).then(([a,b])=>modal(`<div class="kicker">PLAYER ${p===1?'ONE':'TWO'} · ENTSCHEIDUNG</div><h2>Du nimmst ${taken.name}</h2><div class="reveal"><div class="mini-card"><div class="pic"><img src="${a}"></div><div class="copy"><h3>${taken.name}</h3><p>${taken.franchise} · ${taken.rarity}</p></div></div><div class="reveal-vs">VERPASST</div><div class="mini-card missed"><div class="pic"><img src="${b}"></div><div class="copy"><h3>❌ ${missed.name}</h3><p>${missed.franchise} · ${missed.rarity}</p></div></div></div><div class="modal-actions"><button class="btn" id="continueReveal">Weiter</button></div>`));setTimeout(()=>{const x=document.querySelector('#continueReveal');if(x)x.onclick=()=>{closeModal();cb();}},0)}

function useJoker(){const p=game.active;if(!game.tokens[p].joker)return;game.tokens[p].joker=0;const a=drawCharacter(p),b=drawCharacter(p);Promise.all([resolveImage(a),resolveImage(b)]).then(([ia,ib])=>modal(`<h2>🃏 Joker</h2><p>Wähle einen von zwei neuen Charakteren. Die Wahl ist endgültig.</p><div class="reveal"><button class="select-card" onclick="jokerChoose('${a.id}')"><img src="${ia}"><div><strong>${a.name}</strong><small>${a.franchise} · ${a.tier}</small></div></button><div class="reveal-vs">ODER</div><button class="select-card" onclick="jokerChoose('${b.id}')"><img src="${ib}"><div><strong>${b.name}</strong><small>${b.franchise} · ${b.tier}</small></div></button></div>`));game._jokerChoices=[a,b];sync();}
function jokerChoose(id){const p=game.active;const c=game._jokerChoices.find(x=>x.id===id);const other=game._jokerChoices.find(x=>x.id!==id);c.mystery=!!game._mysteryArmed;if(c.mystery){game.tokens[p].mystery=0;game._mysteryArmed=false;}game.teams[p].push(c);game.missed[p].push(other);game.history.push({type:'joker',p,id:c.id,missed:other.id});delete game._jokerChoices;game.candidate=null;closeModal();sync();showReveal(c,other,p,()=>afterPick(p));}

function useDouble(){const p=game.active;if(!game.tokens[p].double)return;game.tokens[p].double=0;const a=drawCharacter(p),b=drawCharacter(p);game._doubleChoices=[a,b];modal(`<h2>🎰 Double or Nothing</h2><p>Zwei verdeckte Charaktere. Wähle A oder B und hoffe, dass du den höheren Power Index erwischst. Richtig = stärkerer Pick, falsch = schwächerer Pick.</p><div class="action-panel"><button class="btn gold" onclick="doubleGuess(0)">KARTE A</button><button class="btn p2" onclick="doubleGuess(1)">KARTE B</button></div>`);sync();}
function doubleGuess(idx){const p=game.active,[a,b]=game._doubleChoices;const score=x=>x.power+x.hax+x.speed+x.durability;const stronger=score(a)>=score(b)?a:b, weaker=stronger.id===a.id?b:a;const guessed=game._doubleChoices[idx];const correct=guessed.id===stronger.id;const pick=correct?stronger:weaker;const missed=correct?weaker:stronger;pick.mystery=!!game._mysteryArmed;if(pick.mystery){game.tokens[p].mystery=0;game._mysteryArmed=false;}game.teams[p].push(pick);game.missed[p].push(missed);game.history.push({type:'double',p,id:pick.id,correct});delete game._doubleChoices;closeModal();modal(`<h2>${correct?'🔥 RICHTIG!':'💀 FALSCH!'}</h2><p>Du bekommst <b>${pick.name}</b>. ${correct?'Du hast den stärkeren der beiden erwischt.':'Der stärkere Pick wäre '+missed.name+' gewesen.'}</p><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">Weiter</button></div>`);sync();}

function showTradePrompt(p){modal(`<h2>♻️ Trade-Runde</h2><p>Player ${p===1?'One':'Two'} hat vier Picks. Du darfst jetzt <b>einmal</b> einen eigenen Charakter opfern und bekommst dafür einen neuen zufälligen Pflichtpick. Willst du traden?</p><div class="modal-actions"><button class="btn secondary" onclick="dispatchAction('skipTrade')">Behalten</button><button class="btn gold" onclick="showTradeChoices()">Trade nutzen</button></div>`)}
function showTradeChoices(){const p=game.active;closeModal();Promise.all(game.teams[p].map(resolveImage)).then(imgs=>modal(`<h2>Welchen Pick opferst du?</h2><div class="trade-grid">${game.teams[p].map((x,i)=>`<button class="select-card" onclick="dispatchAction('trade',{index:${i}})"><img src="${imgs[i]}"><div><strong>${x.name}</strong><small>${x.franchise}</small></div></button>`).join('')}</div>`))}
function tradeCharacter(index){const p=game.active;if(!game.tokens[p].trade)return;game.tokens[p].trade=0;game.tradeDone[p]=true;const old=game.teams[p][index];const fresh=drawCharacter(p);game.teams[p][index]=fresh;game.history.push({type:'trade',p,old:old.id,id:fresh.id});closeModal();sync();modal(`<h2>♻️ Trade abgeschlossen</h2><p><b>${old.name}</b> ist weg. Dein Pflicht-Ersatz ist <b>${fresh.name}</b>.</p><div class="modal-actions"><button class="btn" onclick="closeModal();advanceTurn(${p})">Weiter</button></div>`)}
function skipTrade(){const p=game.active;game.tradeDone[p]=true;closeModal();sync();advanceTurn(p)}

function renderCaptain(){const p=game.captains[1]?2:1;game.active=p;if(!settings.captain){game.phase=settings.lineup?'order':'result';routeRender();return;}Promise.all(game.teams[p].map(resolveImage)).then(imgs=>{app.innerHTML=`<section class="screen"><div class="phase-head"><div class="phase-title"><h1>Captain wählen</h1><p>Der Captain erhält im Finale einen kleinen Koordinations- und Clutch-Bonus.</p></div><span class="turn-pill p${p}">PLAYER ${p===1?'ONE':'TWO'}</span></div><div class="captain-grid">${game.teams[p].map((x,i)=>`<button class="select-card" ${canLocalAct(p)?'':'disabled'} onclick="dispatchAction('captain',{index:${i},player:${p}})"><img src="${imgs[i]}"><div><strong>${x.name}</strong><small>${x.role} · ${x.rarity}</small></div></button>`).join('')}</div></section>`;if(online.mode==='local'&&p===2&&!game.captains[2])maybePass(2,'Captain wählen');});}
function selectCaptain(index,p){if(game.active!==p||game.captains[p])return;game.captains[p]=game.teams[p][index].id;game.history.push({type:'captain',p,id:game.captains[p]});if(game.captains[1]&&game.captains[2]){game.phase=settings.lineup?'order':'result';game.active=1;sync();if(game.phase==='order')renderOrder();else simulateAndRender();}else{sync();renderCaptain();}}

function renderOrder(){const p=game.order[1].length?2:1;game.active=p;if(!settings.lineup){game.phase='result';simulateAndRender();return;}game._orderDraft=game._orderDraft||[];Promise.all(game.teams[p].map(resolveImage)).then(imgs=>{app.innerHTML=`<section class="screen"><div class="phase-head"><div class="phase-title"><h1>Kampfreihenfolge</h1><p>Klicke deine sechs Charaktere in der Reihenfolge an, in der sie priorisiert ins Match gehen.</p></div><span class="turn-pill p${p}">PLAYER ${p===1?'ONE':'TWO'} · ${game._orderDraft.length}/6</span></div><div class="order-grid">${game.teams[p].map((x,i)=>{const pos=game._orderDraft.indexOf(x.id);return `<button class="select-card ${pos>=0?'selected':''}" ${pos>=0||!canLocalAct(p)?'disabled':''} onclick="orderClick('${x.id}')">${pos>=0?`<span class="order-num">${pos+1}</span>`:''}<img src="${imgs[i]}"><div><strong>${x.name}</strong><small>${x.role}</small></div></button>`}).join('')}</div><div style="margin-top:16px;display:flex;gap:8px"><button class="btn secondary" onclick="resetOrder()">Zurücksetzen</button></div></section>`;if(online.mode==='local'&&p===2&&!game.order[2].length&&game._orderDraft.length===0)maybePass(2,'Reihenfolge wählen');});}
function orderClick(id){game._orderDraft.push(id);if(game._orderDraft.length===6){dispatchAction('order',{order:[...game._orderDraft],player:game.active});}else renderOrder();}
function resetOrder(){game._orderDraft=[];renderOrder()}
function setOrder(order,p){game.order[p]=order;game.history.push({type:'order',p,order});game._orderDraft=[];if(game.order[1].length&&game.order[2].length){game.phase='result';sync();simulateAndRender();}else{sync();renderOrder();}}

function simulateAndRender(){game.result=simulateMatch();game.phase='result';sync();renderResult();if(settings.tts)setTimeout(()=>speakFinale(),700)}
function simulateMatch(){hydrateGame();const arenas=settings.bestOf3?['Neutral Void','Megacity','Fractured Multiverse']:['Neutral Arena'];const rounds=arenas.map((arena,i)=>simulateArena(arena,i));const wins1=rounds.filter(r=>r.winner===1).length,wins2=rounds.length-wins1;const winner=wins1>wins2?1:2;const stats1=teamMetrics(1),stats2=teamMetrics(2);const mvp=[...game.teams[1].map(x=>({...x,p:1})),...game.teams[2].map(x=>({...x,p:2}))].sort((a,b)=>impact(b)-impact(a))[0];const worst=[...game.teams[1].map(x=>({...x,p:1})),...game.teams[2].map(x=>({...x,p:2}))].sort((a,b)=>impact(a)-impact(b))[0];const biggestMiss=[...game.missed[1].map(x=>({...x,p:1})),...game.missed[2].map(x=>({...x,p:2}))].sort((a,b)=>impact(b)-impact(a))[0];return {winner,rounds,wins1,wins2,stats1,stats2,mvp,worst,biggestMiss,story:makeStory(winner,rounds,mvp,biggestMiss)};}
function impact(x){return x.power*1.05+x.hax*1.15+x.speed*.8+x.durability*.85+rarityBonus(x.rarity)}
function rarityBonus(r){return {Rare:0,Epic:6,Legendary:12,God:18}[r]||0}
function teamMetrics(p){const t=game.teams[p];const avg=k=>t.reduce((s,x)=>s+x[k],0)/t.length;const roles=new Set(t.map(x=>x.role)).size;const syn=settings.synergy?Math.min(12,roles*2 + (t.some(x=>x.role==='Support')?3:0)+(t.some(x=>x.role==='Hax')&&t.some(x=>x.role==='Bruiser')?3:0)):0;const captain=settings.captain&&game.captains[p]?5:0;return {power:avg('power'),hax:avg('hax'),speed:avg('speed'),dur:avg('durability'),synergy:syn,captain};}
function counterScore(a,b){if(!settings.counters)return 0;let s=0;const A=new Set(a.tags),B=new Set(b.tags);if(A.has('anti-magic')&&(B.has('magic')||b.role==='Mage'))s+=8;if(A.has('return-zero'))s+=6;if(A.has('vector')&&(B.has('physical')||b.role==='Bruiser'))s+=7;if(A.has('space')&&B.has('infinity'))s+=6;if(A.has('illusion')&&b.hax<70)s+=4;if(A.has('analysis')&&b.hax>85)s+=5;if(A.has('concept')||A.has('meta'))s+=5;if(a.speed>b.speed+15)s+=3;return s;}
function arenaModifier(c,arena){if(arena==='Megacity')return (c.role==='Assassin'?5:0)+(c.role==='Summoner'?3:0);if(arena==='Fractured Multiverse')return (c.hax>90?7:0)+(c.tags.includes('dimension')||c.tags.includes('space')?5:0);return c.durability>95?3:0;}
function eventFor(i){if(!settings.events)return {name:'Keine Modifikation',mods:{}};return [
 {name:'⚡ Speed Surge',apply:c=>c.speed*.05},{name:'🧿 Hax Storm',apply:c=>c.hax*.055},{name:'🥊 Close Quarters',apply:c=>c.role==='Bruiser'?7:0},{name:'🌌 Reality Fracture',apply:c=>c.tags.some(t=>['dimension','reality','concept','space'].includes(t))?8:0},{name:'🛡️ Last Stand',apply:c=>c.durability*.04},{name:'🎯 Assassin Window',apply:c=>c.role==='Assassin'?8:0}][i%6];}
function simulateArena(arena,i){const event=eventFor((rint(100)+i)%6);const scoreTeam=p=>{const t=game.teams[p];let total=t.reduce((s,c)=>s+impact(c)+arenaModifier(c,arena)+(event.apply?event.apply(c):0),0);const m=teamMetrics(p);total+=m.synergy+m.captain;const opp=game.teams[p===1?2:1];for(let j=0;j<t.length;j++){const foe=opp[j%opp.length];total+=counterScore(t[j],foe);}if(settings.lineup&&game.order[p].length){const first=byId(game.order[p][0]);total+=first?impact(first)*.03:0;}if(settings.revive&&game.tokens[p].revive){const toughest=[...t].sort((a,b)=>b.durability-a.durability)[0];total+=toughest.durability*.06;}return total;};let s1=scoreTeam(1),s2=scoreTeam(2);const variance=(game.rng()-.5)*18;s1+=variance;s2-=variance;return {arena,event:event.name,winner:s1>=s2?1:2,s1:Math.round(s1),s2:Math.round(s2)};}
function makeStory(winner,rounds,mvp,biggestMiss){const loser=winner===1?2:1;const W=game.teams[winner],L=game.teams[loser];const strongest=[...W].sort((a,b)=>impact(b)-impact(a))[0],enemy=[...L].sort((a,b)=>impact(b)-impact(a))[0];const cap=game.captains[winner]?byId(game.captains[winner]):strongest;const roundText=rounds.map((r,i)=>`Runde ${i+1} — ${r.arena}: ${r.event}. Player ${r.winner===1?'One':'Two'} setzt sich mit ${r.winner===1?r.s1:r.s2} zu ${r.winner===1?r.s2:r.s1} Simulationspunkten durch.`).join(' ');return `Die Arena öffnet sich und beide Teams gehen ohne Vorbereitung aufeinander los. ${enemy.name} versucht früh, das Tempo zu kontrollieren, doch ${strongest.name} zwingt den Kampf auf ein höheres Power-Level. ${cap.name} übernimmt die taktische Führung für Player ${winner===1?'One':'Two'}, während die Rollen-Synergien und Counter langsam den Unterschied machen. ${roundText} Im entscheidenden Moment bleibt ${mvp.name} der einflussreichste Charakter des gesamten Matches. ${settings.revive?'Der Revive-Token sorgt zusätzlich dafür, dass ein eigentlich verlorener Momentum-Swing noch einmal gekippt werden kann. ':''}${biggestMiss?`Besonders bitter: ${biggestMiss.name} war während des Drafts ein verpasster Charakter und hätte die Kräfteverhältnisse stark verändern können. `:''}Nach dem letzten Clash steht fest: Player ${winner===1?'One':'Two'} gewinnt das Match.`}

function renderResult(){const r=game.result;if(!r){simulateAndRender();return;}const p1=game.teams[1],p2=game.teams[2];app.innerHTML=`<section class="screen"><div class="result-hero"><div class="kicker">FINAL RESULT</div><div class="winner p${r.winner}">PLAYER ${r.winner===1?'ONE':'TWO'}</div><h2>GEWINNT ${r.wins1}:${r.wins2}</h2><div class="scoreline">${r.rounds.map(x=>`<span class="score-chip">${x.arena}: P${x.winner}</span>`).join('')}</div><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"><button class="btn gold" onclick="speakFinale()">🔊 Finale vorlesen</button><button class="btn secondary" onclick="stopSpeech()">■ Stop</button><button class="btn secondary" onclick="renderHome()">↻ Neues Match</button></div></div><div class="result-grid"><div class="story"><h3>⚔️ Kampfstory</h3><p>${r.story}</p><div class="whatif"><b>Was wäre wenn?</b><p>${whatIfText()}</p></div></div><div class="analytics"><h3>📊 Match Analytics</h3>${metricHTML('Power',r.stats1.power,r.stats2.power)}${metricHTML('Hax',r.stats1.hax,r.stats2.hax)}${metricHTML('Speed',r.stats1.speed,r.stats2.speed)}${metricHTML('Durability',r.stats1.dur,r.stats2.dur)}${metricHTML('Synergie',r.stats1.synergy*7,r.stats2.synergy*7)}<div class="award"><small>MVP</small><b>${r.mvp.name}</b> · Player ${r.mvp.p===1?'One':'Two'}</div><div class="award"><small>Schwächster Value-Pick</small><b>${r.worst.name}</b></div>${r.biggestMiss?`<div class="award"><small>Größter verpasster Pick</small><b>${r.biggestMiss.name}</b> · verpasst von Player ${r.biggestMiss.p===1?'One':'Two'}</div>`:''}</div></div><div class="section-title"><div><h2>Finale Teams</h2><p>Mystery Picks sind jetzt aufgedeckt.</p></div></div><div class="ban-grid"><div class="team-panel">${teamHTML(1)}</div><div class="team-panel">${teamHTML(2)}</div></div></section>`;hydrateTeamImages();}
function metricHTML(name,a,b){const total=Math.max(1,a+b);const pct=Math.round(a/total*100);return `<div class="metric"><div class="metric-head"><span>${name} · P1 ${a.toFixed?a.toFixed(1):a}</span><span>P2 ${b.toFixed?b.toFixed(1):b}</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`}
function whatIfText(){const moves=game.history.filter(x=>['missed','swap','trade'].includes(x.type));if(!moves.length)return 'Dieses Match hatte kaum alternative Draft-Pfade.';const best=[...game.missed[1],...game.missed[2]].sort((a,b)=>impact(b)-impact(a))[0];if(!best)return 'Der größte Unterschied entstand durch Team-Synergie statt durch einen einzelnen verpassten Pick.';const who=game.missed[1].some(x=>x.id===best.id)?'Player One':'Player Two';return `${who} hätte mit ${best.name} einen Power Index von ${Math.round(impact(best))} zusätzlich bekommen können. Je nach ersetztetem Slot hätte das mindestens eine Best-of-3-Runde kippen können.`}

const V2={version:'2.0',battleIndex:0,battleTimer:null,voiceName:localStorage.getItem('avg-voice')||'',rate:Number(localStorage.getItem('avg-voice-rate')||'.96'),musicGain:.035};

const AudioFX={ctx:null,master:null,amb:null,enabled:false,
 init(){if(!settings.sfx&&!settings.music)return;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();if(!this.master){this.master=this.ctx.createGain();this.master.gain.value=.17;this.master.connect(this.ctx.destination);}this.enabled=true;if(settings.music)this.startAmbience();}catch(e){}},
 tone(freq=300,d=.08,type='sine',gain=.12,slide=0){this.init();if(!this.ctx||!settings.sfx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,this.ctx.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),this.ctx.currentTime+d);g.gain.setValueAtTime(0.0001,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(gain,this.ctx.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+d);o.connect(g);g.connect(this.master);o.start();o.stop(this.ctx.currentTime+d+.02)},
 click(){this.tone(260,.055,'square',.055,80)}, take(){this.tone(390,.08,'triangle',.08,320);setTimeout(()=>this.tone(760,.11,'sine',.055,180),55)}, swap(){this.tone(260,.13,'sawtooth',.065,-150);setTimeout(()=>this.tone(120,.16,'square',.04,-60),70)}, reveal(){this.tone(520,.09,'triangle',.05,250);setTimeout(()=>this.tone(840,.18,'sine',.045,320),70)}, impact(){this.tone(90,.25,'sawtooth',.11,-45);this.tone(55,.28,'square',.045,20)}, win(){[440,554,659,880].forEach((f,i)=>setTimeout(()=>this.tone(f,.25,'triangle',.06,80),i*95))},
 startAmbience(){this.init();if(!this.ctx||this.amb)return;const g=this.ctx.createGain();g.gain.value=V2.musicGain;g.connect(this.master);const o1=this.ctx.createOscillator(),o2=this.ctx.createOscillator();o1.type='sine';o2.type='triangle';o1.frequency.value=55;o2.frequency.value=82.4;o1.connect(g);o2.connect(g);o1.start();o2.start();this.amb={g,o1,o2}},
 stopAmbience(){if(!this.amb)return;try{this.amb.o1.stop();this.amb.o2.stop()}catch(e){}this.amb=null},
 syncMusic(){settings.music?this.startAmbience():this.stopAmbience()}
};

const oldDispatch=dispatchAction;dispatchAction=function(action,payload={}){if(['take','ban','captain','order'].includes(action))AudioFX.click();if(action==='swap')AudioFX.swap();if(['joker','double','mystery','trade'].includes(action))AudioFX.reveal();return oldDispatch(action,payload)};

const oldRenderDraft=renderDraft;renderDraft=function(){oldRenderDraft();const center=document.querySelector('.center-stage');if(center){const prog=document.createElement('div');prog.className='turn-progress';const a=game.teams[1].length,b=game.teams[2].length;prog.innerHTML=Array.from({length:12},(_,i)=>`<i class="${i<6?(i<a?'p1done':game.active===1&&i===a?'active':''):(i-6<b?'p2done':game.active===2&&i-6===b?'active':'')}"></i>`).join('');center.prepend(prog)}setTimeout(()=>hydrateTeamImages(),20)};

function getOrderedTeam(p){if(settings.lineup&&game.order[p]?.length){const map=new Map(game.teams[p].map(c=>[c.id,c]));const ordered=game.order[p].map(id=>map.get(id)).filter(Boolean);for(const c of game.teams[p])if(!ordered.some(x=>x.id===c.id))ordered.push(c);return ordered}return game.teams[p]}
function pairNarrative(a,b,winner){const win=winner===1?a:b,lose=winner===1?b:a;let hook='rohe Werte und Tempo';const cs=counterScore(win,lose);if(cs>=8)hook='ein direkter Ability-Counter';else if(win.hax>lose.hax+15)hook='überlegene Hax';else if(win.speed>lose.speed+15)hook='ein massiver Speed-Vorteil';else if(win.durability>lose.durability+15)hook='überlegene Haltbarkeit';return `${win.name} gewinnt das Schlüsselduell gegen ${lose.name} vor allem durch ${hook}.`}
makeStory=function(winner,rounds,mvp,biggestMiss){const loser=winner===1?2:1,W=getOrderedTeam(winner),L=getOrderedTeam(loser);const cap=game.captains[winner]?byId(game.captains[winner]):W[0];const openerW=W[0],openerL=L[0],powerW=[...W].sort((a,b)=>impact(b)-impact(a))[0],powerL=[...L].sort((a,b)=>impact(b)-impact(a))[0];const duel1=pairNarrative(openerW,openerL,impact(openerW)>=impact(openerL)?1:2);const duel2=pairNarrative(powerW,powerL,impact(powerW)>=impact(powerL)?1:2);const roundLines=rounds.map((r,i)=>`Runde ${i+1} in ${r.arena}: ${r.event}. Player ${r.winner===1?'One':'Two'} holt die Arena mit ${r.s1}:${r.s2}.`).join('\n');return `ERÖFFNUNG\n${openerW.name} und ${openerL.name} setzen direkt das Tempo. ${duel1} Währenddessen verteilen sich Support-, Summoner- und Hax-Rollen über die Arena, sodass nicht nur rohe Power entscheidet.\n\nMID GAME\n${powerW.name} und ${powerL.name} werden zum Zentrum des Matches. ${duel2} ${cap.name} übernimmt für Player ${winner===1?'One':'Two'} die Captain-Rolle und stabilisiert die Teamkoordination, als die ersten Counter und Arena-Modifikatoren greifen.\n\nBEST OF 3\n${roundLines}\n\nCLUTCH\n${settings.revive?'Der Revive-Token hält ein Team noch einmal im Match und verhindert einen sofortigen Snowball. ':''}${mvp.name} liefert den größten Gesamt-Impact des Finals. ${biggestMiss?`Im Rückblick ist ${biggestMiss.name} der schmerzhafteste verpasste Draft-Pick — dieser eine Switch/Take-Pfad hätte das Match realistisch kippen können. `:''}Im letzten Clash reicht die Kombination aus Power, Hax, Speed, Synergie und Countern für Player ${winner===1?'One':'Two'}.`}

const baseSimulateMatch=simulateMatch;simulateMatch=function(){const r=baseSimulateMatch();const t1=r.rounds.reduce((s,x)=>s+x.s1,0),t2=r.rounds.reduce((s,x)=>s+x.s2,0);const pct=Math.round(100/(1+Math.exp(-(t1-t2)/72)));r.p1Probability=Math.max(8,Math.min(92,pct));r.p2Probability=100-r.p1Probability;r.story=makeStory(r.winner,r.rounds,r.mvp,r.biggestMiss);return r};

simulateAndRender=function(){game.result=simulateMatch();game.phase='result';sync();if(settings.cinematic&&online.mode!=='guest')renderBattleCinematic();else{renderResult();if(settings.autoTTS&&settings.tts)setTimeout(()=>speakFinale(),800)}};
async function fighterHTML(c){return `<div class="fighter"><img src="${await resolveImage(c)}" alt="${c.name}"><div class="fn">${c.name}</div></div>`}
async function renderBattleCinematic(){const r=game.result;V2.battleIndex=0;const t1=[...getOrderedTeam(1)].sort((a,b)=>impact(b)-impact(a)).slice(0,3),t2=[...getOrderedTeam(2)].sort((a,b)=>impact(b)-impact(a)).slice(0,3);const [h1,h2]=await Promise.all([Promise.all(t1.map(fighterHTML)),Promise.all(t2.map(fighterHTML))]);app.innerHTML=`<section class="screen battle-screen"><div class="phase-head"><div class="phase-title"><h1>⚔️ CINEMATIC FINALE</h1><p>Best-of-${r.rounds.length} · Simulation aus Stats, Countern, Synergie, Lineup und Arena-Events.</p></div><span class="turn-pill">LIVE SIMULATION</span></div><div class="battle-stage" id="battleStage"><div class="battle-title"><div class="battle-round-number" id="battleRoundNo"></div><h2 id="battleArena"></h2><p id="battleEvent"></p></div><div class="battle-sides"><div class="fighter-stack p1">${h1.join('')}</div><div class="battle-vs">VS</div><div class="fighter-stack p2">${h2.join('')}</div></div><div class="round-score" id="roundScore"></div></div><div class="battle-log"><div><strong id="battleLogTitle">Simulation startet…</strong><p id="battleLogCopy">Die Teams betreten die Arena.</p></div><div class="battle-controls"><button class="btn secondary" onclick="skipBattle()">Überspringen</button><button class="btn gold" id="battleNext" onclick="battleNext()">Nächste Runde</button></div></div></section>`;battleNext();}
function battleNext(){const r=game.result;if(!r)return;clearTimeout(V2.battleTimer);if(V2.battleIndex>=r.rounds.length){AudioFX.win();confetti(r.winner);document.querySelector('#battleRoundNo').textContent='FINAL';document.querySelector('#battleArena').textContent=`PLAYER ${r.winner===1?'ONE':'TWO'} WINS`;document.querySelector('#battleEvent').textContent=`${r.wins1}:${r.wins2} · MVP ${r.mvp.name}`;document.querySelector('#battleLogTitle').textContent='Match entschieden';document.querySelector('#battleLogCopy').textContent='Das vollständige Match-Report mit Story, Stats und TTS ist bereit.';const b=document.querySelector('#battleNext');if(b){b.textContent='ERGEBNIS ANZEIGEN';b.onclick=()=>renderResult()}return}const x=r.rounds[V2.battleIndex];AudioFX.impact();document.querySelector('#battleRoundNo').textContent=`ROUND ${V2.battleIndex+1} / ${r.rounds.length}`;document.querySelector('#battleArena').textContent=x.arena;document.querySelector('#battleEvent').textContent=x.event;document.querySelector('#battleLogTitle').textContent=`Player ${x.winner===1?'One':'Two'} gewinnt diese Arena`;document.querySelector('#battleLogCopy').textContent=`Simulationsscore ${x.s1}:${x.s2}. ${roundBattleReason(x)}`;document.querySelector('#roundScore').innerHTML=r.rounds.slice(0,V2.battleIndex+1).map(q=>`<i class="round-dot p${q.winner}"></i>`).join('');V2.battleIndex++;V2.battleTimer=setTimeout(()=>battleNext(),2800)}
function roundBattleReason(x){const m1=teamMetrics(1),m2=teamMetrics(2);if(x.event.includes('Hax'))return (m1.hax>m2.hax?'Player One':'Player Two')+' profitiert besonders vom Hax-Event.';if(x.event.includes('Speed'))return (m1.speed>m2.speed?'Player One':'Player Two')+' besitzt den höheren Speed-Durchschnitt.';if(x.arena==='Fractured Multiverse')return 'Reality-, Space- und Dimension-Tags werden hier besonders wertvoll.';if(x.arena==='Megacity')return 'Mobilität, Assassins und Summoner können die Umgebung besser ausnutzen.';return 'Der kombinierte Impact aus Stats, Captain, Countern und Lineup entscheidet.'}
function skipBattle(){clearTimeout(V2.battleTimer);renderResult()}

renderResult=async function(){const r=game.result;if(!r){simulateAndRender();return}const winPct=r.winner===1?r.p1Probability:r.p2Probability;const chapterNames=['Eröffnung','Mid Game','Best of 3','Clutch'];const chunks=r.story.split(/\n\n/);app.innerHTML=`<section class="screen"><div class="result-hero-v2"><div class="result-kicker">OFFICIAL MATCH RESULT</div><div class="result-score-big p${r.winner}">PLAYER ${r.winner===1?'ONE':'TWO'}</div><h2>GEWINNT ${r.wins1}:${r.wins2}</h2><p class="result-sub">MVP: <b>${r.mvp.name}</b> · ${r.rounds.length} Arena${r.rounds.length>1?'s':''} ausgewertet</p><div class="probability-ring" style="--pct:${winPct}"><div><b>${winPct}%</b><small>WIN EDGE</small></div></div><div class="hero-actions-v2" style="justify-content:center"><button class="btn gold" onclick="openVoicePanel()">🎙️ STORY VORLESEN</button><button class="btn secondary" onclick="shareResult()">🔗 ERGEBNIS TEILEN</button><button class="btn secondary" onclick="renderHome()">↻ REMATCH</button></div></div><div class="round-cards">${r.rounds.map((x,i)=>`<div class="round-card"><b>ROUND ${i+1} · ${x.arena}</b><p>${x.event} · Score ${x.s1}:${x.s2}</p><div class="rw p${x.winner}">PLAYER ${x.winner===1?'ONE':'TWO'} +1</div></div>`).join('')}</div><div class="result-grid"><div class="story"><h3>⚔️ Kampfstory</h3>${chunks.map((x,i)=>{const lines=x.split('\n');return `<div class="story-chapter"><b>${chapterNames[i]||lines.shift()}</b><p>${(i<chapterNames.length?lines.slice(1).join(' '):lines.join(' '))||x}</p></div>`}).join('')}<div class="whatif"><b>🔀 Was wäre wenn?</b><p>${whatIfText()}</p></div></div><div class="analytics"><h3>📊 Match Analytics</h3>${metricHTML('Power',r.stats1.power,r.stats2.power)}${metricHTML('Hax',r.stats1.hax,r.stats2.hax)}${metricHTML('Speed',r.stats1.speed,r.stats2.speed)}${metricHTML('Durability',r.stats1.dur,r.stats2.dur)}${metricHTML('Synergie',r.stats1.synergy*7,r.stats2.synergy*7)}<div class="award-grid"><div class="award mvp"><small>🏆 MVP</small><b>${r.mvp.name}</b><small>Player ${r.mvp.p===1?'One':'Two'}</small></div><div class="award"><small>📉 Lowest Value</small><b>${r.worst.name}</b><small>Power Index ${Math.round(impact(r.worst))}</small></div>${r.biggestMiss?`<div class="award"><small>💀 Biggest Miss</small><b>${r.biggestMiss.name}</b><small>Player ${r.biggestMiss.p===1?'One':'Two'}</small></div>`:''}<div class="award"><small>🎯 Closest Arena</small><b>${[...r.rounds].sort((a,b)=>Math.abs(a.s1-a.s2)-Math.abs(b.s1-b.s2))[0].arena}</b><small>kleinste Score-Differenz</small></div></div></div></div><div class="section-title"><div><h2>Finale Teams</h2><p>Mystery Picks sind jetzt vollständig aufgedeckt.</p></div></div><div class="final-team-grid" id="finalTeams"></div><p class="footer-note">Die Simulation ist ein <b>Fan-Game-Power-Scaling-System</b>, keine offizielle Canon-Aussage. Cross-verse Ergebnisse sind bewusst probabilistisch.</p></section>`;await renderFinalTeams();AudioFX.win();confetti(r.winner);if(settings.autoTTS&&settings.tts)setTimeout(()=>speakFinale(),900)};
async function renderFinalTeams(){const root=document.querySelector('#finalTeams');if(!root)return;const blocks=[];for(const p of [1,2]){const units=await Promise.all(game.teams[p].map(async c=>`<div class="final-unit"><img src="${await resolveImage(c)}" alt="${c.name}"><div><b>${c.name}${game.captains[p]===c.id?' 👑':''}</b><small>${c.role} · ${c.rarity}</small></div></div>`));blocks.push(`<div class="final-team-card"><div class="final-team-head"><b style="color:var(--p${p})">PLAYER ${p===1?'ONE':'TWO'}</b><small>${game.teams[p].length}/6</small></div><div class="final-roster">${units.join('')}</div></div>`)}root.innerHTML=blocks.join('')}
function confetti(winner){const colors=winner===1?['#48e7ff','#4f7cff','#fff','#ffd76a']:['#ff4f91','#9f55ff','#fff','#ffd76a'];for(let i=0;i<55;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.setProperty('--dx',(Math.random()*240-120)+'px');e.style.animationDelay=(Math.random()*.6)+'s';e.style.animationDuration=(2+Math.random()*1.5)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}

function availableVoices(){return speechSynthesis?.getVoices?.()||[]}
function openVoicePanel(){if(!('speechSynthesis'in window)){toast('Dieser Browser unterstützt leider kein TTS.');return}const voices=availableVoices();const de=voices.filter(v=>v.lang?.toLowerCase().startsWith('de'));const list=(de.length?de:voices);modal(`<h2>🎙️ Voice Finale</h2><p>Wähle eine Browser-Stimme. Die genaue Auswahl hängt vom Gerät und Browser ab.</p><div class="sound-grid"><div class="sound-option"><label>Stimme</label><select id="voiceSelect">${list.map(v=>`<option value="${escapeHtml(v.name)}" ${v.name===V2.voiceName?'selected':''}>${escapeHtml(v.name)} · ${v.lang}</option>`).join('')}</select><div class="voice-preview">Deutsch wird bevorzugt, falls installiert.</div></div><div class="sound-option"><label>Tempo <span id="rateValue">${V2.rate.toFixed(2)}×</span></label><input id="voiceRate" type="range" min="0.75" max="1.25" step="0.05" value="${V2.rate}"></div></div><div class="modal-actions"><button class="btn secondary" onclick="stopSpeech()">■ Stop</button><button class="btn secondary" onclick="closeModal()">Schließen</button><button class="btn gold" onclick="saveVoiceAndSpeak()">▶ Story starten</button></div>`);setTimeout(()=>{const r=document.querySelector('#voiceRate');if(r)r.oninput=()=>document.querySelector('#rateValue').textContent=Number(r.value).toFixed(2)+'×'},0)}
function saveVoiceAndSpeak(){const s=document.querySelector('#voiceSelect'),r=document.querySelector('#voiceRate');V2.voiceName=s?.value||'';V2.rate=Number(r?.value||.96);localStorage.setItem('avg-voice',V2.voiceName);localStorage.setItem('avg-voice-rate',V2.rate);closeModal();speakFinale()}
speakFinale=function(){if(!('speechSynthesis'in window)){toast('Dein Browser unterstützt TTS nicht.');return}stopSpeech();const r=game?.result;if(!r)return;const u=new SpeechSynthesisUtterance(`Player ${r.winner===1?'One':'Two'} gewinnt ${r.wins1} zu ${r.wins2}. ${r.story.replace(/\n/g,' ')}`);const voices=availableVoices();u.voice=voices.find(v=>v.name===V2.voiceName)||voices.find(v=>v.lang?.toLowerCase().startsWith('de'))||null;u.lang=u.voice?.lang||'de-DE';u.rate=V2.rate;u.pitch=.98;u.onstart=()=>toast('Voice Finale läuft…');u.onend=()=>toast('Voice Finale beendet.');speechSynthesis.speak(u)};
function openSoundPanel(){const voices=availableVoices();modal(`<h2>🔊 Audio & Darstellung</h2><div class="sound-grid"><div class="sound-option"><label>Soundeffekte <input class="switch" id="sfxToggle" type="checkbox" ${settings.sfx?'checked':''}></label><div class="voice-preview">Synthetische UI- und Battle-SFX.</div></div><div class="sound-option"><label>Ambient Audio <input class="switch" id="musicToggle" type="checkbox" ${settings.music?'checked':''}></label><div class="voice-preview">Sehr leiser generierter Arena-Drone.</div></div><div class="sound-option"><label>Cinematic Finale <input class="switch" id="cinToggle" type="checkbox" ${settings.cinematic?'checked':''}></label><div class="voice-preview">Animierter VS-/Best-of-3-Screen.</div></div><div class="sound-option"><label>TTS verfügbar <input class="switch" id="ttsToggle" type="checkbox" ${settings.tts?'checked':''}></label><div class="voice-preview">Ergebnis-Story per Browserstimme.</div></div></div><div class="modal-actions"><button class="btn" onclick="saveSoundPanel()">Speichern</button></div>`)}
function saveSoundPanel(){settings.sfx=document.querySelector('#sfxToggle').checked;settings.music=document.querySelector('#musicToggle').checked;settings.cinematic=document.querySelector('#cinToggle').checked;settings.tts=document.querySelector('#ttsToggle').checked;saveV2Prefs();AudioFX.syncMusic();closeModal();toast('Audio-Einstellungen gespeichert.')}
function escapeHtml(s=''){return s.replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function shareResult(){const r=game?.result;if(!r)return;const text=`ANIME VERSUS GAME — Player ${r.winner===1?'One':'Two'} gewinnt ${r.wins1}:${r.wins2}. MVP: ${r.mvp.name}.`;if(navigator.share){navigator.share({title:'Anime Versus Game',text,url:/^https?:$/.test(location.protocol)?location.href:undefined}).catch(()=>{})}else navigator.clipboard?.writeText(text+( /^https?:$/.test(location.protocol)?' '+location.href:'' )).then(()=>toast('Ergebnis kopiert.')).catch(()=>toast(text))}

function fullscreenToggle(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
const topActions=document.querySelector('.top-actions');if(topActions&&!document.querySelector('#fullBtn')){const b=document.createElement('button');b.className='icon-btn';b.id='fullBtn';b.title='Vollbild';b.textContent='⛶';b.onclick=fullscreenToggle;topActions.prepend(b)}
document.querySelector('#soundBtn').onclick=openSoundPanel;

const oldOnlineLobby=renderOnlineLobby;renderOnlineLobby=function(kind){oldOnlineLobby(kind);const box=document.querySelector('.hero-panel');if(box){const help=document.createElement('p');help.className='small-note';help.innerHTML='<b>GitHub Pages:</b> Sobald diese index.html dort liegt, kann der Host den Einladungslink direkt kopieren. Die Spielstände laufen Peer-to-Peer über PeerJS.';box.appendChild(help)}};

// Auto-open room from GitHub Pages invite URL on first load too (not only hashchange).
setTimeout(()=>{const m=location.hash.match(/room=(\d{6})/);if(m&&!game){online.room=m[1];joinPrompt();setTimeout(()=>{const i=document.querySelector('#roomInput');if(i)i.value=m[1]},20)}},150);

renderHome();

/* Image hardening + full V2 rules */
const baseResolveImageV2=resolveImage;
resolveImage=async function(c){
  let u=await baseResolveImageV2(c);
  if(u && !u.startsWith('data:image/svg+xml')) return u;
  try{
    const q=encodeURIComponent(`${c.name.replace(/\s*\(.+\)$/,'')} ${c.franchise}`);
    const r=await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*`);
    if(r.ok){const j=await r.json();const p=Object.values(j.query?.pages||{})[0];const w=p?.thumbnail?.source;if(w){imgCache[c.id]=w;persistImgs();return w}}
  }catch(e){}
  return u||svgAvatar(c);
};
setImg=async function(img,c){img.alt=c.name;const fallback=svgAvatar(c);const u=await resolveImage(c);img.onerror=()=>{img.onerror=null;img.src=fallback;img.classList.add('loaded')};img.onload=()=>img.classList.add('loaded');img.src=u||fallback};

 ['1 · Draft','Jeder baut ein Team aus 6 Charakteren. Player One beginnt. Immer 2 Picks am Stück, danach wechselt der Spieler.'],
 ['2 · Nehmen','Der angebotene Charakter kommt fest ins Team. Direkt danach wird gezeigt, welchen nächsten Charakter du dadurch verpasst hast. Der verpasste Pick wird verworfen.'],
 ['3 · Wechseln','Der aktuelle Charakter wird verworfen. Der direkt danach gezogene Charakter ist Pflicht und muss genommen werden.'],
 ['4 · Ban','Vor dem Draft bannt jeder einen Charakter komplett aus dem Match.'],
 ['5 · Franchise-Limit','Wenn aktiv, kann ein Spieler maximal einen Charakter aus demselben Franchise im Team haben.'],
 ['6 · Joker','Einmal pro Spieler: zwei neue Charaktere werden offen gezeigt. Du musst einen davon wählen; der andere zählt als verpasst.'],
 ['7 · Mystery Pick','Einmal pro Spieler kann der nächste Pick vor Player Two/One verborgen bleiben. Er wird spätestens im Finale aufgedeckt.'],
 ['8 · Trade','Nach dem vierten eigenen Pick darf einmal ein eigener Charakter geopfert werden. Der zufällige Ersatz ist Pflicht.'],
 ['9 · Double or Nothing','Einmal zwei verdeckte Karten A/B. Triffst du blind die stärkere, bekommst du sie; sonst bekommst du automatisch die schwächere.'],
 ['10 · Captain','Nach dem Draft wählt jeder einen Captain. Er gibt einen kleinen Koordinations-/Clutch-Bonus.'],
 ['11 · Lineup','Jeder legt seine Priorität 1–6 fest. Frühe Matchups und bestimmte Counter werden dadurch leicht beeinflusst.'],
 ['12 · Revive','Wenn aktiv, erhält das Team im Finale einmalig einen Comeback-Bonus über seinen robustesten Charakter.'],
 ['13 · Synergie','Rollenvielfalt sowie Kombinationen wie Hax + Bruiser oder Support erhöhen die Teamwertung.'],
 ['14 · Counter','Tags können konkrete Matchups verbessern: z. B. Anti-Magic gegen Mage, Space gegen Infinity, Vector gegen Physical.'],

 ['17 · Arena Events','Speed Surge, Hax Storm, Close Quarters, Reality Fracture, Last Stand oder Assassin Window verändern einzelne Runden fair für beide Teams.'],
 ['18 · Cinematic','Optional läuft vor dem Resultat eine animierte Arena-Simulation mit Round-Scores und MVP-Reveal.'],
 ['19 · TTS','Im Ergebnis kannst du eine auf deinem Gerät vorhandene Stimme und das Sprechtempo auswählen und die Kampfstory vorlesen lassen.'],
 ['20 · Online 1v1','Player One erstellt einen 6-stelligen Room. Player Two joint per Code/Link. Der Host ist die autoritative Match-Instanz und synchronisiert den Status Peer-to-Peer.'],
 ['21 · Bewertung','Cross-Verse-Power-Scaling ist nicht objektiv messbar. Deshalb nutzt das Spiel ein konsistentes Fan-Game-Scoring plus kleine Zufallsvarianz statt so zu tun, als sei ein Ergebnis Canon.']
].map(([a,b])=>`<div class="rule"><b>${a}</b><p>${b}</p></div>`).join('')}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">LET'S GO</button></div>`)};

<script>
/* AVG V2.1 online-flow patch: authoritative host + actor-side pending UI. */
let AVG_PENDING_MODAL_KEY = '';
const AVG_ORIGINAL_ROUTE_RENDER = routeRender;
const AVG_ORIGINAL_HANDLE_REMOTE = handleRemoteAction;
const AVG_ORIGINAL_TAKE = takePick;
const AVG_ORIGINAL_SWAP = swapPick;
const AVG_ORIGINAL_JOKER = useJoker;
const AVG_ORIGINAL_DOUBLE = useDouble;
const AVG_ORIGINAL_AFTER_PICK = afterPick;
const AVG_ORIGINAL_TRADE = tradeCharacter;
const AVG_ORIGINAL_SKIP_TRADE = skipTrade;
const AVG_ORIGINAL_TOGGLE_MYSTERY = toggleMystery;

function avgOnlineWaitingScreen(){
  const q=game?.pendingOnline;
  const p=q?.p||game?.active||1;
  const label={reveal:'Pick wird aufgedeckt',forcedAck:'Pflichtpick bestätigt',joker:'Joker-Auswahl',double:'Double or Nothing',tradeDecision:'Trade-Entscheidung',tradeSelect:'Trade-Auswahl',tradeResult:'Trade abgeschlossen'}[q?.type]||'Entscheidung läuft';
  app.innerHTML=`<section class="screen"><div class="phase-head"><div class="phase-title"><h1>Online Draft</h1><p>${label}</p></div><span class="online-status"><i class="dot live"></i>LIVE · ROOM ${online.room||''}</span></div><div class="draft-layout"><div class="team-panel left">${teamHTML(1)}</div><div class="center-stage"><div class="hero-panel" style="text-align:center"><div class="kicker">PLAYER ${p===1?'ONE':'TWO'}</div><h2>${label}</h2><p class="small-note">Der Match-Status wird vom Host synchronisiert. Beide Browser bleiben auf demselben Stand.</p></div></div><div class="team-panel right">${teamHTML(2)}</div></div></section>`;
  hydrateTeamImages();
}

routeRender=function(){
  hydrateGame();
  if(online.mode!=='local') closeModal();
  if(game?.pendingOnline && game.phase==='draft' && !game.candidate) avgOnlineWaitingScreen();
  else AVG_ORIGINAL_ROUTE_RENDER();
  setTimeout(avgRenderOnlinePending,0);
};

function avgPendingKey(q){return q?`${q.type}:${q.p}:${q.taken?.id||''}:${q.missed?.id||''}:${(q.options||[]).map(x=>x.id).join(',')}:${q.old?.id||''}:${q.fresh?.id||''}`:''}
async function avgRenderOnlinePending(){
  if(online.mode==='local'||!game?.pendingOnline){AVG_PENDING_MODAL_KEY='';return;}
  const q=game.pendingOnline, mine=online.role===q.p, key=avgPendingKey(q)+':'+online.role;
  if(AVG_PENDING_MODAL_KEY===key)return;
  AVG_PENDING_MODAL_KEY=key;
  const playerName=`Player ${q.p===1?'One':'Two'}`;
  if(q.type==='reveal'){
    const showTaken=mine||!q.taken?.mystery;
    const [a,b]=await Promise.all([showTaken?resolveImage(q.taken):Promise.resolve(svgAvatar({name:'Mystery Pick'})),resolveImage(q.missed)]);
    if(!game?.pendingOnline||avgPendingKey(game.pendingOnline)+':'+online.role!==key)return;
    modal(`<div class="kicker">${playerName.toUpperCase()} · ENTSCHEIDUNG</div><h2>${mine?'Du nimmst':playerName+' nimmt'} ${showTaken?q.taken.name:'einen Mystery Pick'}</h2><div class="reveal"><div class="mini-card"><div class="pic"><img src="${a}"></div><div class="copy"><h3>${showTaken?q.taken.name:'MYSTERY PICK'}</h3><p>${showTaken?q.taken.franchise+' · '+q.taken.rarity:'Bis zum Finale verborgen'}</p></div></div><div class="reveal-vs">VERPASST</div><div class="mini-card missed"><div class="pic"><img src="${b}"></div><div class="copy"><h3>❌ ${q.missed.name}</h3><p>${q.missed.franchise} · ${q.missed.rarity}</p></div></div></div><div class="modal-actions">${mine?`<button class="btn" onclick="dispatchAction('onlineAckPick')">Weiter</button>`:`<span class="small-note">Warte auf ${playerName}…</span>`}</div>`);
  } else if(q.type==='forcedAck'){
    const show=mine||!q.taken?.mystery;
    modal(`<h2>⚠️ Pflichtpick</h2><p>${mine?'Dein':playerName+'s'} Pflichtpick ist <b>${show?q.taken.name:'MYSTERY PICK'}</b>. Nach einem Switch gibt es keinen zusätzlichen verpassten Charakter.</p><div class="modal-actions">${mine?`<button class="btn" onclick="dispatchAction('onlineAckPick')">Weiter</button>`:`<span class="small-note">Warte auf ${playerName}…</span>`}</div>`);
  } else if(q.type==='joker'){
    if(!mine){modal(`<h2>🃏 ${playerName} nutzt den Joker</h2><p>Zwei neue Charaktere werden zur Auswahl angeboten.</p><div class="modal-actions"><span class="small-note">Warte auf die Entscheidung…</span></div>`);return;}
    const imgs=await Promise.all(q.options.map(resolveImage));
    if(!game?.pendingOnline||avgPendingKey(game.pendingOnline)+':'+online.role!==key)return;
    modal(`<h2>🃏 Joker</h2><p>Wähle einen von zwei neuen Charakteren. Die Wahl ist endgültig.</p><div class="reveal">${q.options.map((c,i)=>`<button class="select-card" onclick="dispatchAction('onlineJokerChoose',{id:'${c.id}'})"><img src="${imgs[i]}"><div><strong>${c.name}</strong><small>${c.franchise} · ${c.tier}</small></div></button>${i===0?'<div class="reveal-vs">ODER</div>':''}`).join('')}</div>`);
  } else if(q.type==='double'){

function avgOnlineTake(){

  const wasForced=game.forced,taken=deepClone(game.candidate);
  taken.mystery=!!game._mysteryArmed;
  if(taken.mystery){game.tokens[p].mystery=0;game._mysteryArmed=false;}
  game.teams[p].push(taken);game.history.push({type:wasForced?'forced-take':'take',p,id:taken.id});

  if(wasForced) game.pendingOnline={type:'forcedAck',p,taken};
  else {const missed=drawCharacter(p);game.missed[p].push(missed);game.history.push({type:'missed',p,id:missed.id});game.pendingOnline={type:'reveal',p,taken,missed};}

useJoker=function(){

useDouble=function(){

setTimeout(()=>{

    const input=document.querySelector('#roomInput');
    if(input){input.value=m[1];joinOnline();}
  }

</script>

/* ---------- battle story upgraded for TTS ---------- */
function v22Signature(c){const t=new Set(c.tags||[]);if(t.has('return-zero'))return 'setzt Return to Zero als defensive Falle ein';if(t.has('time-stop'))return 'friert mit Zeitmanipulation den Rhythmus des Kampfes ein';if(t.has('anti-magic'))return 'schneidet mit Anti-Magic durch gegnerische Effekte';if(t.has('illusion'))return 'verdreht mit Illusionen die Wahrnehmung des Schlachtfelds';if(t.has('space')||t.has('dimension'))return 'zerreißt Distanz und Raum mit Dimensionsfähigkeiten';if(t.has('absorb'))return 'analysiert und absorbiert gegnerische Energie';if(t.has('summon')||c.role==='Summoner')return 'überflutet die Arena mit Beschwörungen';if(t.has('speed'))return 'erzwingt mit einem explosiven Speed-Burst das erste echte Opening';if(t.has('sword'))return 'geht mit einem präzisen Schwerthieb in den direkten Clash';if(c.role==='Hax')return 'setzt seine Hax ein, statt einen reinen Kraftvergleich zu suchen';if(c.role==='Mage')return 'öffnet mit einem massiven Fernangriff';if(c.role==='Assassin')return 'verschwindet aus der direkten Sichtlinie und sucht den Blind Spot';return 'geht frontal in den Clash und zwingt rohe Physis auf'}
makeStory=function(winner,rounds,mvp,biggestMiss){const loser=winner===1?2:1,W=getOrderedTeam(winner),L=getOrderedTeam(loser),wTop=[...W].sort((a,b)=>impact(b)-impact(a)),lTop=[...L].sort((a,b)=>impact(b)-impact(a));const cap=game.captains[winner]?byId(game.captains[winner]):wTop[0];const o1=W[0]||wTop[0],o2=L[0]||lTop[0],w1=wTop[0],w2=wTop[1]||wTop[0],l1=lTop[0],l2=lTop[1]||lTop[0];const rs=rounds.map((r,i)=>`Arena ${i+1}, ${r.arena}. ${r.event}. Der Score endet ${r.s1} zu ${r.s2}; Player ${r.winner===1?'One':'Two'} holt den Punkt.`).join(' ');return `ERÖFFNUNG\n${o1.name} eröffnet für Player ${winner===1?'One':'Two'} und ${v22Signature(o1)}. Auf der Gegenseite antwortet ${o2.name}, der ${v22Signature(o2)}. Schon in den ersten Sekunden wird klar: Hier entscheidet nicht nur rohe Power, sondern wer seine Fähigkeiten so einsetzt, dass der Gegner gar nicht erst in sein ideales Matchup kommt.\n\nESKALATION\n${l1.name} zieht das Tempo hoch und zwingt das Siegerteam in die Defensive. ${w1.name} reagiert, ${v22Signature(w1)}, während ${w2.name} die entstandene Lücke nutzt. ${l2.name} versucht den Momentum-Swing noch zu stoppen. ${cap.name} hält als Captain die Formation zusammen und verhindert, dass aus einem verlorenen Einzelduell sofort ein Team-Wipe wird.\n\nBEST OF ${rounds.length===3?'THREE':'ONE'}\n${rs}\n\nCLUTCH\n${settings.revive?'Als das Match kippt, greift der Revive-Bonus ein und gibt dem robustesten Charakter noch einen letzten Momentum-Push. ':''}${mvp.name} liefert über alle Arenen den höchsten Gesamt-Impact. Im entscheidenden Clash kombiniert Player ${winner===1?'One':'Two'} Power, Hax, Speed und Counter besser als der Gegner. ${biggestMiss?`${biggestMiss.name} bleibt dabei der brutalste verpasste Pick des Drafts; mit diesem Charakter hätte mindestens ein Matchup völlig anders aussehen können. `:''}Nach dem letzten Treffer bricht das gegnerische Setup zusammen. Player ${winner===1?'One':'Two'} gewinnt ${rounds.filter(r=>r.winner===winner).length} zu ${rounds.filter(r=>r.winner===loser).length}.`};
const V22_BASE_SIM=simulateMatch;simulateMatch=function(){const r=V22_BASE_SIM();r.story=makeStory(r.winner,r.rounds,r.mvp,r.biggestMiss);const t1=r.rounds.reduce((s,x)=>s+x.s1,0),t2=r.rounds.reduce((s,x)=>s+x.s2,0);const pct=Math.round(100/(1+Math.exp(-(t1-t2)/72)));r.p1Probability=Math.max(8,Math.min(92,pct));r.p2Probability=100-r.p1Probability;return r};

function v22OnlineJokerChoose(id){const q=game.pendingOnline,p=q?.p;if(!q||q.type!=='v22Joker'||p!==game.active)return;const c=deepClone(q.options.find(x=>x.id===id)),other=deepClone(q.options.find(x=>x.id!==id));if(!c||!other)return;game.tokens[p].joker=0;c.mystery=!!game._mysteryArmed;if(c.mystery){game.tokens[p].mystery=0;game._mysteryArmed=false}game.teams[p].push(c);game.missed[p].push(other);game.history.push({type:'joker',p,id:c.id,missed:other.id});game.candidate=null;game.pendingOnline={type:'reveal',p,taken:c,missed:other};sync();routeRender()}
function v22OnlineDoubleChoose(idx){const q=game.pendingOnline,p=q?.p;if(!q||q.type!=='v22Double'||p!==game.active)return;game.tokens[p].double=0;const [a,b]=q.options,score=x=>x.power+x.hax+x.speed+x.durability,strong=score(a)>=score(b)?a:b,weak=strong.id===a.id?b:a,guess=q.options[idx],correct=guess.id===strong.id,pick=deepClone(correct?strong:weak),miss=deepClone(correct?weak:strong);pick.mystery=!!game._mysteryArmed;if(pick.mystery){game.tokens[p].mystery=0;game._mysteryArmed=false}game.teams[p].push(pick);game.missed[p].push(miss);game.history.push({type:'double',p,id:pick.id,correct});game.candidate=null;game.pendingOnline={type:'reveal',p,taken:pick,missed:miss};sync();routeRender()}

 const current=game.candidate;
 v22OptionalModal(`<h2>🎁 Mystery Box</h2><p>Du verwirfst <b>${current.name}</b> und erhältst stattdessen einen komplett neuen, zufälligen Secret-Pick.</p><div class="option-note"><b>So funktioniert es:</b> Erst nach deiner Bestätigung wird der neue Charakter gezogen. Nur du siehst seine Identität; der Gegner sieht bis zum Finale ausschließlich <b>???</b>. Der Mystery-Token wird erst dann verbraucht.</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn gold" onclick="v22CommitMysteryBox()">🎁 BLIND ZIEHEN</button></div>`,()=>renderDraft());
}

 const p=game.active;if(!settings.mystery||!game.tokens[p].mystery||game.forced||!game.candidate)return;
 const visible=deepClone(game.candidate),secret=drawCharacter(p);secret.mystery=true;game.tokens[p].mystery=0;game._mysteryArmed=false;game.teams[p].push(secret);game.history.push({type:'mystery',p,id:secret.id,discarded:visible.id});game.candidate=null;
 if(online.mode==='local'){
   sync();resolveImage(secret).then(img=>modal(`<div class="kicker">PRIVATE REVEAL · PLAYER ${p===1?'ONE':'TWO'}</div><h2>🎁 Dein Secret-Pick</h2><div class="mini-card"><div class="pic"><img src="${img}" alt="${secret.name}"></div><div class="copy"><h3>${secret.name}</h3><p>${secret.franchise} · ${secret.role} · ${secret.rarity}</p></div></div><p class="option-note">Merke dir den Charakter. Sobald der Zug zum Gegner wechselt, wird dieser Slot als <b>MYSTERY PICK</b> verborgen.</p><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">SECRET LOCKEN</button></div>`));
 }else{game.pendingOnline={type:'v22MysteryReveal',p,secret,discarded:visible};sync();routeRender()}
}

/* ---------- collision-safe online host creation ---------- */
function v22FreshRoom(){return Math.floor(100000+Math.random()*900000).toString()}
function v22PeerIdTaken(e){return ['unavailable-id','id-taken'].includes(String(e?.type||e||'').toLowerCase())}
createOnline=function(retry=0){
 settings.powerCap=document.querySelector('#powerCap')?.value||settings.powerCap;
 if(typeof Peer==='undefined'){toast('Online-Modul konnte nicht geladen werden. Lokales 1v1 funktioniert trotzdem.');return}
 if(retry===0){try{online.peer?.destroy?.()}catch(e){};game=newGame(Date.now());online.mode='host';online.role=1}
 online.connected=false;online.room=v22FreshRoom();const id='avg-'+online.room;
 try{
   const peer=new Peer(id);online.peer=peer;
   peer.on('open',()=>{if(online.peer===peer)renderOnlineLobby('host')});
   peer.on('connection',conn=>{if(online.peer!==peer)return;try{if(online.conn&&online.conn!==conn)online.conn.close?.()}catch(e){};online.conn=conn;wireConn(conn,true)});
   peer.on('error',e=>{

     toast('Room konnte nicht erstellt werden: '+(e?.type||'Verbindungsfehler'));
   });
 }catch(e){if(retry<4){setTimeout(()=>createOnline(retry+1),80)}else toast('Online-Room nicht verfügbar.')}
 renderOnlineLobby('host');
}

/* ===== AVG V2.3 — STORY ENGINE / ARTWORK / OST / QA ===== */
V2.version='2.3';
Object.assign(SETTINGS_DEFAULT,{musicVolume:.34,battleAutoplay:true});
if(settings.musicVolume==null)settings.musicVolume=.34;
