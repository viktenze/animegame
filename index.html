function fallbackTechniqueName(c,trait,slot){const pool=PERSONAL_TECHNIQUE_BANK[trait]||PERSONAL_TECHNIQUE_BANK.technique;const base=pool[hash(c.id+'|'+trait+'|'+slot)%pool.length];const pref=PERSONAL_STYLE_PREFIX[hash(c.name+'|'+slot)%PERSONAL_STYLE_PREFIX.length];return slot<2?`${c.name} · ${base}`:`${pref} ${base}`}
function skillObj(c,name,trait,bias=9,idx=0){return {id:`${c.id}::${idx}::${slug(name)}`,name,trait,bias,owner:c.id}}
function buildSkillKit(c){
 const canon=CANON_SKILLS[c.name];
 if(canon)return canon.map((x,i)=>({...skillObj(c,x[0],x[1],x[2],i),origin:'canon'}));
 const tags=[...(c.tags?.length?c.tags:['technique'])];
 if(!tags.includes((VERSE_TAGS[c.franchise]||[])[0])&&(VERSE_TAGS[c.franchise]||[])[0])tags.push(VERSE_TAGS[c.franchise][0]);
 const out=[],seen=new Set();
 const add=(name,trait,bias=9,origin='profile')=>{name=String(name||'').trim();if(!name||seen.has(name))return;seen.add(name);out.push({...skillObj(c,name,trait,bias,out.length),origin})};
 // Every roster character receives a personal multi-move profile, even when no hand-authored canon kit exists.
 for(let i=0;i<Math.max(8,tags.length*2);i++){
   const trait=tags[i%tags.length]||'technique';
   add(fallbackTechniqueName(c,trait,i),trait,8+(hash(c.id+'|bias|'+i)%5),'profile');
 }
 for(const n of (VERSE_SKILL_SYSTEM[c.franchise]||[])){
   const trait=tags[hash(c.id+n)%tags.length]||'technique';
   add(`${c.name} · ${n}`,trait,8+hash(n+c.id)%4,'verse');
 }
 for(const n of (ROLE_SKILL_NAMES[c.role]||ROLE_SKILL_NAMES.Bruiser))add(`${c.name} · ${n}`,String(c.role||'technique').toLowerCase(),8+hash(c.id+n)%4,'role');
 let k=0;while(out.length<10){const trait=tags[k%tags.length]||'technique';add(fallbackTechniqueName(c,trait,20+k),trait,8+hash(c.id+k)%4,'profile');k++}
 return out.slice(0,10)
}
function genChar(name,fr,i){const uid=slug(fr)+'--'+slug(name),old=oldByKey.get(fr+'|'+name);if(old){const c={...old,id:uid,signature:SIGNATURE_OVERRIDES[name]||null};c.skillKit=buildSkillKit(c);return c}const h=hash(name+fr), tier=i===0?'God':i<5?'High':'Mid';const base=tier==='God'?91:tier==='High'?77:62;const role=roleCycle[(h>>>5)%roleCycle.length];const jitter=k=>Math.max(45,Math.min(100,base+((h>>>k)%17)-8));let c={id:uid,name,franchise:fr,source:['Prototype','Metal Gear Rising','Street Fighter','Tekken','Minecraft','God of War','Asura’s Wrath','Bayonetta','Kirby','Metroid','DOOM','Halo','Super Mario','The Legend of Zelda','Sonic the Hedgehog','Pokémon','Mortal Kombat','Elden Ring','Devil May Cry','Final Fantasy VII','Castlevania'].includes(fr)?'Game':'Anime',tier,rarity:rarityFor(tier,i),role,power:jitter(1),hax:jitter(7),speed:jitter(13),durability:jitter(19),tags:inferredTags(name,fr)};if(role==='Hax'||role==='Mage')c.hax=Math.min(100,c.hax+9);if(role==='Assassin')c.speed=Math.min(100,c.speed+9);if(role==='Bruiser')c.power=Math.min(100,c.power+7);if(role==='Support')c.hax=Math.min(100,c.hax+5);c.signature=SIGNATURE_OVERRIDES[name]||null;c.skillKit=buildSkillKit(c);return c}

function validateRoster(){const bad=[];for(const [fr,n] of Object.entries(VERSE_ROSTERS)){const u=new Set(n);if(u.size<18)bad.push(fr+': '+u.size)}const ids=CHARACTERS.map(c=>c.id),duplicateIds=ids.filter((id,i)=>ids.indexOf(id)!==i);const invalid=CHARACTERS.filter(c=>!c.name||!c.franchise||!['Mid','High','God'].includes(c.tier)||!Number.isFinite(c.power)||!Array.isArray(c.tags)||!Array.isArray(c.skillKit)||c.skillKit.length<6);return {ok:bad.length===0&&duplicateIds.length===0&&invalid.length===0,bad,total:CHARACTERS.length,verses:Object.keys(VERSE_ROSTERS).length,duplicateIds:[...new Set(duplicateIds)],invalid:invalid.map(c=>c.name)}}

function settingsHTML(){const t=[['franchiseLimit','Franchise-Limit','Classic: maximal ein Pick pro Verse und Team. ShowFight ignoriert das bewusst.'],['ban','Ban-System','Jeder bannt einen Pick.'],['joker','Joker','Zwei neue Optionen, eine wählen.'],['mystery','Mystery Box','Neuer Secret-Pick, Gegner sieht ???.'],['double','Double or Nothing','Blind zwischen zwei Karten gambeln.'],['trade','Trade','Nach Pick 4 einmal austauschen.'],['captain','Captain','Kleiner Team-/Clutch-Bonus.'],['lineup','Lineup','Priorität 1–7 festlegen.'],['revive','Revive','Ein einmaliges Comeback im Finale.'],['events','Arena Events','Map-spezifische Modifikatoren.'],['bestOf3','Best of 3','Drei Arenen statt einer.'],['balance','Balance Director','God/High-Rolls und Team-Power ausgleichen.'],['synergy','Team-Synergie','Rollen und Teamzusammenstellung wirken im Fight.'],['counters','Trait-Counter','Sharingan, Anti-Magic, Regeneration, Raum, Zeit usw. werden gegeneinander bewertet.'],['tts','Auto TTS','Story blockweise vorlesen.'],['sfx','SFX','Reveals, Hits, KOs, Winner.'],['music','Battle OST','Synth-Anime-OST unten links.']];return `<div class="section-head"><div><h2>Match-Regeln</h2><p>V2.5 Standard: 7v7 + Balance Director.</p></div></div><div class="settings"><div class="setting"><label>Power Cap</label><select id="powerCap"><option>No Limit</option><option>God</option><option>High</option><option>Mid</option></select><small>Maximales Tier im Pool.</small></div>${t.map(x=>`<div class="setting"><label>${x[1]}<input class="switch" type="checkbox" data-setting="${x[0]}" ${settings[x[0]]?'checked':''}></label><small>${x[2]}</small></div>`).join('')}</div>`}

function startLocal(mode='classic'){if(typeof battleState!=='undefined'){clearTimeout(battleState.timer);clearTimeout(battleState.ttsWatchdog);battleState.nonce++;battleState.paused=true}stopTTS();settings.powerCap=$('#powerCap')?.value||settings.powerCap;game=newGame(mode);online={mode:'local',role:1,room:null,connected:false};if(mode==='classic')classicVerseSetup('local');else showFightSetup('local')}
function classicVerseSetup(target='local'){if(!game)game=newGame('classic');const verses=Object.keys(VERSE_ROSTERS).sort();const active=new Set(game.allowedVerses?.length?game.allowedVerses:verses);modal(`<button class="x" onclick="closeModal()">×</button><div class="kicker">CLASSIC · VERSE FILTER</div><h2>Welche Anime/Game-Verse dürfen rollen?</h2><p>Standardmäßig sind alle aktiviert. Lokal entscheidet ihr gemeinsam; online legt der Host den Pool für beide Spieler fest.</p><div class="versefilter"><div class="versefilter-head"><input id="verseSearch" placeholder="Verse suchen…" style="flex:1;min-width:180px;padding:11px;border-radius:10px;background:#060b15;border:1px solid var(--border);color:#fff"><div class="actions" style="margin:0"><button class="btn secondary" id="allVersesBtn">ALLE</button><button class="btn secondary" id="noneVersesBtn">KEINE</button></div></div><div class="versefilter-grid" id="verseFilterGrid">${verses.map(v=>`<label class="versecheck" data-vname="${esc(v.toLowerCase())}"><input type="checkbox" value="${esc(v)}" ${active.has(v)?'checked':''}><span>${esc(v)}<small>${VERSE_ROSTERS[v].length} Charaktere</small></span></label>`).join('')}</div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">ZURÜCK</button><button class="btn gold" id="applyVersesBtn">POOL BESTÄTIGEN</button></div>`);const grid=$('#verseFilterGrid'),search=$('#verseSearch');search.oninput=()=>{$$('.versecheck').forEach(x=>x.style.display=x.dataset.vname.includes(search.value.toLowerCase())?'':'none')};$('#allVersesBtn').onclick=()=>$$('#verseFilterGrid input').forEach(x=>x.checked=true);$('#noneVersesBtn').onclick=()=>$$('#verseFilterGrid input').forEach(x=>x.checked=false);$('#applyVersesBtn').onclick=()=>{const selected=$$('#verseFilterGrid input:checked').map(x=>x.value);if(!selected.length)return toast('Mindestens ein Verse muss aktiviert bleiben.');game.allowedVerses=selected;game.history.push({type:'verseFilter',count:selected.length});sync();closeModal();if(target==='local')beginConfiguredGame();else renderLobby()}}
function selectedVerseCount(){return game?.allowedVerses?.length||Object.keys(VERSE_ROSTERS).length}
function showFightSetup(target='local'){const verses=Object.keys(VERSE_ROSTERS).sort();modal(`<button class="x" onclick="closeModal()">×</button><div class="kicker">SHOWFIGHT · VERSE VS VERSE</div><h2>Wie werden die Verse verteilt?</h2><p>Random sucht zwei unterschiedliche, vom Durchschnitt her möglichst passende Verse. Manuell lässt den Host beide auswählen.</p><div class="actions"><button class="btn gold" onclick="showFightRandom('${target}')">🎲 VERSES ROLLEN</button><button class="btn secondary" onclick="showFightManual('${target}')">🎯 SELBST AUSWÄHLEN</button></div><p style="margin-top:18px;color:var(--muted)">${verses.length} Verse verfügbar, jeweils mindestens 18 Figuren.</p>`)}
function versePower(fr){return CHARACTERS.filter(c=>c.franchise===fr).reduce((s,c)=>s+impact(c),0)/18}
function balancedVersePair(){const v=Object.keys(VERSE_ROSTERS),a=pick(v),pa=versePower(a);let candidates=v.filter(x=>x!==a).sort((x,y)=>Math.abs(versePower(x)-pa)-Math.abs(versePower(y)-pa)).slice(0,Math.min(12,v.length-1));return [a,pick(candidates)]}
function showFightRandom(target){const [a,b]=balancedVersePair();closeModal();if(target==='local'){game=newGame('showfight');online={mode:'local',role:1,room:null,connected:false};game.verse={1:a,2:b};showVerseReveal(()=>beginConfiguredGame())}else{createRoom('showfight',{1:a,2:b})}}
function showFightManual(target){const v=Object.keys(VERSE_ROSTERS).sort();modal(`<button class="x" onclick="closeModal()">×</button><div class="kicker">SHOWFIGHT · MANUAL</div><h2>PLAYER ONE VERSE</h2><div class="verse-grid">${v.map(fr=>`<button class="verse" onclick="manualP2('${esc(fr)}','${target}')"><b>${esc(fr)}</b><small>${VERSE_ROSTERS[fr].length} Charaktere</small></button>`).join('')}</div>`)}
function manualP2(fr,target){const v=Object.keys(VERSE_ROSTERS).filter(x=>x!==fr).sort();modal(`<button class="x" onclick="closeModal()">×</button><div class="kicker">PLAYER ONE · ${esc(fr)}</div><h2>PLAYER TWO VERSE</h2><div class="verse-grid">${v.map(f=>`<button class="verse" onclick="finishManual('${esc(fr)}','${esc(f)}','${target}')"><b>${esc(f)}</b><small>${VERSE_ROSTERS[f].length} Charaktere</small></button>`).join('')}</div>`)}
function finishManual(a,b,target){closeModal();if(target==='local'){game=newGame('showfight');online={mode:'local',role:1,room:null,connected:false};game.verse={1:a,2:b};showVerseReveal(()=>beginConfiguredGame())}else createRoom('showfight',{1:a,2:b})}
function showVerseReveal(cb){modal(`<div class="kicker">SHOWFIGHT LOCKED</div><h2>${esc(game.verse[1])} <span class="p1c">VS</span> ${esc(game.verse[2])}</h2><p>Ab jetzt zieht Player One ausschließlich aus ${esc(game.verse[1])}; Player Two ausschließlich aus ${esc(game.verse[2])}.</p><div class="modal-actions"><button class="btn gold" onclick="closeModal();(${cb.toString()})()">FIGHT DRAFT STARTEN</button></div>`)}
function beginConfiguredGame(){game.phase=settings.ban?'ban':'draft';game.active=1;if(!settings.ban)game.candidate=drawCharacter(1);sync();route()}
function poolFor(p,includeDiscarded=false){let pool=CHARACTERS.filter(c=>settings.powerCap==='No Limit'||tierRank(c.tier)<=tierRank(settings.powerCap));if(game?.mode==='showfight')pool=pool.filter(c=>c.franchise===game.verse[p]);if(game?.mode==='classic'&&game.allowedVerses?.length)pool=pool.filter(c=>game.allowedVerses.includes(c.franchise));if(game?.mode==='classic'&&settings.franchiseLimit){const owned=new Set(game.teams[p].map(x=>x.franchise));const varied=pool.filter(c=>!owned.has(c.franchise));if(varied.length)pool=varied}if(!includeDiscarded&&game){const used=new Set([...game.discarded,...game.teams[1].map(x=>x.id),...game.teams[2].map(x=>x.id),...Object.values(game.bans).filter(Boolean)]);pool=pool.filter(c=>!used.has(c.id))}return pool}
function teamTierCount(p,t){return game.teams[p].filter(c=>c.tier===t).length}
function teamImpact(p){const t=game.teams[p];return t.length?t.reduce((s,c)=>s+impact(c),0)/t.length:0}
function weightedTier(p,pool){const have={God:pool.some(c=>c.tier==='God'),High:pool.some(c=>c.tier==='High'),Mid:pool.some(c=>c.tier==='Mid')};let w={Mid:.72,High:.23,God:.05};if(settings.balance){const mine=teamImpact(p),opp=teamImpact(p===1?2:1),diff=mine-opp;if(diff>18){w.God*=.18;w.High*=.55}else if(diff>8){w.God*=.45;w.High*=.75}else if(diff<-18){w.God*=1.7;w.High*=1.25}else if(diff<-8){w.God*=1.35;w.High*=1.12}if(teamTierCount(p,'God')>=1)w.God=0;if(teamTierCount(p,'High')>=3)w.High=0}for(const k of Object.keys(w))if(!have[k])w[k]=0;const sum=w.Mid+w.High+w.God;if(!sum)return pool[0]?.tier||'Mid';let r=rng()*sum;for(const k of ['Mid','High','God']){r-=w[k];if(r<=0)return k}return 'Mid'}
function drawCharacter(p){let pool=poolFor(p);if(!pool.length)pool=poolFor(p,true).filter(c=>!game.teams[p].some(x=>x.id===c.id));const tier=weightedTier(p,pool);let tierPool=pool.filter(c=>c.tier===tier);if(!tierPool.length)tierPool=pool;const c=clone(pick(tierPool));game.discarded.push(c.id);return c}
function renderBan(){const p=game.active;if(!settings.ban){beginConfiguredGame();return}const pool=poolFor(p,true).filter(c=>!Object.values(game.bans).includes(c.id)).sort((a,b)=>a.name.localeCompare(b.name));const guestWaiting=online.mode==='guest'&&!!Net.pendingAction;const netHint=online.mode==='local'?'':`<span class="pill ${online.connected?'':'warn'}">${online.connected?'● ONLINE':'◌ RECONNECTING'}</span>`;app.innerHTML=`<section class="screen"><div class="phase"><div><h1>Ban Phase</h1><p>${game.mode==='showfight'?esc(game.verse[p])+' Pool':'Gesamter Pool'} · Player ${p===1?'One':'Two'} bannt einen Charakter.${guestWaiting?' · Auswahl wird synchronisiert…':''}</p></div><div style="display:flex;gap:8px;align-items:center">${netHint}<span class="pill ${p===1?'p1c':'p2c'}">PLAYER ${p===1?'ONE':'TWO'}</span></div></div><input id="banq" style="width:100%;padding:13px;border-radius:12px;background:#080d18;border:1px solid var(--border);color:#fff" placeholder="Charakter suchen"><div id="banlist" class="select-grid" style="margin-top:10px"></div></section>`;const q=$('#banq');const draw=()=>{$('#banlist').innerHTML=pool.filter(c=>(c.name+' '+c.franchise).toLowerCase().includes(q.value.toLowerCase())).slice(0,60).map(c=>`<button class="select" ${canAct(p)&&!guestWaiting?'':'disabled'} onclick="dispatch('ban',{id:'${c.id}',player:${p}})"><div><b>${esc(c.name)}</b><small>${esc(c.franchise)} · ${c.tier}</small></div></button>`).join('')};q.oninput=draw;draw();if(online.mode==='local'&&p===2)passScreen(2,'Ban auswählen')}
function doBan(id,p){if(game.phase!=='ban'||game.active!==p)return;game.bans[p]=id;game.history.push({type:'ban',p,id});if(game.bans[1]&&game.bans[2]){game.phase='draft';game.active=1;game.candidate=drawCharacter(1)}else game.active=2;sync();route()}
function renderDraft(){
 if(game.phase!=='draft')return route();
 const p=game.active;
 // The host is the only authority in online games. A guest must never generate a candidate locally.
 if(!game.candidate&&online.mode!=='guest'&&!game.pendingRemote&&game.teams[p].length<TEAM_SIZE)game.candidate=drawCharacter(p);
 const c=game.candidate,forced=!!game.forced,waiting=online.mode==='guest'&&!!game.pendingRemote;
 const takeDisabled=!canAct(p)||waiting||!c;
 const swapDisabled=!canAct(p)||waiting||!c||forced;
 const mainCard=c?cardHTML(c):`<article class="pickcard waiting-card"><div class="body"><div class="kicker">ONLINE SYNC</div><h2>${waiting?'Entscheidung wird bestätigt…':'Warte auf den nächsten Pick…'}</h2><p>Der Host berechnet den nächsten Charakter. Auf Player Two wird niemals lokal nachgerollt.</p></div></article>`;
 app.innerHTML=`<section class="screen"><div class="phase"><div><h1>${game.mode==='showfight'?'SHOWFIGHT DRAFT':'1V1 DRAFT'}</h1><p>${game.mode==='showfight'?`P1 ${esc(game.verse[1])} · P2 ${esc(game.verse[2])}`:`7v7 Balanced Draft · ${selectedVerseCount()} Verse aktiv`} · Zwei Picks, dann Spielerwechsel.${forced?' · ⚠️ Dieser Pick ist verpflichtend.':''}</p></div><div style="display:flex;gap:8px;align-items:center">${online.mode==='local'?'':`<span id="netLive" class="pill ${online.connected?'on':'warn'}">${online.connected?'● ONLINE':'◌ RECONNECTING'}</span>`}<span class="pill ${p===1?'p1c':'p2c'}">PLAYER ${p===1?'ONE':'TWO'} · ${Math.min(game.teams[p].length+1,TEAM_SIZE)}/${TEAM_SIZE}</span></div></div><div class="draft"><aside class="team">${teamHTML(1)}</aside><main><div class="progress">${Array.from({length:TEAM_SIZE*2},(_,i)=>{const pp=i<TEAM_SIZE?1:2,ix=i%TEAM_SIZE;return `<i class="${ix<game.teams[pp].length?'p'+pp:''}"></i>`}).join('')}</div>${mainCard}<div class="pick-actions"><button class="btn" ${takeDisabled?'disabled':''} onclick="dispatch('take')">${forced?'⚠️ PFLICHTPICK NEHMEN':'✅ NEHMEN'}</button><button class="btn p2" ${swapDisabled?'disabled':''} onclick="dispatch('swap')">${forced?'🔒 WECHSEL GESPERRT':'🎲 WECHSELN'}</button></div><div class="specials"><button class="btn secondary" ${!canAct(p)||waiting||!settings.joker||!game.tokens[p].joker||forced?'disabled':''} onclick="${online.mode==='guest'?"guestSpecialRequest('joker')":'openJoker()'}">🃏 JOKER</button><button class="btn secondary" ${!canAct(p)||waiting||!settings.mystery||!game.tokens[p].mystery||forced?'disabled':''} onclick="${online.mode==='guest'?"guestMysteryPrompt()":'openMystery()'}">🎁 MYSTERY</button><button class="btn secondary" ${!canAct(p)||waiting||!settings.double||!game.tokens[p].double||forced?'disabled':''} onclick="${online.mode==='guest'?"guestSpecialRequest('double')":'openDouble()'}">🎰 DOUBLE</button><button class="btn secondary" ${!canAct(p)||waiting||!settings.trade||!game.tokens[p].trade||game.tradeDone[p]||game.teams[p].length<4||forced?'disabled':''} onclick="${online.mode==='guest'?"guestSpecialRequest('trade')":'openTrade()'}">♻️ TRADE</button></div></main><aside class="team">${teamHTML(2)}</aside></div></section>`;
 loadImages();if(c)loadCardImage(c);
 if(online.mode==='local'&&game._needsPass){game._needsPass=false;passScreen(p,'Draft übernehmen')}
 setTimeout(()=>{if(c)playRareReveal(c);showPendingGuest()},80)
}
function teamHTML(p){const viewer=online.mode==='local'?game.active:online.role;return `<h3 class="${p===1?'p1c':'p2c'}">PLAYER ${p===1?'ONE':'TWO'}</h3>${Array.from({length:TEAM_SIZE},(_,i)=>{const c=game.teams[p][i];if(!c)return `<div class="slot"><div></div><div><b>Slot ${i+1}</b><small>Leer</small></div></div>`;const hide=c.mystery&&viewer!==p&&!['battle','result'].includes(game.phase);return `<div class="slot ${hide?'mystery':''}">${hide?`<img src="${avatar('???')}">`:`<img data-img="${c.id}" src="${avatar(c.name,c.franchise)}">`}<div><b>${hide?'MYSTERY PICK':esc(c.name)}</b><small>${hide?'???':esc(c.role+' · '+c.rarity)}</small></div>${game.captains[p]===c.id?'👑':''}${hide?'':`<span class="art-refresh" onclick="event.stopPropagation();refreshArt('${c.id}')">↻ ART</span>`}</div>`}).join('')}<div class="tokens">${['joker','mystery','double','trade','revive'].map(k=>{const live=k==='revive'&&game.result?.reviveSpent?.[p]?0:game.tokens[p][k];return `<span class="token ${live?'':'used'}">${k.toUpperCase()}</span>`}).join('')}</div>`}
function cardHTML(c){if(!c)return '';return `<article class="pickcard"><div class="art"><img id="mainart" src="${avatar(c.name,c.franchise)}" alt="${esc(c.name)}"><div class="shade"></div><span class="badge left">${c.tier} · ${c.rarity}</span><span class="badge right">${esc(c.franchise)}</span><span class="art-refresh" onclick="event.stopPropagation();refreshArt('${c.id}','mainart')">↻ ART</span></div><div class="body"><div class="eyebrow">${c.source} · ${c.role}</div><h2>${esc(c.name)}</h2><div class="tags">${c.tags.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="stats">${[['PWR',c.power],['HAX',c.hax],['SPD',c.speed],['DUR',c.durability]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('')}</div><div class="tags" style="margin-top:10px">${c.skillKit.slice(0,4).map(s=>`<span class="tag">⚔ ${esc(s.name)}</span>`).join('')}</div></div></article>`}
function commitTake(p,remote=false){
 if(game.phase!=='draft'||game.active!==p||game.pendingRemote||!game.candidate)return false;
 const c=clone(game.candidate),forced=!!game.forced;c.mystery=false;
 game.teams[p].push(c);game.history.push({type:forced?'forced':'take',p,id:c.id});game.candidate=null;game.forced=false;
 if(remote){
   if(forced)game.pendingRemote={type:'forcedAck',player:p,taken:c};
   else{const miss=drawCharacter(p);game.missed[p].push(miss);game.history.push({type:'missed',p,id:miss.id});game.pendingRemote={type:'takeAck',player:p,taken:c,missed:miss}}
   sync();return true;
 }
 if(forced){sync();modal(`<h2>⚠️ Pflichtpick: ${esc(c.name)}</h2><p>Der Wechsel hat diesen Charakter fest gemacht. Dieser Pick zählt jetzt wie ein normaler Team-Slot.</p><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">WEITER</button></div>`);return true}
 const miss=drawCharacter(p);game.missed[p].push(miss);game.history.push({type:'missed',p,id:miss.id});sync();revealTaken(c,miss,p);return true
}
function commitSwap(p,remote=false){
 if(game.phase!=='draft'||game.active!==p||game.pendingRemote||!game.candidate)return false;
 if(game.forced){toast('Dieser Charakter ist bereits dein Pflichtpick. Du musst ihn nehmen.');return false}
 const old=game.candidate;game.history.push({type:'swap',p,id:old.id});game.candidate=drawCharacter(p);game.forced=true;sync();
 if(!remote)modal(`<h2>🎲 Wechsel bestätigt</h2><p>${esc(old.name)} ist weg. <b>${esc(game.candidate.name)}</b> ist jetzt dein Pflichtpick.</p><p style="color:var(--muted)">Ab jetzt gibt es für diesen Slot keinen zweiten Wechsel.</p><div class="modal-actions"><button class="btn p2" onclick="closeModal();renderDraft()">PFLICHTPICK ANSEHEN</button></div>`);
 return true
}
function take(){return commitTake(game.active,false)}
function swap(){return commitSwap(game.active,false)}
async function revealTaken(a,b,p){const [ia,ib]=await Promise.all([resolveImage(a),resolveImage(b)]);modal(`<h2>${esc(a.name)} kommt ins Team</h2><div class="reveal-grid"><div class="mini"><img src="${ia}"><div class="copy"><b>${esc(a.name)}</b><small>${esc(a.franchise)}</small></div></div><div class="mini"><img src="${ib}"><div class="copy"><b>❌ VERPASST: ${esc(b.name)}</b><small>${esc(b.franchise)}</small></div></div></div><div class="modal-actions"><button class="btn" onclick="closeModal();afterPick(${p})">WEITER</button></div>`);SFX.pick();playRareReveal(a)}
function afterPick(p){if(settings.trade&&game.teams[p].length===4&&!game.tradeDone[p]&&game.tokens[p].trade){if(online.mode==='host'&&p===2){game.pendingRemote={type:'tradePrompt',player:2};sync();return}openTrade();return}advance(p)}
function advance(p){if(game.teams[1].length>=TEAM_SIZE&&game.teams[2].length>=TEAM_SIZE){game.phase=settings.captain?'captain':settings.lineup?'order':'battle';game.active=1;sync();route();return}game.turnPicks++;if(game.turnPicks>=2||game.teams[p].length>=TEAM_SIZE){game.turnPicks=0;game.active=p===1?2:1;game._needsPass=online.mode==='local'}if(game.teams[game.active].length>=TEAM_SIZE)game.active=game.active===1?2:1;game.candidate=drawCharacter(game.active);sync();renderDraft()}
function openJoker(){const p=game.active;if(!game.tokens[p].joker)return;const a=drawCharacter(p),b=drawCharacter(p);game._joker=[a,b];Promise.all([resolveImage(a),resolveImage(b)]).then(img=>modal(`<button class="x" onclick="cancelSpecial('joker')">×</button><h2>🃏 Joker</h2><p>Token wird erst verbraucht, wenn du wirklich einen auswählst.</p><div class="reveal-grid">${[a,b].map((c,i)=>`<button class="select" onclick="dispatch('jokerChoose',{id:'${c.id}'})"><img src="${img[i]}"><div><b>${esc(c.name)}</b><small>${c.tier} · ${esc(c.franchise)}</small></div></button>`).join('')}</div><div class="modal-actions"><button class="btn secondary" onclick="cancelSpecial('joker')">ZURÜCK</button></div>`))}
function jokerChoose(id){const p=game.active,opts=game._joker||[],c=opts.find(x=>x.id===id),other=opts.find(x=>x.id!==id);if(!c)return;game.tokens[p].joker=0;game.teams[p].push(c);game.missed[p].push(other);game.history.push({type:'joker',p,id:c.id,missed:other.id});delete game._joker;game.candidate=null;closeModal();sync();revealTaken(c,other,p)}

function traitCounter(a,b){if(!settings.counters)return {score:0,reasons:[]};let s=0,reasons=[];const A=new Set(a.tags),B=new Set(b.tags);for(const [atk,defs,val,why] of counterRules){if(A.has(atk)&&(!defs.length||defs.some(x=>B.has(x)))){s+=val;if(val>=7)reasons.push(why)}}if(B.has('infinity')&&!A.has('space')&&!A.has('concept')&&!A.has('reality')){s-=13;reasons.push('Infinity blockiert normalen direkten Kontakt')}if(B.has('intangible')&&!A.has('space')&&!A.has('sense')&&!A.has('reality')){s-=10;reasons.push('Intangibility lässt einen direkten Commit ins Leere laufen')}if(B.has('barrier')&&!A.has('anti-magic')&&!A.has('concept')&&a.power<88){s-=5;reasons.push('eine Barriereschicht schluckt einen Teil des ersten Bursts')}if(B.has('regen')&&!A.has('concept')&&!A.has('absorb')&&!A.has('reality'))s-=4;if(a.speed>b.speed+14){s+=5;reasons.push('der Speed-Vorteil öffnet zuerst ein Fenster')}if(a.hax>b.hax+18){s+=5;reasons.push('die Hax-Differenz erzwingt eine Spezialantwort')}s+=ROLE_EDGE[a.role]?.[b.role]||0;return {score:s,reasons:[...new Set(reasons)].slice(0,4)}}
function arenaMod(c,a){let s=0;if(a==='Megacity'){if(c.role==='Assassin')s+=7;if(c.tags.includes('environment'))s+=5;if(c.role==='Summoner')s+=4}if(a==='Fractured Multiverse'){if(c.tags.some(x=>['space','concept','reality','time'].includes(x)))s+=8}if(a==='Null Arena'){if(c.durability>90)s+=4}return s}

function teamSynergy(p){if(!settings.synergy)return 0;const t=game.teams[p],roles=new Set(t.map(x=>x.role)).size;let s=roles*1.2;if(t.some(x=>x.role==='Support'))s+=3;if(t.some(x=>x.role==='Hax')&&t.some(x=>x.role==='Bruiser'))s+=2.5;if(t.some(x=>x.role==='Summoner')&&t.some(x=>x.role==='Assassin'))s+=2;return Math.min(14,s)}
function moveMatchScore(move,a,b){let s=move.bias||9;const B=new Set(b.tags||[]),t=move.trait;if(t==='space'&&(B.has('infinity')||B.has('intangible')||B.has('barrier')))s+=10;if(t==='concept'&&(B.has('regen')||B.has('barrier')||b.durability>90))s+=9;if(t==='anti-magic'&&(B.has('magic')||B.has('mana')||B.has('domain')))s+=11;if(t==='sense'&&(B.has('illusion')||B.has('assassin')))s+=7;if(t==='analysis')s+=Math.max(0,(b.hax-65)/8);if(t==='speed')s+=(a.speed-b.speed)/12;if(['physical','sword','martial'].includes(t))s+=(a.power-b.durability)/18;if(['energy','ki','magic','chakra'].includes(t))s+=(a.hax+b.power/5-b.durability/2)/18;if(t==='return-zero'||t==='reality')s+=8;if(t==='full-counter'&&['Mage','Hax'].includes(b.role))s+=7;return s}
function pickCombatMove(a,b,ctx,avoid=[]){const used=ctx.moveUsage[a.id]||{};const kit=(a.skillKit?.length?a.skillKit:buildSkillKit(a));let scored=kit.map(m=>({m,s:moveMatchScore(m,a,b)-((used[m.id]||0)*5)-(avoid.includes(m.id)?28:0)+rng()*2.4})).sort((x,y)=>y.s-x.s);const top=scored.slice(0,Math.min(4,scored.length));let total=top.reduce((s,x)=>s+Math.max(.2,x.s-top[top.length-1].s+1),0),r=rng()*total,choice=top[0].m;for(const x of top){r-=Math.max(.2,x.s-top[top.length-1].s+1);if(r<=0){choice=x.m;break}}used[choice.id]=(used[choice.id]||0)+1;ctx.moveUsage[a.id]=used;return choice}
function phrase(pool,key,ctx){
 if(!pool?.length)return '';
 if(!ctx)return pool[hash(String(key))%pool.length];
 ctx.phraseUsage=ctx.phraseUsage||{};
 const group=String(hash(pool.join('¦'))),used=ctx.phraseUsage[group]||(ctx.phraseUsage[group]=[]);
 let start=hash(key+'|'+ctx.variant+'|'+ctx.beat)%pool.length,idx=start;
 for(let i=0;i<pool.length;i++){idx=(start+i)%pool.length;if(!used.includes(idx))break}
 if(used.length>=pool.length){used.length=0;idx=start}
 used.push(idx);return pool[idx]
}

function moveCounterText(move,defender,ctx){const D=new Set(defender.tags||[]);let k='default';if(D.has('infinity')&&!['space','concept','reality','return-zero'].includes(move.trait))k='infinity';else if(D.has('intangible')&&!['space','reality','sense'].includes(move.trait))k='intangible';else if(D.has('regen')&&!['concept','absorb','reality'].includes(move.trait))k='regen';else if(D.has('barrier')&&!['concept','anti-magic','space'].includes(move.trait))k='barrier';else if(D.has('illusion')&&move.trait!=='sense')k='illusion';else if(D.has('vector')&&['physical','energy','ki','weapons'].includes(move.trait))k='vector';return phrase(DEFENSE_PHRASES[k],defender.id+move.id+k,ctx)}

function sceneTextOpen(a,b,mA,mB,arena,ev,ctx){const o=phrase(OPENERS,a.id+b.id+'open',ctx),tr=phrase(TRANSITIONS,mA.id+mB.id+'trans',ctx),def=moveCounterText(mA,b,ctx),pair=pairInteractionText(a,b,mA,mB,ctx),mechanics=moveDuelExplanation(a,b,mA,mB,ctx),seen=(ctx.pairHistory?.[a.id+'|'+b.id]||0);const rematch=seen?` Sie standen sich in diesem Match bereits gegenüber; ${b.name} kennt deshalb mindestens einen Teil von ${a.name}s altem Rhythmus und dieselbe Eröffnung würde weniger Wert haben.`:'';return `${a.name} ${o} und startet mit **${mA.name}**. ${mechanics}\n\n${pair} ${def}${rematch} ${tr} ${a.name} ${mindset(a,ctx,'openmind')}. In ${arena} unter ${ev} zählen damit nicht bloß Werte, sondern ${interactionEdge(a,b,mA,mB).ctr.reasons.join('; ')||'welche konkrete Technik die nächste Reaktion tatsächlich erzwingt'}.`}

function sceneTextFinish(w,l,m1,m2,m3,defMove,ctr,arena,ctx){let chain=phrase(FINISH_A,w.id+l.id+'finish',ctx).replaceAll('{M1}',`**${m1.name}**`).replaceAll('{M2}',`**${m2.name}**`).replaceAll('{M3}',`**${m3.name}**`);const reason=ctr.reasons.length?phrase(ctr.reasons,w.id+l.id+'reason',ctx):`${w.name} gewinnt das bessere Timing zwischen Angriff und Reset`;const close=phrase([`${l.name} versucht **${defMove.name}** als letzte Gegenaktion, aber nicht mehr gleichzeitig gegen alle drei Ebenen.`,`${l.name} setzt **${defMove.name}** gegen den Abschluss; dadurch wird ein Layer gestoppt, aber genau der Raum für den nächsten geöffnet.`,`Mit **${defMove.name}** liest ${l.name} den Finish grundsätzlich richtig, doch die vorherige Sequenz hat die Position bereits festgelegt.`,`${l.name} wirft **${defMove.name}** in den dritten Layer. Der Guard beantwortet einen Teil des Plans, nicht aber dessen komplette Reihenfolge.`,`**${defMove.name}** verhindert den geraden Abschluss, zwingt ${w.name} aber genau in den Winkel, den **${m3.name}** abdeckt.`,`Noch einmal versucht ${l.name} über **${defMove.name}** einen Reset zu erzwingen; ${w.name} hat diese Antwort nach den ersten Exchanges bereits einkalkuliert.`,`Der letzte defensive Commit ist **${defMove.name}**. Er löst das unmittelbare Problem, nicht aber den Positionsnachteil, den die zwei vorherigen Moves erzeugt haben.`,`Mit **${defMove.name}** kauft ${l.name} einen Frame, doch ${w.name} hat den Finisher bewusst erst hinter zwei anderen Drohungen versteckt.`],w.id+l.id+defMove.id+'close',ctx);const mech1=traitMechanic(m1,w,l,ctx,'f1'),mech2=traitMechanic(m2,w,l,ctx,'f2'),mech3=traitMechanic(m3,w,l,ctx,'f3');return `${w.name} ${chain}. Dabei ${m1.name} ${mech1}; **${m2.name}** ${mech2}; und **${m3.name}** ${mech3}. ${close}\n\n${reason}. ${w.name} ${mindset(w,ctx,'finishmind')}. Der KO entsteht damit aus einer konkreten Kette von Entscheidungen: Reaktion erzwingen, die Gegenreaktion lesen, den sicheren Reset schließen und erst dann function duelScore(a,b,arena,ev,p=1,ctx=null){const ctr=traitCounter(a,b),captain=game.captains[p]===a.id?7:0;const best=(a.skillKit||[]).map(m=>moveMatchScore(m,a,b)).sort((x,y)=>y-x).slice(0,3).reduce((s,x)=>s+x,0)/3||8;const base=impact(a)+arenaMod(a,arena)+ev.fn(a)+ctr.score*2.6+teamSynergy(p)+captain+best*1.7;return {score:Math.max(35,base),ctr,best}}

  publish(topic,obj){if(!topic)return false;const full=JSON.stringify({...obj,_mid:obj._mid||this.id('m'),session:this.session,room:this.room});if(full.length<=3000){this.rawPost(topic,full);return true}const cid=this.id('chunk'),parts=[];for(let i=0;i<full.length;i+=2500)parts.push(full.slice(i,i+2500));parts.forEach((data,i)=>this.rawPost(topic,JSON.stringify({type:'__chunk',cid,i,n:parts.length,data,session:this.session,room:this.room,_mid:this.id('m')})));return true},
  onRaw(topic,raw){let m;try{m=JSON.parse(raw)}catch(e){return}if(m.type==='__chunk'){let q=this.chunks.get(m.cid)||{n:m.n,p:[]};q.p[m.i]=m.data;this.chunks.set(m.cid,q);if(q.p.filter(Boolean).length===q.n){this.chunks.delete(m.cid);try{this.onMessage(topic,JSON.parse(q.p.join('')))}catch(e){}}return}this.onMessage(topic,m)},
  onMessage(topic,m){if(m.room!==this.room)return;if(m._mid){if(this.seen.has(m._mid))return;this.seen.add(m._mid);if(this.seen.size>900)this.seen=new Set([...this.seen].slice(-450))}
    if(topic===this.lobbyTopic()&&this.role==='guest'&&m.type==='lobby'&&m.status==='open'){if(!m.session)return;const changed=this.session!==m.session;if(changed){this.session=m.session;this.hostId=m.hostId;this.lastSeq=-1;this.joinedSession=null;try{this.sessionSource?.close()}catch(e){}this.sessionSource=this.openSource(this.sessionTopic(),'session')}const now=Date.now(),needJoin=changed||this.joinedSession!==m.session||(!online.connected&&now-this.lastJoinSent>5500);if(needJoin&&now-this.lastJoinSent>900){this.lastJoinSent=now;this.joinedSession=m.session;setTimeout(()=>this.publish(this.sessionTopic(),{type:'join',guestId:this.guestId,rejoin:!changed,from:this.guestId}),100)}return}
    if(topic!==this.sessionTopic()||m.session!==this.session)return;
    if(this.role==='host'){
      if(m.type==='join'){this.guestId=m.guestId;this.peerSeen=Date.now();online.connected=true;this.publish(this.sessionTopic(),{type:'presence',to:m.guestId,from:this.hostId});this.sendState();this.uiRefresh()}
      else if(m.type==='ping'&&m.guestId===this.guestId){this.peerSeen=Date.now();online.connected=true;this.publish(this.sessionTopic(),{type:'presence',to:m.guestId,from:this.hostId});this.uiRefresh()}
      else if(m.type==='action'&&m.guestId===this.guestId){this.peerSeen=Date.now();online.connected=true;if(m.aid&&this.processedActions.has(m.aid)){this.sendState();return}if(m.aid){this.processedActions.add(m.aid);if(this.processedActions.size>800)this.processedActions=new Set([...this.processedActions].slice(-400))}handleGuestAction(m.action,m.payload||{});this.sendState();route()}
    }else if(this.role==='guest'){
      if(m.type==='presence'&&m.to===this.guestId){this.peerSeen=Date.now();online.connected=true;this.uiRefresh()}
      else if(m.type==='state'){this.peerSeen=Date.now();if((m.seq??-1)<this.lastSeq)return;this.lastSeq=m.seq;if(this.pendingAction&&m.seq>this.pendingAction.baseSeq)this.pendingAction=null;closeModal();game=unpackGameState(m.state);settings=m.settings||settings;online.connected=true;route();this.uiRefresh();if(game?.pendingRemote?.player===2)setTimeout(()=>showPendingGuest(),25)}
    }
  },
  publishLobby(){if(this.role!=='host'||!this.session)return;this.publish(this.lobbyTopic(),{type:'lobby',status:'open',session:this.session,hostId:this.hostId,ts:Date.now(),from:this.hostId})},
  sendState(){if(this.role!=='host'||!this.session||!game)return;this.publish(this.sessionTopic(),{type:'state',seq:++this.seq,state:packGameState(true),settings,from:this.hostId})},
  sendAction(a,p){if(this.role!=='guest'||!this.session||this.pendingAction)return false;const aid=this.id('a');this.pendingAction={aid,baseSeq:this.lastSeq,action:a,payload:p,ts:Date.now(),tries:0};this.publish(this.sessionTopic(),{type:'action',guestId:this.guestId,action:a,payload:p,aid,from:this.guestId});this.pendingAction.tries++;return true},
  heartbeat(){if(this.peerSeen&&Date.now()-this.peerSeen>22000)online.connected=false;if(this.role==='host')this.publishLobby();else if(this.session){this.publish(this.sessionTopic(),{type:'ping',guestId:this.guestId,from:this.guestId});if(this.pendingAction&&Date.now()-this.pendingAction.ts>1800){const q=this.pendingAction;if(q.tries>=6){toast('Synchronisierung dauert länger — Room-State wird neu angefordert.');q.tries=0;this.resubscribeGuest();this.publish(this.sessionTopic(),{type:'join',guestId:this.guestId,rejoin:true,from:this.guestId})}this.publish(this.sessionTopic(),{type:'action',guestId:this.guestId,action:q.action,payload:q.payload,aid:q.aid,from:this.guestId});q.ts=Date.now();q.tries++}}this.uiRefresh()},
  resubscribeGuest(){if(this.role!=='guest')return;if(this.session){try{this.sessionSource?.close()}catch(e){}this.sessionSource=this.openSource(this.sessionTopic(),'session');setTimeout(()=>this.publish(this.sessionTopic(),{type:'join',guestId:this.guestId,rejoin:true,from:this.guestId}),100)}},
  close(resetSession=true){clearInterval(this.hb);try{this.lobbySource?.close()}catch(e){}try{this.sessionSource?.close()}catch(e){}this.lobbySource=this.sessionSource=null;this.clients=[{name:'NTFY HTTPS/SSE',connected:false}];if(resetSession)this.session=null;this.lastSeq=-1;this.pendingAction=null;this.peerSeen=0;this.lastJoinSent=0;this.joinedSession=null;this.chunks.clear();this.seen.clear();this.processedActions.clear()}
};
function packCharRef(c,hide=false){if(!c)return null;if(hide)return [null,1];return [c.id,c.mystery?1:0]}
function unpackCharRef(x,placeholder='Mystery Pick'){if(!x)return null;if(!x[0])return {id:'hidden-'+Math.random(),name:placeholder,franchise:'???',source:'Anime',tier:'Mid',rarity:'???',role:'Mystery',power:0,hax:0,speed:0,durability:0,tags:[],skillKit:[],mystery:true};const base=BY_ID.get(x[0]);if(!base)return null;const c=clone(base);c.mystery=!!x[1];return c}
function packPending(q,forGuest){if(!q)return null;const o={type:q.type,player:q.player,manual:q.manual,doubleResult:q.doubleResult};if(q.taken)o.taken=packCharRef(q.taken);if(q.missed)o.missed=packCharRef(q.missed);if(q.secret)o.secret=packCharRef(q.secret);if(q.old)o.old=packCharRef(q.old);if(q.fresh)o.fresh=packCharRef(q.fresh);if(q.options)o.options=q.options.map(c=>packCharRef(c));return o}
function unpackPending(q){if(!q)return null;const o={...q};if(q.taken)o.taken=unpackCharRef(q.taken);if(q.missed)o.missed=unpackCharRef(q.missed);if(q.secret)o.secret=unpackCharRef(q.secret);if(q.old)o.old=unpackCharRef(q.old);if(q.fresh)o.fresh=unpackCharRef(q.fresh);if(q.options)o.options=q.options.map(unpackCharRef).filter(Boolean);return o}
function packGameState(forGuest=false){const hidden=p=>game.teams[p].map(c=>packCharRef(c,forGuest&&p===1&&c.mystery&&!['battle','result'].includes(game.phase)));return {version:game.version,seed:game.seed,mode:game.mode,phase:game.phase,active:game.active,turnPicks:game.turnPicks,candidate:packCharRef(game.candidate),forced:!!game.forced,teams:{1:hidden(1),2:hidden(2)},missed:{1:game.missed[1].map(c=>c.id),2:game.missed[2].map(c=>c.id)},bans:game.bans,tokens:game.tokens,tradeDone:game.tradeDone,captains:game.captains,order:game.order,verse:game.verse,allowedVerses:game.allowedVerses,historyCount:game.history?.length||game.historyCount||0,pendingRemote:packPending(game.pendingRemote,forGuest),rematch:game.rematch,matchNo:game.matchNo}}
function unpackGameState(s){const g=newGame(s.mode||'classic');g.version=s.version||VERSION;g.seed=s.seed;g.phase=s.phase;g.active=s.active;g.turnPicks=s.turnPicks||0;g.candidate=unpackCharRef(s.candidate);g.forced=!!s.forced;g.teams={1:(s.teams?.[1]||[]).map(unpackCharRef).filter(Boolean),2:(s.teams?.[2]||[]).map(unpackCharRef).filter(Boolean)};g.missed={1:(s.missed?.[1]||[]).map(id=>clone(BY_ID.get(id))).filter(Boolean),2:(s.missed?.[2]||[]).map(id=>clone(BY_ID.get(id))).filter(Boolean)};g.bans=s.bans||{1:null,2:null};g.tokens=s.tokens||g.tokens;g.tradeDone=s.tradeDone||g.tradeDone;g.captains=s.captains||g.captains;g.order=s.order||g.order;g.verse=s.verse||g.verse;g.allowedVerses=s.allowedVerses||Object.keys(VERSE_ROSTERS);g.history=[];g.historyCount=s.historyCount||0;g.pendingRemote=unpackPending(s.pendingRemote);g.rematch=s.rematch||{1:false,2:false};g.matchNo=s.matchNo||1;return g}
function redactGameForGuest(){return packGameState(true)}
function retryOnline(){if(!online.room)return;const role=online.mode==='host'?'host':'guest';toast('Relays werden neu verbunden…');Net.connect(role,online.room);renderLobby()}
function createRoom(mode='classic',verse=null){settings.powerCap=$('#powerCap')?.value||settings.powerCap;game=newGame(mode);if(verse)game.verse=verse;game.phase='lobby';online={mode:'host',role:1,room:String(Math.floor(100000+Math.random()*900000)),connected:false};Net.session=Net.id('s');Net.connect('host',online.room);renderLobby()}
function joinPrompt(){modal(`<button class="x" onclick="closeModal()">×</button><h2>Room beitreten</h2><input id="roomin" maxlength="6" inputmode="numeric" placeholder="123456" style="width:100%;padding:13px;background:#080d18;border:1px solid var(--border);color:#fff;border-radius:10px"><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">ZURÜCK</button><button class="btn p2" onclick="joinRoom()">JOIN</button></div>`)}
function joinRoom(){const code=$('#roomin').value.trim();if(!/^\d{6}$/.test(code))return toast('6-stelligen Code eingeben.');closeModal();game=newGame('classic');game.phase='lobby';online={mode:'guest',role:2,room:code,connected:false};Net.connect('guest',code);renderLobby()}
function renderLobby(){if(!online.room)return;const connectedBrokers=Net.clients.filter(x=>x.connected).length,status=Net.clients.map(x=>`<span class="${x.connected?'on':''}">${x.name} ${x.connected?'●':'○'}</span>`).join('');app.innerHTML=`<section class="screen"><div class="card lobby" style="padding:28px"><div class="kicker">ONLINE DUEL · V${VERSION} ${BUILD} · ${online.mode==='host'?'HOST':'GUEST'}</div><h1>${game?.mode==='showfight'?'SHOWFIGHT':'1V1 CLASSIC'} ROOM</h1><div class="roomcode">${online.room}</div><div class="net">${status}</div><p><b>${connectedBrokers}/${Net.brokers.length} HTTPS/SSE-Verbindung aktiv.</b> ${online.connected?'Gegenspieler verbunden — Lobby synchron.':'Warte auf den Gegenspieler bzw. Reconnect…'}</p>${game?.mode==='showfight'&&game.verse[1]?`<p><b>${esc(game.verse[1])}</b> vs <b>${esc(game.verse[2])}</b></p>`:game?.mode==='classic'?`<p><b>${selectedVerseCount()}</b> von ${Object.keys(VERSE_ROSTERS).length} Verse im Draft-Pool.</p>`:''}<div class="actions" style="justify-content:center">${online.mode==='host'?`<button class="btn secondary" onclick="copyInvite()">🔗 INVITE LINK</button>${game?.mode==='classic'?`<button class="btn secondary" onclick="classicVerseSetup('host')">☑ VERSE AUSWÄHLEN</button>`:''}<button class="btn" ${online.connected&&connectedBrokers?'':'disabled'} onclick="beginConfiguredGame()">MATCH STARTEN</button>`:''}<button class="btn secondary" onclick="retryOnline()">↻ ONLINE NEU VERBINDEN</button><button class="btn danger" onclick="leaveRoom()">ROOM VERLASSEN</button></div></div></section>`}
function copyInvite(){const u=location.origin+location.pathname+'#room='+online.room;navigator.clipboard?.writeText(u).then(()=>toast('Einladungslink kopiert.')).catch(()=>toast(u))}
function leaveRoom(){Net.close();online={mode:'local',role:1,room:null,connected:false};home()}
function sync(){if(online.mode==='host')Net.sendState()}
/* deep-link join */
setTimeout(()=>{const m=location.hash.match(/room=(\d{6})/);if(m&&!game){online={mode:'guest',role:2,room:m[1],connected:false};game=newGame('classic');game.phase='lobby';Net.connect('guest',m[1]);renderLobby()}},40);
function rules(){const v=validateRoster();modal(`<button class="x" onclick="closeModal()">×</button><h2>🎮 V2.5 Regeln & QA</h2><p><b>7v7:</b> zwei Picks am Stück. Take zeigt danach den verpassten Pick. Switch darf pro Slot genau einmal benutzt werden; der unmittelbar nächste Charakter ist zwingend und der Switch-Button wird gesperrt.</p><p><b>Einheitliche Engine:</b> Local 1v1, Online 1v1 und ShowFight benutzen dieselbe 7v7-, Rarity-, Special-, Battle- und TTS-Engine. Online läuft über einen HTTPS/SSE-Room-Relay statt direkter Browser-P2P-Verbindung.</p><p><b>Balance Director:</b> Mid ~72 %, High ~23 %, God ~5 %. Maximal etwa 1 God und 3 High pro Team, solange genügend andere Figuren im Pool sind. Ein deutlich stärkeres Team bekommt zusätzlich schlechtere Rare-Roll-Gewichte.</p><p><b>Classic Verse-Filter:</b> Vor jedem normalen Match können lokal bzw. vom Online-Host alle erlaubten Anime/Game-Verse angehakt werden; Standard = alle aktiv.</p><p><b>ShowFight:</b> Random oder Host-Auswahl für zwei Verse. Danach zieht jeder ausschließlich aus seinem Verse.</p><p><b>Roster Audit:</b> ${v.ok?'OK':'FEHLER'} · ${v.verses} Verse · ${v.total} Figuren · Minimum 18 pro Verse.</p><div class="actions"><button class="btn secondary" onclick="artworkAudit(game?.mode==='showfight'?game.verse[online.role]:null,false)">🖼 QUICK ART AUDIT</button><button class="btn secondary" onclick="artworkAudit(null,true)">🧪 FULL 792 ART AUDIT</button></div>`)}
$('#homeBtn').onclick=home;$('#rulesBtn').onclick=rules;$('#soundBtn').onclick=openVoice;
ensureMusicDock();home();
