/* ---------- artwork resolver: strict > pretty > fallback, never random ---------- */
const V23_IMG_KEY='avg-img-cache-v23';
let V23_IMG_CACHE={};try{V23_IMG_CACHE=JSON.parse(localStorage.getItem(V23_IMG_KEY)||'{}')||{}}catch(e){}
const V23_ANILIST_QUERY={
 'son-goku':'Goku Son','sailor-moon':'Usagi Tsukino','mob':'Shigeo Kageyama','all-might':'Toshinori Yagi','sung-jin-woo':'Sung Jin-Woo',
 'sosuke-aizen':'Sousuke Aizen','yuno':'Yuno Grinberryall','giorno-giovanna-ger':'Giorno Giovanna','alucard':'Alucard'
};
const V23_WIKI_TITLES={
 'vergil':'Vergil (Devil May Cry)','dante':'Dante (Devil May Cry)','nero':'Nero (Devil May Cry)','sephiroth':'Sephiroth (Final Fantasy)','cloud-strife':'Cloud Strife','kratos':'Kratos (God of War)','asura':'Asura (Asura\'s Wrath)','bayonetta':'Bayonetta (character)','kirby':'Kirby (character)','link':'Link (The Legend of Zelda)','ganondorf':'Ganon','samus-aran':'Samus Aran','doom-slayer':'Doom Slayer','master-chief':'Master Chief (Halo)','sonic':'Sonic the Hedgehog (character)','shadow-the-hedgehog':'Shadow the Hedgehog','mario':'Mario','mewtwo':'Mewtwo','arceus':'Arceus','alex-mercer':'Alex Mercer','raiden':'Raiden (Metal Gear)','akuma':'Akuma (Street Fighter)','kazuya-mishima':'Kazuya Mishima','liu-kang':'Liu Kang','scorpion':'Scorpion (Mortal Kombat)','the-tarnished':'Tarnished (Elden Ring)','malenia':'Malenia, Blade of Miquella','steve':'Steve (Minecraft)','alucard-castlevania':'Alucard (Castlevania)'
};
function v23Norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function v23Tokens(s=''){return v23Norm(s).split(' ').filter(x=>x.length>1)}
function v23Coverage(a,b){const A=v23Tokens(a),B=v23Tokens(b);if(!A.length||!B.length)return 0;let hit=0;for(const x of A){if(B.some(y=>x===y||x.startsWith(y)||y.startsWith(x)))hit++}return hit/A.length}
function v23PersistArt(){try{localStorage.setItem(V23_IMG_KEY,JSON.stringify(V23_IMG_CACHE))}catch(e){}}
async function v23AniListImage(c){
 try{
  const search=V23_ANILIST_QUERY[c.id]||c.name.replace(/\s*\(.+\)$/,'');
  const query=`query($search:String){Character(search:$search){name{full native alternative} image{large} media(perPage:25){nodes{title{romaji english native}}}}}`;
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{search}})});if(!r.ok)return null;
  const ch=(await r.json())?.data?.Character;if(!ch?.image?.large)return null;
  const names=[ch.name?.full,ch.name?.native,...(ch.name?.alternative||[])].filter(Boolean);const nameScore=Math.max(0,...names.map(n=>v23Coverage(search,n)));
  if(nameScore<.72)return null;
  const media=(ch.media?.nodes||[]).flatMap(n=>[n.title?.romaji,n.title?.english,n.title?.native]).filter(Boolean);
  if(media.length){const fscore=Math.max(0,...media.map(t=>v23Coverage(c.franchise,t)));if(fscore<.34 && !media.some(t=>v23Norm(t).includes(v23Norm(c.franchise))||v23Norm(c.franchise).includes(v23Norm(t))))return null;}
  return ch.image.large;
 }catch(e){return null}
}
async function v23JikanStrict(c){
 try{const q=V23_ANILIST_QUERY[c.id]||c.name.replace(/\s*\(.+\)$/,'');const r=await fetch(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(q)}&limit=8`);if(!r.ok)return null;const rows=(await r.json()).data||[];let best=null,score=0;for(const x of rows){const sc=Math.max(v23Coverage(q,x.name||''),...(x.nicknames||[]).map(n=>v23Coverage(q,n)));if(sc>score){score=sc;best=x}}if(!best||score<.9)return null;return best.images?.jpg?.large_image_url||best.images?.jpg?.image_url||null}catch(e){return null}
}
async function v23WikiExact(title){try{const r=await fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&piprop=thumbnail&pithumbsize=1200&format=json&origin=*`);if(!r.ok)return null;const p=Object.values((await r.json()).query?.pages||{})[0];return p?.thumbnail?.source||null}catch(e){return null}}
resolveImage=async function(c){
 if(!c)return svgAvatar({name:'Unknown'});if(V23_IMG_CACHE[c.id])return V23_IMG_CACHE[c.id];let u=null;
 if(c.source==='Anime'){u=await v23AniListImage(c);if(!u)u=await v23JikanStrict(c)}else if(V23_WIKI_TITLES[c.id])u=await v23WikiExact(V23_WIKI_TITLES[c.id]);
 if(u){V23_IMG_CACHE[c.id]=u;v23PersistArt();return u}return svgAvatar(c)
};
setImg=async function(img,c){if(!img||!c)return;const fallback=svgAvatar(c);img.alt=c.name;img.classList.remove('loaded');const u=await resolveImage(c);img.onerror=()=>{img.onerror=null;img.src=fallback;img.classList.add('loaded');img.dataset.fallback='1'};img.onload=()=>img.classList.add('loaded');img.src=u||fallback;if(String(u).startsWith('data:image'))img.dataset.fallback='1';else delete img.dataset.fallback};
const V23_MOUNT_BASE=mountCard;mountCard=async function(root,c){await V23_MOUNT_BASE(root,c);const art=root?.querySelector('.card-art');if(art&&!art.querySelector('.art-retry')){const b=document.createElement('button');b.className='art-retry';b.type='button';b.textContent='↻ ART';b.title='Bildcache löschen und erneut exakt suchen';b.onclick=e=>{e.stopPropagation();delete V23_IMG_CACHE[c.id];v23PersistArt();mountCard(root,c)};art.appendChild(b)}};
hydrateTeamImages=function(){document.querySelectorAll('[data-char-img]').forEach(async img=>{const c=byId(img.dataset.charImg);if(!c)return;const u=await resolveImage(c);img.onerror=()=>{img.onerror=null;img.src=svgAvatar(c)};img.src=u})};

/* ---------- Mystery privacy: local hot-seat hides secrets after private reveal; online hides them from the opponent ---------- */
teamHTML=function(p){
 const shouldHide=(x)=>!!(x?.mystery&&game?.phase!=='result'&&game?.phase!=='battle'&&(online.mode==='local'||online.role!==p));
 return `<h3 style="color:var(--p${p})">PLAYER ${p===1?'ONE':'TWO'}</h3>${Array.from({length:6},(_,i)=>{const x=game.teams[p][i];if(!x)return `<div class="team-slot"><div class="avatar-fallback"></div><div><strong>Slot ${i+1}</strong><small>Leer</small></div></div>`;const hide=shouldHide(x);return `<div class="team-slot ${hide?'mystery-slot':''}">${hide?`<img src="${svgAvatar({name:'???'})}" alt="Mystery Pick">`:`<img data-char-img="${x.id}" alt="${escapeHtml(x.name)}">`}<div><strong>${hide?'MYSTERY PICK':escapeHtml(x.name)}</strong><small>${hide?'??? · bis zum Finale geheim':escapeHtml(x.role+' · '+x.rarity)}</small></div>${game.captains[p]===x.id?'👑':''}</div>`}).join('')}<div class="token-row">${tokenHTML(p,'joker','Joker')} ${tokenHTML(p,'double','Double')} ${tokenHTML(p,'mystery','Mystery')} ${tokenHTML(p,'trade','Trade')} ${tokenHTML(p,'revive','Revive')}</div>`
};

/* ---------- original anime-inspired OST: no copyrighted tracks ---------- */
const BattleOST={ctx:null,gain:null,timer:null,bar:0,playing:false,
 init(){try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();if(!this.gain){this.gain=this.ctx.createGain();this.gain.gain.value=.001;this.gain.connect(this.ctx.destination)}this.setVolume(settings.musicVolume)}catch(e){}},
 setVolume(v){settings.musicVolume=Math.max(0,Math.min(1,Number(v)||0));if(this.gain)this.gain.gain.setTargetAtTime(.18*settings.musicVolume,this.ctx.currentTime,.04);saveV2Prefs();v23UpdateMusicDock()},
 note(freq,when,d=.22,type='triangle',vol=.12){if(!this.ctx||!this.gain)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.012);g.gain.exponentialRampToValueAtTime(.0001,when+d);o.connect(g);g.connect(this.gain);o.start(when);o.stop(when+d+.03)},
 kick(when){if(!this.ctx||!this.gain)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(110,when);o.frequency.exponentialRampToValueAtTime(42,when+.18);g.gain.setValueAtTime(.18,when);g.gain.exponentialRampToValueAtTime(.0001,when+.2);o.connect(g);g.connect(this.gain);o.start(when);o.stop(when+.22)},
 schedule(){if(!this.playing||!this.ctx)return;const roots=[110,87.31,130.81,98],root=roots[this.bar%roots.length],t=this.ctx.currentTime+.06,fast=game?.phase==='battle';const beat=fast?.23:.28;const arp=[1,1.1892,1.4983,2,1.4983,1.1892,1.7818,1.4983];for(let i=0;i<8;i++)this.note(root*2*arp[i],t+i*beat,beat*.78,i%2?'triangle':'sine',fast?.075:.055);this.note(root,t,beat*7.7,'sawtooth',.045);for(let i=0;i<4;i++)this.kick(t+i*beat*2);this.bar++},
 start(){this.init();if(!this.ctx||this.playing)return;this.playing=true;settings.music=true;this.schedule();this.timer=setInterval(()=>this.schedule(),game?.phase==='battle'?1950:2350);saveV2Prefs();v23UpdateMusicDock()},
 stop(){this.playing=false;settings.music=false;if(this.timer)clearInterval(this.timer);this.timer=null;saveV2Prefs();v23UpdateMusicDock()},
 toggle(){this.playing?this.stop():this.start()}
};
try{AudioFX.stopAmbience?.()}catch(e){}

const V23_SIGNATURE={

 if(v23Tag(c,'anti-magic'))return 'schneidet mit Anti-Magic durch gegnerische Effekte und zwingt den Kampf in direkte Reichweite';
 if(v23Tag(c,'space')||v23Tag(c,'dimension')||v23Tag(c,'yamato'))return 'reißt Distanz und Raum auf und greift aus einem Winkel an, den normale Defensive kaum abdeckt';
 if(v23Tag(c,'time-stop')||v23Tag(c,'time'))return 'stört den Zeitfluss und nimmt dem Gegner genau den Moment, den er zum Kontern gebraucht hätte';
 if(v23Tag(c,'absorb')||v23Tag(c,'analysis'))return 'liest das gegnerische Muster, adaptiert daran und verwandelt die gewonnene Information direkt in einen Konter';

 if(v23Tag(c,'sun')||v23Tag(c,'fire'))return 'lädt einen glühenden Burst und verwandelt die nähere Arena in eine Hitzezone';
 if(v23Tag(c,'speed')||c.speed>93)return 'verschwindet aus der Sichtlinie und setzt einen Speed-Burst genau in die offene Flanke';
 if(v23Tag(c,'sword'))return 'setzt auf einen präzisen Schwerthieb, der nicht auf Masse, sondern auf Timing und Reichweite baut';
 if(c.role==='Hax')return 'umgeht den reinen Kraftvergleich und greift direkt die Regeln des Matchups an';
 if(c.role==='Mage')return 'öffnet mit einem mehrschichtigen Fernangriff und hält die Distanz unter Kontrolle';

function v23DefenseStyle(c){if(v23Tag(c,'regen')||v23Tag(c,'souls'))return 'Die Regeneration verhindert zunächst den Finish, deshalb muss der Gegner nachsetzen und die Rückkehrmöglichkeit neutralisieren.';if(v23Tag(c,'infinity'))return 'Infinity stoppt den ersten direkten Zugriff, doch Raum-, Hax- und Teamdruck zwingen eine andere Angriffslinie.';if(v23Tag(c,'intangible'))return 'Die Intangibility lässt den ersten Treffer verpuffen, bis Timing und Mehrfachdruck das sichere Fenster schließen.';if(c.durability>94)return 'Selbst ein sauberer Treffer reicht nicht: die enorme Haltbarkeit zwingt einen zweiten, deutlich härteren Abschluss.';if(c.hax>92)return 'Der erste Schlag entscheidet nichts, weil die Hax sofort versucht, Ursache und Ergebnis des Angriffs zu verdrehen.';return 'Der Verteidiger hält den ersten Kontakt, verliert aber Schritt für Schritt Raum und Reaktionszeit.'}
function v23Effect(c){if(v23Tag(c,'sun')||v23Tag(c,'rage'))return 'fire';if(c.role==='Hax'||v23Tag(c,'space')||v23Tag(c,'dimension')||v23Tag(c,'concept'))return 'void';return 'energy'}

function v23DuelScore(a,b){return impact(a)+counterScore(a,b)*5+(a.speed-b.speed)*.12+(a.hax-b.hax)*.08}

 const st=document.querySelector('#v23NarrationState');if(st)st.textContent='TEXT AUTO';V23Battle.timer=setTimeout(onDone,Math.min(8500,4300+text.split(/\s+/).length*38));}
async function v23ShowScene(i,replay=false){v23StopNarration();const r=game?.result,s=r?.scenes?.[i];if(!s)return;V23Battle.idx=i;const final=s.kind==='reveal';const cnt=document.querySelector('#v23SceneCount'),title=document.querySelector('#v23SceneTitle'),sub=document.querySelector('#v23SceneSub'),text=document.querySelector('#v23StoryText');if(cnt)cnt.textContent=final?'FINAL REVEAL':`SCENE ${i+1} / ${r.scenes.length}`;if(title)title.textContent=s.title;if(sub)sub.textContent=s.subtitle||'';const visibleText=final?(s.preRevealText||'Der letzte Clash ist vorbei. Das Ergebnis wird gleich aufgedeckt.'):s.text;if(text)text.textContent=visibleText;document.querySelectorAll('.v23-dot').forEach((d,n)=>{d.className='v23-dot'+(n<i?' done':n===i?' on':'')});
 const [a,b]=await Promise.all([v23DuelCardHTML(s.attacker,s.attackerP,s.kind==='elimination'?'ATTACKER':s.kind==='revive'?'REVIVED':'ACTIVE'),v23DuelCardHTML(s.defender,s.defenderP,s.kind==='elimination'?'TARGET':'ACTIVE')]);const left=document.querySelector('#v23Left'),right=document.querySelector('#v23Right');if(s.attackerP===1){if(left)left.innerHTML=a;if(right)right.innerHTML=b}else{if(left)left.innerHTML=b;if(right)right.innerHTML=a}
 const cinema=document.querySelector('#v23Cinema');if(cinema){cinema.classList.remove('impact-blur');void cinema.offsetWidth;if(s.kind==='elimination')cinema.classList.add('impact-blur')}
 if(s.kind==='elimination'){setTimeout(()=>{const ac=document.querySelector(`#v23CardP${s.attackerP}`),dc=document.querySelector(`#v23CardP${s.defenderP}`);ac?.classList.add('attacker-flare','aura-'+s.effect);dc?.classList.add(s.effect==='fire'?'burn-out':s.effect==='void'?'void-out':'shatter-out');const lab=dc?.querySelector('.v23-status');if(lab)lab.textContent='ELIMINIERT';AudioFX.impact()},430)}
 if(final){const reveal=()=>v23RevealWinner();if(settings.tts)v23Narrate(visibleText,reveal);else V23Battle.timer=setTimeout(reveal,Math.min(3600,1200+visibleText.split(/\s+/).length*22));return}
 const next=()=>{if(!V23Battle.paused&&settings.battleAutoplay)v23ShowScene(i+1)};v23Narrate(s.text,next)}
function v23RevealWinner(){v23StopNarration();const r=game.result,W=r.winner,cinema=document.querySelector('#v23Cinema');if(!cinema)return;const d=document.createElement('div');d.className='v23-final-reveal';d.innerHTML=`<div><div class="kicker">FINAL RESULT</div><div class="winner-name">PLAYER ${W===1?'ONE':'TWO'}</div><h2>${r.wins1}:${r.wins2}</h2><p>MVP: <b>${escapeHtml(r.mvp.name)}</b> · Der vollständige Battle Report ist jetzt freigeschaltet.</p><div class="v23-start-actions"><button class="btn gold" onclick="v23OpenReport()">MATCH REPORT ÖFFNEN</button><button class="btn secondary" onclick="v23ReplayBattle()">↻ CINEMATIC REPLAY</button></div></div>`;cinema.appendChild(d);AudioFX.win();confetti(W);const s=r.scenes.at(-1);if(settings.tts&&s)v23Narrate(s.text,()=>{})}
function v23OpenReport(){v23StopNarration();if(online.mode==='host'){game.phase='result';sync()}else if(online.mode==='local')game.phase='result';renderResult()}
function v23ReplayBattle(){v23StopNarration();renderBattleCinematic()}
skipBattle=function(){v23StopNarration();v23OpenReport()};

/* ---------- full report + elimination ledger + robust rematch ---------- */
renderResult=async function(){v23StopNarration();closeModal();document.querySelectorAll('.pass-screen').forEach(x=>x.remove());const r=game?.result;if(!r){if(online.mode!=='guest')simulateAndRender();return}if(!r.scenes)r.scenes=v23BuildScenes(r);game.phase='result';const winPct=r.winner===1?r.p1Probability:r.p2Probability,ready=game.rematchReady||{1:false,2:false};const rematch=online.mode==='local'?`<button class="btn secondary" onclick="v22LocalRematch()">↻ REVANCHE</button>`:`<button class="btn secondary" onclick="dispatchAction('v22Rematch',{player:${online.role}})">↻ REVANCHE IM ROOM</button><button class="btn secondary" onclick="v22LeaveRoom()">ROOM VERLASSEN</button>`;const elim=r.scenes.filter(x=>x.kind==='elimination');app.innerHTML=`<section class="screen"><div class="result-hero-v2"><div class="result-kicker">OFFICIAL MATCH RESULT · V2.3</div><div class="result-score-big p${r.winner}">PLAYER ${r.winner===1?'ONE':'TWO'}</div><h2>GEWINNT ${r.wins1}:${r.wins2}</h2><p class="result-sub">MVP: <b>${escapeHtml(r.mvp.name)}</b> · ${elim.length} dokumentierte Eliminierungen</p><div class="probability-ring" style="--pct:${winPct}"><div><b>${winPct}%</b><small>WIN EDGE</small></div></div><div class="hero-actions-v2" style="justify-content:center"><button class="btn gold" onclick="openVoicePanel()">🎙️ STORY VORLESEN</button><button class="btn secondary" onclick="v23ReplayBattle()">🎬 CINEMATIC REPLAY</button><button class="btn secondary" onclick="shareResult()">🔗 ERGEBNIS TEILEN</button>${rematch}</div>${online.mode!=='local'?`<div class="rematch-box"><b>Duel Code ${online.room||''} bleibt aktiv</b><p class="small-note">Beide drücken Revanche. Erst wenn P1 und P2 READY sind, startet das nächste Match mit demselben Code und derselben Peer-Verbindung.</p><div class="ready-row"><span class="ready-pill ${ready[1]?'on':''}">P1 ${ready[1]?'READY':'WAITING'}</span><span class="ready-pill ${ready[2]?'on':''}">P2 ${ready[2]?'READY':'WAITING'}</span></div></div>`:''}</div><div class="result-grid"><div class="story"><h3>⚔️ Vollständige Kampfgeschichte</h3>${r.scenes.map((s,i)=>`<div class="v23-story-chapter"><b>${String(i+1).padStart(2,'0')} · ${escapeHtml(s.title)}</b><p>${escapeHtml(s.text)}</p></div>`).join('')}<div class="whatif"><b>🔀 Was wäre wenn?</b><p>${whatIfText()}</p></div></div><div class="analytics"><h3>☠️ Wer hat wen ausgeschaltet?</h3><div class="v23-ledger">${elim.map(x=>`<div class="v23-ledger-row"><div><b style="color:var(--p${x.attackerP})">${escapeHtml(x.attacker.name)}</b><small>Player ${x.attackerP===1?'One':'Two'}</small></div><div class="v23-arrow">→</div><div><b style="color:var(--p${x.defenderP})">${escapeHtml(x.defender.name)}</b><small>ELIMINIERT</small></div></div>`).join('')}</div><h3 style="margin-top:20px">📊 Match Analytics</h3>${metricHTML('Power',r.stats1.power,r.stats2.power)}${metricHTML('Hax',r.stats1.hax,r.stats2.hax)}${metricHTML('Speed',r.stats1.speed,r.stats2.speed)}${metricHTML('Durability',r.stats1.dur,r.stats2.dur)}${metricHTML('Synergie',r.stats1.synergy*7,r.stats2.synergy*7)}<div class="award-grid"><div class="award mvp"><small>🏆 MVP</small><b>${escapeHtml(r.mvp.name)}</b><small>Player ${r.mvp.p===1?'One':'Two'}</small></div><div class="award"><small>📉 Lowest Value</small><b>${escapeHtml(r.worst.name)}</b><small>Power Index ${Math.round(impact(r.worst))}</small></div>${r.biggestMiss?`<div class="award"><small>💀 Biggest Miss</small><b>${escapeHtml(r.biggestMiss.name)}</b><small>Player ${r.biggestMiss.p===1?'One':'Two'}</small></div>`:''}</div></div></div><div class="section-title"><div><h2>Finale Teams</h2><p>Mystery Picks sind vollständig aufgedeckt.</p></div></div><div class="final-team-grid" id="finalTeams"></div><p class="footer-note">Fan-Game-Power-Scaling: Das System benutzt Stats, Hax, Counter, Synergie, Lineup und Arena-Modifikatoren. Cross-Verse-Ergebnisse sind keine offizielle Canon-Aussage.</p></section>`;await renderFinalTeams();ensureMusicDock();v23UpdateMusicDock()};

speakFinale=function(){if(!('speechSynthesis'in window)){toast('Dein Browser unterstützt TTS nicht.');return}v23StopNarration();const r=game?.result;if(!r)return;const blocks=(r.scenes||[]).map(x=>`${x.title}. ${x.text}`),voice=availableVoices().find(v=>v.name===V2.voiceName)||availableVoices().find(v=>v.lang?.toLowerCase().startsWith('de'))||null;let i=0;function next(){if(i>=blocks.length){toast('Voice Finale beendet.');return}const u=new SpeechSynthesisUtterance(blocks[i++]);u.voice=voice;u.lang=voice?.lang||'de-DE';u.rate=V2.rate||.96;u.pitch=.98;u.onend=next;u.onerror=next;speechSynthesis.speak(u)}toast('Voice Finale läuft blockweise…');next()};

/* ---------- every optional settings/audio dialog has an X; special tokens already remain unspent until commit ---------- */
openSoundPanel=function(){v22OptionalModal(`<h2>🔊 Audio & Cinematic</h2><div class="sound-grid"><div class="sound-option"><label>Soundeffekte <input class="switch" id="sfxToggle" type="checkbox" ${settings.sfx?'checked':''}></label><div class="voice-preview">Pick-, Reveal- und Impact-SFX.</div></div><div class="sound-option"><label>Soul Battle OST <input class="switch" id="musicToggle" type="checkbox" ${settings.music?'checked':''}></label><div class="voice-preview">Originale anime-inspirierte Browser-Musik — kein urheberrechtlich geschützter Bleach-Track.</div><input id="musicVolPanel" type="range" min="0" max="100" value="${Math.round(settings.musicVolume*100)}"></div><div class="sound-option"><label>Cinematic Finale <input class="switch" id="cinToggle" type="checkbox" ${settings.cinematic?'checked':''}></label><div class="voice-preview">Story-Reveal, Duel Cards und Eliminations-Effekte.</div></div><div class="sound-option"><label>TTS <input class="switch" id="ttsToggle" type="checkbox" ${settings.tts?'checked':''}></label><div class="voice-preview">Liest jeden Battle-Block synchron zum Reveal.</div></div><div class="sound-option"><label>Auto Story <input class="switch" id="battleAutoToggle" type="checkbox" ${settings.battleAutoplay?'checked':''}></label><div class="voice-preview">Automatisch zum nächsten Block; sonst per „Weiter“.</div></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="v23SaveSoundPanel()">Speichern</button></div>`,()=>{});setTimeout(()=>{const r=document.querySelector('#musicVolPanel');if(r)r.oninput=e=>BattleOST.setVolume(Number(e.target.value)/100)},0)};
function v23SaveSoundPanel(){settings.sfx=!!document.querySelector('#sfxToggle')?.checked;settings.music=!!document.querySelector('#musicToggle')?.checked;settings.cinematic=!!document.querySelector('#cinToggle')?.checked;settings.tts=!!document.querySelector('#ttsToggle')?.checked;settings.battleAutoplay=!!document.querySelector('#battleAutoToggle')?.checked;settings.musicVolume=Number(document.querySelector('#musicVolPanel')?.value||34)/100;saveV2Prefs();settings.music?BattleOST.start():BattleOST.stop();BattleOST.setVolume(settings.musicVolume);closeModal();toast('Audio & Cinematic gespeichert.')}
openVoicePanel=function(){if(!('speechSynthesis'in window)){toast('Dieser Browser unterstützt leider kein TTS.');return}const voices=availableVoices(),de=voices.filter(v=>v.lang?.toLowerCase().startsWith('de')),list=de.length?de:voices;v22OptionalModal(`<h2>🎙️ Voice Finale</h2><p>Die Story wird <b>blockweise</b> vorgelesen, damit Lesen und TTS dieselbe Reihenfolge haben.</p><div class="sound-grid"><div class="sound-option"><label>Stimme</label><select id="voiceSelect">${list.length?list.map(v=>`<option value="${escapeHtml(v.name)}" ${v.name===V2.voiceName?'selected':''}>${escapeHtml(v.name)} · ${v.lang}</option>`).join(''):'<option value="">Systemstimme</option>'}</select></div><div class="sound-option"><label>Tempo <span id="rateValue">${V2.rate.toFixed(2)}×</span></label><input id="voiceRate" type="range" min="0.75" max="1.25" step="0.05" value="${V2.rate}"></div></div><div class="modal-actions"><button class="btn secondary" onclick="stopSpeech()">■ Stop</button><button class="btn secondary" onclick="closeModal()">Schließen</button><button class="btn gold" onclick="v23SaveVoiceAndSpeak()">▶ STORY STARTEN</button></div>`,()=>{});setTimeout(()=>{const rr=document.querySelector('#voiceRate');if(rr)rr.oninput=()=>document.querySelector('#rateValue').textContent=Number(rr.value).toFixed(2)+'×'},0)};
function v23SaveVoiceAndSpeak(){const s=document.querySelector('#voiceSelect'),r=document.querySelector('#voiceRate');V2.voiceName=s?.value||'';V2.rate=Number(r?.value||.96);localStorage.setItem('avg-voice',V2.voiceName);localStorage.setItem('avg-voice-rate',V2.rate);closeModal();speakFinale()}

/* ---------- UX/version/rules ---------- */
const V23_HOME_BASE=renderHome;renderHome=function(){v23StopNarration();V23_HOME_BASE();ensureMusicDock();const k=document.querySelector('.hero .kicker');if(k)k.innerHTML=`Draft. Risk. Counter. Dominate. <span class="version-chip-v22">V${V2.version}</span>`};
showRules=function(){v22OptionalModal(`<h2>🎮 ANIME VERSUS GAME — V2.3</h2><div class="rules-list">${[
 ['Take / Switch','Nehmen sichert den Pick und zeigt danach den verpassten Charakter. Wechseln verwirft den aktuellen Pick; der nächste ist Pflicht.'],
 ['Joker','Öffnen kostet nichts. Du kannst mit × zurück. Erst die bestätigte Wahl eines von zwei neuen Picks verbraucht den Joker.'],
 ['Double or Nothing','Öffnen kostet nichts. Wähle blind A/B: richtig = stärkerer Pick, falsch = schwächerer. × lässt den Token unangetastet.'],
 ['Mystery Box','Verwirft erst nach Bestätigung den sichtbaren Pick und zieht einen neuen Secret-Pick. Nur der Besitzer sieht ihn bis zum Finale.'],
 ['Trade','Nach Pick 4 optional. Slot-Auswahl lässt sich mit ×/Zurück abbrechen. Erst der bestätigte Slot verbraucht den Trade.'],
 ['Captain / Lineup / Counter','Captain, Reihenfolge, Rollen-Synergie und Fähigkeits-Counter fließen in die Match-Simulation ein.'],
 ['Cinematic Story','Das Ergebnis bleibt verborgen. Die Geschichte läuft blockweise; Eliminationskarten zeigen Angreifer und ausgeschalteten Charakter mit Effekt.'],
 ['TTS','Im Cinematic liest TTS genau den sichtbaren Story-Block. Im Report kann die komplette Geschichte blockweise wiedergegeben werden.'],
 ['Online / Revanche','Einladungslink und Duel Code führen in denselben Peer-Room. Bei Revanche müssen P1 und P2 READY sein; der Code bleibt bestehen.'],
 ['Bilder','Anime: strenge AniList/Jikan-Namensprüfung. Games: nur exakte Wikipedia-Zuordnung. Unsichere Treffer werden als sauberer Fallback gezeigt statt als falscher Charakter.'],
 ['Musik','Soul Battle OST ist eine originale, im Browser erzeugte Anime-Battle-Musik. Play/Pause und Lautstärke bleiben unten links erreichbar.']
 ].map(([a,b])=>`<div class="rule"><b>${a}</b><p>${b}</p></div>`).join('')}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">LET'S GO</button></div>`,()=>{})};

/* rematch preserves room + settings and clears all previous modal/battle state */
const V23_REMATCH_BASE=v22RematchReady;v22RematchReady=function(p){v23StopNarration();const room=online.room,mode=online.mode,role=online.role;V23_REMATCH_BASE(p);online.room=room;online.mode=mode;online.role=role;ensureMusicDock()};
const V23_LOCAL_REMATCH_BASE=v22LocalRematch;v22LocalRematch=function(){v23StopNarration();V23_LOCAL_REMATCH_BASE();ensureMusicDock()};

/* image/style hydration after every main route */
const V23_ROUTE_BASE=routeRender;routeRender=function(){V23_ROUTE_BASE();ensureMusicDock();setTimeout(()=>hydrateTeamImages(),20)};

saveV2Prefs();ensureMusicDock();if(!game)renderHome();if(settings.music){/* browser requires a click; dock shows state, first pointerdown starts it */}
</script>
