 .replace(/\*\*/g,'').replace(/__/g,'').replace(/`+/g,'')
 .replace(/^\s*[-*•]+\s+/gm,'').replace(/#+\s*/g,'')
 .replace(/[\u200B-\u200D\uFEFF]/g,'')

 .replace(/\n{3,}/g,'\n\n').trim()}

function fallbackTechniqueName(c,trait,slot){const pool=PERSONAL_TECHNIQUE_BANK[trait]||PERSONAL_TECHNIQUE_BANK.technique;const base=pool[hash(c.id+'|'+trait+'|'+slot)%pool.length];const pref=PERSONAL_STYLE_PREFIX[hash(c.name+'|'+slot)%PERSONAL_STYLE_PREFIX.length];return slot<2?`${c.name} · ${base}`:`${pref} ${base}`}
function skillObj(c,name,trait,bias=9,idx=0){return {id:`${c.id}::${idx}::${slug(name)}`,name,trait,bias,owner:c.id}}
function buildSkillKit(c){
 const canon=CANON_SKILLS_BY_KEY[c.franchise+'|'+c.name]||CANON_SKILLS[c.name];
 if(canon)return canon.map((x,i)=>({...skillObj(c,x[0],x[1],x[2],i),origin:'canon'}));
 const tags=[...(c.tags?.length?c.tags:['technique'])];
 if(!tags.includes((VERSE_TAGS[c.franchise]||[])[0])&&(VERSE_TAGS[c.franchise]||[])[0])tags.push(VERSE_TAGS[c.franchise][0]);
 const out=[],seen=new Set();
 const add=(name,trait,bias=9,origin='profile')=>{name=String(name||'').trim();if(!name||seen.has(name))return;seen.add(name);out.push({...skillObj(c,name,trait,bias,out.length),origin})};
 // Unknown/less documented roster entries still get a character-specific fan profile instead of sharing
 // the exact same "Spell Layer / Flow Counter" kit with dozens of unrelated fighters.
 let slot=0;for(let pass=0;pass<4&&out.length<10;pass++)for(const trait of tags){
   if(out.length>=10)break;
   const n=fallbackTechniqueName(c,trait,slot++);
   add(n,trait,8+hash(c.id+'|'+trait+'|'+slot)%5,'profile');
 }
 // Keep one visible cue from the franchise power system, but make it explicitly character-bound.
 for(const n of (VERSE_SKILL_SYSTEM[c.franchise]||[])){if(out.length>=10)break;const trait=tags[hash(c.id+n)%tags.length]||'technique';add(`${c.name} · ${n}`,trait,8+hash(n+c.id)%4,'verse-profile')}
 while(out.length<10){const trait=tags[out.length%tags.length]||'technique';add(fallbackTechniqueName(c,trait,slot++),trait,8+hash(c.id+slot)%4,'profile')}
 return out.slice(0,10)
}

const NONCOMBATANTS=new Set(['mob-psycho-100--tsubomi-takane','mob-psycho-100--tome-kurata','one-punch-man--king']);
function applyProfileCorrection(c){const f=PROFILE_CORRECTIONS[c.franchise+'|'+c.name];return f?{...c,...f}:c}
function combatChanceClamp(a,b,p,edgeA=0,edgeB=0){
 const gap=tierRank(a.tier)-tierRank(b.tier),edge=edgeA+edgeB,hardCounter=edge>18,hardCountered=edge<-12;
 let lo=.06,hi=.94;
 if(gap<=-2){hi=hardCounter?.10:.03;lo=.003;if(hardCountered)hi=.006}
 else if(gap===-1){hi=hardCounter?.34:.20;lo=.02;if(hardCountered)hi=.08}
 else if(gap>=2){lo=hardCountered?.90:.97;hi=.997}
 else if(gap===1){lo=hardCountered?.66:.80;hi=.98}
 if(NONCOMBATANTS.has(a.id)&&!NONCOMBATANTS.has(b.id)){hi=b.tier==='God'?.0015:b.tier==='High'?.01:.06;lo=.0005}
 if(NONCOMBATANTS.has(b.id)&&!NONCOMBATANTS.has(a.id)){lo=a.tier==='God'?.9985:a.tier==='High'?.99:.94;hi=.9995}

function commitTake(p,remote=false){

function traitCounter(a,b){if(!settings.counters)return {score:0,reasons:[]};let s=0,reasons=[];const A=new Set(a.tags),B=new Set(b.tags);for(const [atk,defs,val,why] of counterRules){if(A.has(atk)&&(!defs.length||defs.some(x=>B.has(x)))){s+=val;if(val>=7)reasons.push(why)}}if(B.has('infinity')&&!A.has('space')&&!A.has('concept')&&!A.has('reality')){s-=13;reasons.push('Infinity blockiert normalen direkten Kontakt')}if(B.has('intangible')&&!A.has('space')&&!A.has('sense')&&!A.has('reality')){s-=10;reasons.push('Intangibility lässt einen direkten Commit ins Leere laufen')}if(B.has('barrier')&&!A.has('anti-magic')&&!A.has('concept')&&a.power<88){s-=5;reasons.push('eine Barriereschicht schluckt einen Teil des ersten Bursts')}if(B.has('regen')&&!A.has('concept')&&!A.has('absorb')&&!A.has('reality'))s-=4;if(a.speed>b.speed+14){s+=5;reasons.push('der Speed-Vorteil öffnet zuerst ein Fenster')}if(a.hax>b.hax+18){s+=5;reasons.push('die Hax-Differenz erzwingt eine Spezialantwort')}s+=ROLE_EDGE[a.role]?.[b.role]||0;return {score:s,reasons:[...new Set(reasons)].slice(0,4)}}

function teamSynergy(p){if(!settings.synergy)return 0;const t=game.teams[p],roles=new Set(t.map(x=>x.role)).size;let s=roles*1.2;if(t.some(x=>x.role==='Support'))s+=3;if(t.some(x=>x.role==='Hax')&&t.some(x=>x.role==='Bruiser'))s+=2.5;if(t.some(x=>x.role==='Summoner')&&t.some(x=>x.role==='Assassin'))s+=2;return Math.min(14,s)}
function moveMatchScore(move,a,b){let s=move.bias||9;const B=new Set(b.tags||[]),t=move.trait;if(t==='space'&&(B.has('infinity')||B.has('intangible')||B.has('barrier')))s+=10;if(t==='concept'&&(B.has('regen')||B.has('barrier')||b.durability>90))s+=9;if(t==='anti-magic'&&(B.has('magic')||B.has('mana')||B.has('domain')))s+=11;if(t==='sense'&&(B.has('illusion')||B.has('assassin')))s+=7;if(t==='analysis')s+=Math.max(0,(b.hax-65)/8);if(t==='speed')s+=(a.speed-b.speed)/12;if(['physical','sword','martial'].includes(t))s+=(a.power-b.durability)/18;if(['energy','ki','magic','chakra'].includes(t))s+=(a.hax+b.power/5-b.durability/2)/18;if(t==='return-zero'||t==='reality')s+=8;if(t==='full-counter'&&['Mage','Hax'].includes(b.role))s+=7;return s}
function pickCombatMove(a,b,ctx,avoid=[]){const used=ctx.moveUsage[a.id]||{};const kit=(a.skillKit?.length?a.skillKit:buildSkillKit(a));let scored=kit.map(m=>({m,s:moveMatchScore(m,a,b)-((used[m.id]||0)*5)-(avoid.includes(m.id)?28:0)+rng()*2.4})).sort((x,y)=>y.s-x.s);const top=scored.slice(0,Math.min(4,scored.length));let total=top.reduce((s,x)=>s+Math.max(.2,x.s-top[top.length-1].s+1),0),r=rng()*total,choice=top[0].m;for(const x of top){r-=Math.max(.2,x.s-top[top.length-1].s+1);if(r<=0){choice=x.m;break}}used[choice.id]=(used[choice.id]||0)+1;ctx.moveUsage[a.id]=used;return choice}
function phrase(pool,key,ctx){
 if(!pool?.length)return '';
 if(!ctx)return pool[hash(String(key))%pool.length];
 ctx.phraseUsage=ctx.phraseUsage||{};
 const group=String(hash(pool.join('¦'))),used=ctx.phraseUsage[group]||(ctx.phraseUsage[group]=[]);
 let start=hash(key+'|'+ctx.variant+'|'+ctx.beat)%pool.length,idx=start;
 for(let i=0;i<pool.length;i++){idx=(start+i)%pool.length;if(!used.includes(idx))break}
 if(used.length>=pool.length){used.length=0;idx=start}
 used.push(idx);return pool[idx]
}

'anti-magic|magic':['{A} lässt **{AM}** direkt auf die Energie von **{BM}** treffen. Statt mehr Output zu fordern, versucht der Angriff die gegnerische Technik an ihrer Quelle zu löschen.','**{BM}** will das Feld kontrollieren, doch **{AM}** zwingt die Magie in einen direkten Nullifikations-Check.'],
'anti-magic|domain':['{A} setzt **{AM}** gegen die Regelstruktur von **{BM}**. Der Kampf entscheidet sich daran, ob die Nullifikation schnell genug die Domain-Wirkung erreicht.'],
'sense|illusion':['{B} versucht mit **{BM}** Zielinformation und echten Standort zu trennen. {A} stützt sich mit **{AM}** auf zusätzliche Sensorik und weigert sich, nur dem sichtbaren Bild zu folgen.'],
'time|speed':['{B} will über **{BM}** das Reaktionsfenster schließen. {A} beantwortet das nicht mit noch mehr Speed, sondern verschiebt über **{AM}** die verfügbare Zeit selbst.'],
'concept|regen':['{B} kann gewöhnlichen Schaden über **{BM}** zurückholen. {A} benutzt **{AM}** deshalb als Angriff auf die Grundlage der Regeneration statt nur auf den Körper.'],
'absorb|energy':['{B} schickt **{BM}** als großen Energie-Commit. {A} macht mit **{AM}** genau diesen Output zur Ressource und zwingt den Gegner, den nächsten Angriff anders aufzubauen.'],
'full-counter|energy':['{B} muss **{BM}** dosieren, weil {A} mit **{AM}** auf einen großen Fernangriff wartet. Jeder zusätzliche Output erhöht zugleich das Risiko des Rückschlags.'],
'vector|physical':['{B} bringt mit **{BM}** rohe Bewegung in den Kontakt. {A} setzt **{AM}** nicht als Block, sondern verändert Richtung und Impuls des Angriffs.'],
'return-zero|hax':['{B} versucht über **{BM}** einen fertigen Zustand zu erzwingen. {A} hält **{AM}** dagegen und greift nicht den Angriff, sondern dessen erfolgreiches Ergebnis an.'],
'analysis|technique':['{B} zeigt mit **{BM}** ein wiederholbares Muster. {A} nutzt **{AM}**, um Timing, Reichweite und Trigger zu zerlegen, bevor der zweite Versuch kommt.'],
'adaptation|physical':['{B} setzt mit **{BM}** auf direkte Dominanz. {A} lässt **{AM}** aus dem ersten Kontakt lernen; derselbe Rhythmus wäre beim nächsten Mal weniger wert.'],
'summon|speed':['{B} will über **{BM}** einen einzelnen Winkel blitzartig öffnen. {A} nutzt **{AM}**, um mehrere Kontaktpunkte gleichzeitig zu besetzen und die Fluchtlinie zu verkleinern.'],
'illusion|sense':['{A} versucht mit **{AM}** den Read von {B} zu vergiften. {B} antwortet über **{BM}** und vergleicht mehrere Wahrnehmungskanäle statt nur das sichtbare Ziel.'],
'space|intangible':['{B} will mit **{BM}** aus der Treffer-Ebene verschwinden. {A} koppelt **{AM}** an den Raum selbst und versucht den sicheren Phase-Punkt zu treffen statt dem Körper hinterherzulaufen.'],
'concept|barrier':['{B} baut **{BM}** als Schutzschicht. {A} lässt **{AM}** nicht gegen die Härte der Barriere arbeiten, sondern gegen die Regel, die sie überhaupt schützt.']};
function pairInteractionText(a,b,mA,mB,ctx){const keys=[`${mA.trait}|${mB.trait}`,`${mA.trait}|${(b.tags||[])[0]}`,`${(a.tags||[])[0]}|${mB.trait}`];let pool=null;for(const k of keys)if(PAIR_INTERACTIONS[k]){pool=PAIR_INTERACTIONS[k];break}if(!pool)pool=[`{A} bringt **{AM}** in den Austausch. {B} beantwortet das mit **{BM}**; beide Techniken verlangen deshalb gleichzeitig nach Position und Timing.`,`**{AM}** von {A} trifft nicht auf einen passiven Guard: {B} setzt **{BM}** genau in denselben Entscheidungsraum.`,`{A} zwingt mit **{AM}** eine Reaktion, während {B} über **{BM}** versucht, aus Verteidigung sofort eigenen Druck zu machen.`,`Statt eines freien Treffers entsteht ein technischer Clash: **{AM}** von {A} gegen **{BM}** von {B}.`,`{A} verändert mit **{AM}** den ersten Rhythmus. {B} akzeptiert den Tausch nicht und legt **{BM}** als aktive Antwort dazwischen.`];return phrase(pool,a.id+b.id+mA.id+mB.id+'pair',ctx).replaceAll('{A}',a.name).replaceAll('{B}',b.name).replaceAll('{AM}',mA.name).replaceAll('{BM}',mB.name)}
function mindset(c,ctx,key='mind'){if(c.signature)return phrase([c.signature,`verbindet ${c.skillKit[0]?.name||'seine Haupttechnik'} mit ${c.skillKit[1]?.name||'einem zweiten Layer'}, statt nur Output zu stapeln`,`hält ${c.skillKit.at(-1)?.name||'seinen Finisher'} zurück, bis eine konkrete Reaktion darauf vorbereitet wurde`],c.id+key,ctx);const byRole={Bruiser:`macht aus jedem gewonnenen Kontakt Raum für den nächsten direkten Druck`,Hax:`sucht zuerst die Bedingung, unter der der Gegner seine beste Antwort verliert`,Assassin:`bleibt außerhalb der sauberen Sichtlinie und jagt das kürzeste offene Fenster`,Mage:`baut Reichweite und mehrere Effekte übereinander, statt einen einzelnen Cast zu überladen`,Support:`verändert das Feld, bis der eigene nächste Zug sicherer als der gegnerische wird`,Counter:`gibt bewusst Initiative ab und wartet auf einen Commit, der bestraft werden kann`,Summoner:`verteilt Präsenz über mehrere Winkel und reduziert sichere Fluchtwege`};return `${byRole[c.role]||byRole.Bruiser}; ${(c.tags||[])[0]||'Technik'} bleibt dabei der zentrale Hebel`}
function sceneTextOpen(a,b,mA,mB,arena,ev,ctx){const o=phrase(OPENERS,a.id+b.id+'open',ctx),tr=phrase(TRANSITIONS,mA.id+mB.id+'trans',ctx),def=moveCounterText(mA,b,ctx),pair=pairInteractionText(a,b,mA,mB,ctx),mechanics=moveDuelExplanation(a,b,mA,mB,ctx),seen=(ctx.pairHistory?.[a.id+'|'+b.id]||0);const rematch=seen?` Sie standen sich in diesem Match bereits gegenüber; ${b.name} kennt deshalb mindestens einen Teil von ${a.name}s altem Rhythmus und dieselbe Eröffnung würde weniger Wert haben.`:'';return `${a.name} ${o} und startet mit **${mA.name}**. ${mechanics}\n\n${pair} ${def}${rematch} ${tr} ${a.name} ${mindset(a,ctx,'openmind')}. In ${arena} unter ${ev} zählen damit nicht bloß Werte, sondern ${interactionEdge(a,b,mA,mB).ctr.reasons.join('; ')||'welche konkrete Technik die nächste Reaktion tatsächlich erzwingt'}.`}

function sceneTextAdapt(a,b,mA,mB,mA2,mB2,ctx){let A=phrase(ADAPT_A,a.id+b.id+'adaptA',ctx).replaceAll('{A1}',`**${mA.name}**`).replaceAll('{A2}',`**${mA2.name}**`),B=phrase(ADAPT_B,b.id+a.id+'adaptB',ctx).replaceAll('{B2}',`**${mB2.name}**`);const sp=a.speed>b.speed+12?`${a.name} besitzt das höhere Grundtempo, doch ${b.name} hat jetzt einen Read auf die erste Beschleunigung.`:b.speed>a.speed+12?`${b.name} ist nominell schneller; ${a.name} muss deshalb Winkel und Zwangsreaktionen statt eines Wettrennens gewinnen.`:phrase(['Beim Tempo liegen beide nah genug, dass Reads und Ressourcen dominieren.','Keiner kann den anderen allein über Speed aus dem Kampf schreiben.','Die Reaktionsfenster sind eng genug, dass die gewählte Technik wichtiger als der nackte Speed-Wert wird.','Das Tempo trennt beide nicht klar genug; der bessere zweite Plan ist wichtiger als der erste Schritt.','Beide erreichen relevante Fenster, deshalb entscheidet die Reihenfolge der Antworten.','Beide können relevante Frames erreichen; die Frage ist, wessen zweiter Plan den ersten Read bestraft.','Tempo allein löst das Matchup nicht, weil beide bereits auf den ersten Burst vorbereitet sind.'],a.id+b.id+'speed',ctx);const pair=pairInteractionText(a,b,mA2,mB2,ctx),mechanics=moveDuelExplanation(a,b,mA2,mB2,ctx);return `${a.name} ${A}. ${b.name} ${B}. ${sp}\n\n${mechanics} ${pair} ${phrase(TRANSITIONS,a.id+b.id+'mid',ctx)} Die zweite Technik ist damit eine echte Reaktion auf den ersten Austausch; bloß dieselbe Attacke mit mehr Output zu wiederholen wäre taktisch schlechter.`}

function sceneTextFinish(w,l,m1,m2,m3,defMove,ctr,arena,ctx){let chain=phrase(FINISH_A,w.id+l.id+'finish',ctx).replaceAll('{M1}',`**${m1.name}**`).replaceAll('{M2}',`**${m2.name}**`).replaceAll('{M3}',`**${m3.name}**`);const reason=ctr.reasons.length?phrase(ctr.reasons,w.id+l.id+'reason',ctx):`${w.name} gewinnt das bessere Timing zwischen Angriff und Reset`;const close=phrase([`${l.name} versucht **${defMove.name}** als letzte Gegenaktion, aber nicht mehr gleichzeitig gegen alle drei Ebenen.`,`${l.name} setzt **${defMove.name}** gegen den Abschluss; dadurch wird ein Layer gestoppt, aber genau der Raum für den nächsten geöffnet.`,`Mit **${defMove.name}** liest ${l.name} den Finish grundsätzlich richtig, doch die vorherige Sequenz hat die Position bereits festgelegt.`,`${l.name} wirft **${defMove.name}** in den dritten Layer. Der Guard beantwortet einen Teil des Plans, nicht aber dessen komplette Reihenfolge.`,`**${defMove.name}** verhindert den geraden Abschluss, zwingt ${w.name} aber genau in den Winkel, den **${m3.name}** abdeckt.`,`Noch einmal versucht ${l.name} über **${defMove.name}** einen Reset zu erzwingen; ${w.name} hat diese Antwort nach den ersten Exchanges bereits einkalkuliert.`,`Der letzte defensive Commit ist **${defMove.name}**. Er löst das unmittelbare Problem, nicht aber den Positionsnachteil, den die zwei vorherigen Moves erzeugt haben.`,`Mit **${defMove.name}** kauft ${l.name} einen Frame, doch ${w.name} hat den Finisher bewusst erst hinter zwei anderen Drohungen versteckt.`],w.id+l.id+defMove.id+'close',ctx);const mech1=traitMechanic(m1,w,l,ctx,'f1'),mech2=traitMechanic(m2,w,l,ctx,'f2'),mech3=traitMechanic(m3,w,l,ctx,'f3');return `${w.name} ${chain}. Dabei ${m1.name} ${mech1}; **${m2.name}** ${mech2}; und **${m3.name}** ${mech3}. ${close}\n\n${reason}. ${w.name} ${mindset(w,ctx,'finishmind')}. Der KO entsteht damit aus einer konkreten Kette von Entscheidungen: Reaktion erzwingen, die Gegenreaktion lesen, den sicheren Reset schließen und erst dann finishen. ${l.name} fällt aus ${arena}.`}

function duelScore(a,b,arena,ev,p=1,ctx=null){const ctr=traitCounter(a,b),captain=game.captains[p]===a.id?7:0;const best=(a.skillKit||[]).map(m=>moveMatchScore(m,a,b)).sort((x,y)=>y-x).slice(0,3).reduce((s,x)=>s+x,0)/3||8;const base=impact(a)+arenaMod(a,arena)+ev.fn(a)+ctr.score*2.6+teamSynergy(p)+captain+best*1.7;return {score:Math.max(35,base),ctr,best}}
function orderedTeam(p){const ids=game.order[p]?.length?game.order[p]:game.teams[p].map(x=>x.id);return ids.map(id=>BY_ID.get(id)||game.teams[p].find(c=>c.id===id)).filter(Boolean)}
function effectFor(c,m){const t=new Set([...(c.tags||[]),m?.trait]);if(t.has('fire')||t.has('sun')||t.has('rage'))return 'burn';if(t.has('electric')||t.has('ki')||t.has('energy'))return 'lightning';if(t.has('psychic')||t.has('esper'))return 'psychicfx';if(t.has('space')||t.has('concept')||t.has('reality')||t.has('time')||t.has('return-zero'))return 'voidfx';return 'shatter'}

const R9_MOVE_SCENES={
 'The One':(a,b)=>`${a.name}s Körper wird mit jedem Atemzug heißer, bis selbst die Luft um Rhitta flimmert. Sunshine erreicht seinen Mittagspunkt: Haltung, Kraft und Hitze springen gleichzeitig auf ein anderes Niveau. ${b.name} bekommt nicht einfach "mehr Stärke" entgegen — der komplette Nahkampf-Rhythmus kippt, weil jeder geblockte Kontakt nun Boden und Deckung mit zerstört.`,
 'The One Ultimate':(a,b)=>`${a.name} verbrennt die eigene Lebenskraft, um The One über den normalen Mittagspunkt hinaus festzuhalten. Die Aura wird weißglühend; jeder Schritt kostet Substanz, aber ${b.name} muss jetzt gegen einen Gegner kämpfen, der bewusst alles auf diesen einen Abschluss setzt.`,
 'Cruel Sun':(a,b)=>`${a.name} formt eine Miniatursonne über der Hand. Cruel Sun steigt statt geradlinig anzugreifen, zwingt ${b.name} aus der sicheren Linie und lässt Hitze von oben auf das Feld drücken.`,
 'Divine Sword Escanor':(a,b)=>`${a.name} zieht die Handkante wie eine Klinge durch die aufgeheizte Luft. Divine Sword Escanor zielt nicht auf einen langen Schlagabtausch, sondern auf den Moment, in dem ${b.name} nach der vorherigen Hitzeattacke seine Deckung neu setzt.`,
 'Divine Spear Escanor':(a,b)=>`${a.name} komprimiert den Vorwärtsdruck in einen geraden Durchbruch. Divine Spear Escanor jagt auf die Mitte der Verteidigung und soll ${b.name} keine seitliche Ausweichroute lassen.`,
 'Hollow Purple':(a,b)=>`${a.name} führt Blue und Red zusammen. Zwischen beiden Kräften entsteht Hollow Purple — kein normaler Projektilabtausch, sondern eine zerstörerische Bahn, die alles auf ihrer Linie aus dem Raum reißt. ${b.name} muss die Flugbahn vermeiden oder die Technik selbst beantworten; einfach blocken ist keine sichere Lösung.`,
 'Unlimited Void':(a,b)=>`${a.name} schließt die Domain. Unlimited Void überflutet Wahrnehmung und Verarbeitung mit endloser Information. Für ${b.name} wird jede Millisekunde, in der die Barriere hält, gefährlicher als ein direkter Treffer.`,
 'Infinity':(a,b)=>`${a.name} lässt Infinity zwischen sich und den Angriff fallen. Der Abstand wird nicht bloß "größer" — die Annäherung verliert immer mehr Geschwindigkeit, bis der Kontakt vor ${a.name} praktisch stehen bleibt.`,
 'Kamui':(a,b)=>`${a.name} verschiebt den eigenen Körper mit Kamui aus der normalen Treffer-Ebene. Der Angriff von ${b.name} geht durch die scheinbar offene Silhouette; erst im Moment des eigenen Gegenangriffs muss ${a.name} wieder vollständig greifbar werden.`,
 'Susanoo':(a,b)=>`${a.name} lässt Chakra zu einer gewaltigen Schutz- und Angriffsform anwachsen. Susanoo verändert Reichweite und Verteidigung gleichzeitig und zwingt ${b.name}, nicht mehr nur gegen einen Körper, sondern gegen eine komplette Chakra-Konstruktion zu kämpfen.`,
 'Limbo':(a,b)=>`${a.name} schickt Limbo-Schatten in eine benachbarte Ebene. Für ${b.name} kommen Treffer aus Winkeln, in denen im sichtbaren Raum niemand steht; ohne passende Wahrnehmung wirkt jeder Konter eine halbe Sekunde zu spät.`,
 'Ultra Instinct':(a,b)=>`${a.name} lässt den Körper reagieren, bevor der bewusste Gedanke fertig ist. Ultra Instinct macht aus kleinen Lücken sofortige Ausweich- und Konterbewegungen; ${b.name} muss deshalb Muster erzwingen statt auf normale Reaktionszeit zu hoffen.`,
 'Instant Transmission':(a,b)=>`${a.name} verschwindet an der eigenen Position und erscheint an einer neuen Ki-Signatur. Der Winkelwechsel ist augenblicklich; ${b.name} muss die Zielwahl lesen, nicht den Weg dazwischen.`,
 'Kamehameha':(a,b)=>`${a.name} sammelt Ki zwischen den Händen und entlädt es als Kamehameha. Der Strahl ist nicht nur rohe Energie: ${a.name} kann ihn im letzten Moment nachführen und den Druck über mehrere Sekunden halten.`,
 'Hakai':(a,b)=>`${a.name} setzt Zerstörungsenergie frei. Hakai versucht nicht einfach, ${b.name} zu verletzen, sondern die getroffene Existenz vollständig auszulöschen — Regeneration allein ist deshalb keine automatische Antwort.`,
 'Return to Zero':(a,b)=>`${a.name}s Gold Experience Requiem greift nicht den Körper an, sondern den erreichten Ausgang einer Handlung. Der Versuch von ${b.name}, ein Ergebnis gegen ${a.name} zu vollenden, wird auf einen Zustand zurückgesetzt, in dem dieses Ergebnis nie erreicht wurde.`,
 'The Almighty':(a,b)=>`${a.name} öffnet The Almighty und betrachtet mögliche Zukunftsverläufe gleichzeitig. Statt auf den sichtbaren Angriff zu reagieren, sucht ${a.name} die Zukunft, in der die Antwort bereits vorbereitet ist — ${b.name} muss etwas erzeugen, das sich nicht einfach durch Auswahl eines günstigeren Verlaufs neutralisieren lässt.`,
 'Soul Chain Deathmatch':(a,b)=>`${a.name} setzt Soul Chain Deathmatch. Die Kette verbindet beide Kämpfer und verteilt die Magiereserven gleichmäßig. Plötzlich zählt nicht mehr, wer mit dem größeren Vorrat gekommen ist; ${b.name} wird in einen engen, ressourcengeteilten Schlagabtausch gezwungen, den ${a.name} bewusst vorbereitet hat.`,
 'Great Gospel':(a,b)=>`${a.name} ruft Great Gospel. Heilung und Schutz breiten sich wie ein heller Puls aus; Verletzungen schließen sich und der nächste gegnerische Burst verliert den sicheren Abschluss, auf den er eben noch gebaut war.`,
 'Ray of Judgment':(a,b)=>`${a.name} bündelt Magie zu einem fokussierten Ray of Judgment. Der Strahl bleibt lange genug bestehen, um eine Ausweichlinie nachzuverfolgen und zwingt ${b.name}, Deckung oder Unterbrechung zu suchen.`,
 'Temptation World':(a,b)=>`${a.name} öffnet Temptation World und zieht den Kampf in eine kontrollierte mentale Domäne. Wahrnehmung, Wille und Entscheidungsfreiheit von ${b.name} werden selbst zum Schlachtfeld; rohe Kraft hilft nur, wenn sie überhaupt noch sauber eingesetzt werden kann.`,
 'Logic Plague':(a,b)=>`${a.name} greift nicht zuerst physisch an. Logic Plague zielt auf Überzeugung, Entscheidungslogik und Informationsfluss; ${b.name} muss verhindern, dass der eigene Plan noch vor dem ersten Schuss manipuliert wird.`,
 'Dragon Breath':(a,b)=>`${a.name} zieht über das Feld und legt Dragon Breath als anhaltende Schadenszone ab. ${b.name} kann dem ersten Kontakt ausweichen, verliert dabei aber sicheren Boden und muss gleichzeitig den nächsten Flugwinkel im Auge behalten.`,

function r91KeywordBeat(actor,target,move,ctx,key){const n=String(move?.name||''),low=n.toLowerCase();const choose=(arr,suf)=>phrase(arr,actor.id+'|'+target.id+'|'+n+'|'+key+'|'+suf,ctx);

 };if(named[k])return named[k];const edge=moveVsMoveEdge(mA,mB,a,b);if(edge>5)return `${mA.name} passt mechanisch ungewöhnlich gut gegen ${mB.name}; ${a.name} kann dadurch eine Stärke von ${b.name}s Antwort direkt in einen Nachteil verwandeln.`;if(edge<-5)return `${mB.name} beantwortet ${mA.name} genau auf der Ebene, auf der die Technik normalerweise Raum gewinnt. ${a.name} muss den nächsten Angriff deshalb anders aufbauen.`;return phrase([`${mA.name} und ${mB.name} treffen nicht einfach frontal aufeinander. ${a.name} versucht, die Stärke der eigenen Technik zur Bedingung des nächsten Zuges zu machen, während ${b.name} genau diese Bedingung verweigert.`,`${a.name}s ${mA.name} zwingt ${b.name} zu ${mB.name}. Dadurch entsteht kein sauberer Sieger im ersten Kontakt, sondern eine neue Ausgangslage für den nächsten Angriff.`,`${mA.name} verändert zuerst den Raum für ${a.name}; ${mB.name} verhindert, dass ${b.name} sofort die Kontrolle verliert. Der zweite Austausch muss deshalb anders aussehen als der erste.`],a.id+b.id+mA.id+mB.id+key,ctx)}

function hostGuestJokerChoose(id){const q=game.pendingRemote;if(q?.type!=='joker')return;const c=q.options.find(x=>x.id===id),m=q.options.find(x=>x.id!==id);if(!c)return;game.tokens[2].joker=0;game.teams[2].push(c);game.missed[2].push(m);game.history.push({type:'joker',p:2,id:c.id,missed:m.id});game.candidate=null;game.pendingRemote={type:'takeAck',player:2,taken:c,missed:m};sync()}
function hostGuestDoubleChoose(idx){const q=game.pendingRemote;if(q?.type!=='double')return;const o=q.options,strong=impact(o[0])>=impact(o[1])?o[0]:o[1],weak=strong===o[0]?o[1]:o[0],correct=o[idx]===strong,c=correct?strong:weak,m=correct?weak:strong;game.tokens[2].double=0;game.teams[2].push(c);game.missed[2].push(m);game.history.push({type:'double',p:2,id:c.id,correct});game.candidate=null;game.pendingRemote={type:'takeAck',player:2,taken:c,missed:m,doubleResult:correct};sync()}

function route(){if(!game)return home();if(game.phase==='setup')return game.mode==='showfight'?showFightSetup(online.mode==='host'?'host':'local'):beginConfiguredGame();if(game.phase==='lobby')return renderLobby();if(game.phase==='ban')return renderBan();if(game.phase==='draft')return renderDraft();if(game.phase==='captain')return renderCaptain();if(game.phase==='order')return renderOrder();if(game.phase==='battle')return startBattle();if(game.phase==='result')return renderResult()}

function handleAction(a,p){if(a==='ban')doBan(p.id,p.player);else if(a==='take')take();else if(a==='swap')swap();else if(a==='autoRoll')autoRollTurn(game.active);else if(a==='jokerChoose')jokerChoose(p.id);else if(a==='mysteryCommit')mysteryCommit();else if(a==='doubleChoose')doubleChoose(p.idx);else if(a==='tradeCommit')tradeCommit(p.index);else if(a==='captain')selectCaptain(p.index,p.player);else if(a==='order')setOrder(p.order,p.player);else if(a==='rematch')doRematch(p.player)}

function modal(h){modalRoot.innerHTML=`<div class="modalbg"><div class="modal">${h}</div></div>`}function closeModal(){modalRoot.innerHTML=''}function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),2800)}
function avatar(name,franchise=''){const initials=String(name).split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(),sub=String(franchise||'').slice(0,34);return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17243f"/><stop offset="1" stop-color="#080d18"/></linearGradient></defs><rect width="600" height="800" fill="url(#g)"/><circle cx="300" cy="310" r="155" fill="#263654"/><text x="300" y="340" text-anchor="middle" fill="#f4f7ff" font-size="110" font-family="Arial" font-weight="900">${initials}</text><text x="300" y="600" text-anchor="middle" fill="#f4f7ff" font-size="30" font-family="Arial">${esc(name).slice(0,28)}</text>${sub?`<text x="300" y="646" text-anchor="middle" fill="#7f91b1" font-size="22" font-family="Arial">${esc(sub)}</text>`:''}</svg>`)}`}
const imageCache=JSON.parse(localStorage.getItem('avg25-images-r4')||'{}');
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ')}
function nameScore(query,cand){const a=norm(query).split(' ').filter(Boolean),b=norm(cand).split(' ').filter(Boolean);return a.reduce((s,x)=>s+(b.includes(x)?2:b.some(y=>y.startsWith(x)||x.startsWith(y))?1:0),0)}
function imageQuery(c){return IMAGE_QUERY_FRANCHISE_ALIASES[c.franchise+'|'+c.name]||IMAGE_QUERY_ALIASES[c.name]||c.name.replace(/ \(GER\)$/,'')}
function imageNameScore(c,cand){return Math.max(nameScore(c.name,cand),nameScore(imageQuery(c),cand))}
async function fetchTimeout(url,options={},ms=4200){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);try{return await fetch(url,{...options,signal:ac.signal})}finally{clearTimeout(t)}}
async function aniImage(c){const q=`query($s:String){Page(perPage:10){characters(search:$s){name{full native alternative} image{large} media(perPage:30){nodes{title{romaji english native}}}}}}`;const r=await fetchTimeout('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query:q,variables:{s:imageQuery(c)}})},3600);if(!r.ok)throw 0;const arr=(await r.json()).data?.Page?.characters||[];const aliases=(FRANCHISE_ALIASES[c.franchise]||[c.franchise]).map(norm);const valid=arr.map(x=>{const ns=[x.name?.full,...(x.name?.alternative||[])].filter(Boolean),score=Math.max(...ns.map(n=>imageNameScore(c,n)),0);const media=(x.media?.nodes||[]).flatMap(m=>[m.title?.english,m.title?.romaji,m.title?.native]).filter(Boolean).map(norm);const verse=media.some(t=>aliases.some(a=>a&&(t.includes(a)||a.includes(t))));return {x,score,verse}}).filter(z=>z.score>=2&&z.verse).sort((a,b)=>b.score-a.score);return valid[0]?.x?.image?.large||null}
async function wikiImage(c){const s=encodeURIComponent(`${imageQuery(c)} ${c.franchise}`);const u=`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${s}&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=700&format=json&origin=*`;const r=await fetchTimeout(u,{},3200);if(!r.ok)throw 0;const pages=Object.values((await r.json()).query?.pages||{}).filter(x=>x.thumbnail?.source).map(x=>({x,score:imageNameScore(c,x.title)+Math.min(4,nameScore(c.franchise,x.title))})).filter(z=>z.score>=2).sort((a,b)=>b.score-a.score);return pages[0]?.x?.thumbnail?.source||null}
async function fandomImage(c){const domain=FANDOM_DOMAINS[c.franchise];if(!domain)return null;const q=encodeURIComponent(imageQuery(c));const u=`https://${domain}/api.php?action=query&generator=search&gsrsearch=${q}&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=700&format=json&origin=*`;const r=await fetchTimeout(u,{},3200);if(!r.ok)throw 0;const pages=Object.values((await r.json()).query?.pages||{}).filter(x=>x.thumbnail?.source).map(x=>({x,score:imageNameScore(c,x.title)})).filter(z=>z.score>=2).sort((a,b)=>b.score-a.score);return pages[0]?.x?.thumbnail?.source||null}
async function jikanImage(c){const r=await fetchTimeout(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(imageQuery(c))}&limit=6`,{},3200);if(!r.ok)throw 0;const a=(await r.json()).data||[];a.sort((x,y)=>imageNameScore(c,y.name)-imageNameScore(c,x.name));const aliases=(FRANCHISE_ALIASES[c.franchise]||[c.franchise]).map(norm);for(const x of a.slice(0,4)){if(imageNameScore(c,x.name)<2)continue;try{const f=await fetchTimeout(`https://api.jikan.moe/v4/characters/${x.mal_id}/full`,{},2800);if(!f.ok)continue;const d=(await f.json()).data;const titles=[...(d?.anime||[]),...(d?.manga||[])].map(z=>norm(z.anime?.title||z.manga?.title||''));if(titles.some(t=>aliases.some(al=>al&&(t.includes(al)||al.includes(t)))))return x?.images?.jpg?.image_url||null}catch(e){}}return null}
async function resolveImage(c,force=false){if(!c)return avatar('?');const key=c.id+'|'+c.franchise;if(!force&&imageCache[key])return imageCache[key];let u=null;if(c.source==='Anime'){try{u=await aniImage(c)}catch(e){}if(!u){try{u=await jikanImage(c)}catch(e){}}if(!u){try{u=await wikiImage(c)}catch(e){}}}else{try{u=await fandomImage(c)}catch(e){}if(!u){try{u=await wikiImage(c)}catch(e){}}}u=u||avatar(c.name,c.franchise);imageCache[key]=u;try{localStorage.setItem('avg25-images-r4',JSON.stringify(imageCache))}catch(e){}return u}

 const roll1=cbRand(1),roll2=cbRand(2);

 if(c2.type==='counter'&&c1.type!=='feint'&&dmgTo2>0){const chance=cbClamp(.24,c1.type==='ultimate'?.62:.80,.49+((d.hax+d.speed)-(a.hax+a.speed))/430);if(roll2<chance){counter2=true;dmgTo2*=c1.type==='ultimate'?.48:.16;dmgTo1+=cbOffense(d,c2)/cbDefense(a)*.78;b.momentum[2][i2]=Math.min(10,b.momentum[2][i2]+2);notes.push(`${d.name} liest ${c1.name} und landet den Counter.`)}else{dmgTo2*=1.16;notes.push(`${d.name}s Counter-Fenster ist zu spät.`)}}
 if(c1.type==='counter'&&c2.type!=='feint'&&dmgTo1>0){const chance=cbClamp(.24,c2.type==='ultimate'?.62:.80,.49+((a.hax+a.speed)-(d.hax+d.speed))/430);if(roll1<chance){counter1=true;dmgTo1*=c2.type==='ultimate'?.48:.16;dmgTo2+=cbOffense(a,c1)/cbDefense(d)*.78;b.momentum[1][i1]=Math.min(10,b.momentum[1][i1]+2);notes.push(`${a.name} kontert ${c2.name} im Commit.`)}else{dmgTo1*=1.16;notes.push(`${a.name}s Counter wird gebaitet.`)}}

 if(c2.type==='setup'){b.energy[2][i2]=Math.min(8,b.energy[2][i2]+3);b.momentum[2][i2]=Math.min(10,b.momentum[2][i2]+2);if(dmgTo2>0)dmgTo2*=1.22;notes.push(`${d.name} nimmt sich einen Zug zum Aufladen.`)}

 if(c2.type==='awaken'){b.momentum[2][i2]=Math.max(0,b.momentum[2][i2]-5);b.awakened[2][i2]=3;if(dmgTo2>0)dmgTo2*=1.12;notes.push(`${d.name} geht ins Awakening und riskiert dafür einen offenen Moment.`)}
 if(dmgTo2>0&& !['defense','counter'].includes(c2.type)){const dodge=cbClamp(.015,.12,.035+(d.speed-a.speed)/520);if(roll2<dodge){dodge2=true;dmgTo2*=.22;b.momentum[2][i2]=Math.min(10,b.momentum[2][i2]+1);notes.push(`${d.name} dodged im letzten Frame.`)}}
 if(dmgTo1>0&& !['defense','counter'].includes(c1.type)){const dodge=cbClamp(.015,.12,.035+(a.speed-d.speed)/520);if(roll1<dodge){dodge1=true;dmgTo1*=.22;b.momentum[1][i1]=Math.min(10,b.momentum[1][i1]+1);notes.push(`${a.name} entkommt dem Haupttreffer.`)}}

 if(b.hp[1][i1]<=35)b.momentum[1][i1]=Math.min(10,b.momentum[1][i1]+1);if(b.hp[2][i2]<=35)b.momentum[2][i2]=Math.min(10,b.momentum[2][i2]+1);

/** setup.js — Startseite und Spielkonfiguration */
function saveSettings() {
  localStorage.setItem("avg25-settings", JSON.stringify(settings));
}

function newGame(mode = "classic") {
  const seed = (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
  rng = mulberry32(seed);
  return {
    version: VERSION,
    seed,
    mode,
    phase: "setup",
    active: 1,
    turnPicks: 0,
    candidate: null,
    forced: false,
    teams: { 1: [], 2: [] },
    missed: { 1: [], 2: [] },
    bans: { 1: null, 2: null },
    discarded: [],
    tokens: {
      1: { joker: 1, mystery: 1, double: 1, trade: 1, revive: 1 },
      2: { joker: 1, mystery: 1, double: 1, trade: 1, revive: 1 },
    },
    tradeDone: { 1: false, 2: false },
    captains: { 1: null, 2: null },
    order: { 1: [], 2: [] },
    verse: { 1: null, 2: null },
    allowedVerses: Object.keys(VERSE_ROSTERS),
    history: [],
    result: null,
    rematch: { 1: false, 2: false },
    matchNo: 1,
    _captainPreview: { 1: null, 2: null },
    _reviveSpent: { 1: false, 2: false },
  };
}

function hydrateRng() {
  rng = mulberry32((game?.seed || Date.now()) >>> 0);
  let steps = game?.history?.length || game?.historyCount || 0;
  while (steps-- > 0) rng();
}

function home() {
  if (typeof battleState !== "undefined") {
    clearTimeout(battleState.timer);

<script id="v29-narration">
/** Gemeinsame TTS-Steuerung. Abgebrochene Sprachausgabe darf keine neue Szene starten. */
class NarrationPlayer {
  constructor() {
    this.generation = 0;
    this.utterance = null;
    this.timer = null;
  }
  stop() {
    this.generation++;
    clearTimeout(this.timer);
    clearTimeout(battleState.timer);
    clearTimeout(battleState.ttsWatchdog);
    if (this.utterance) {
      this.utterance.onend = null;
      this.utterance.onerror = null;
    }
    this.utterance = null;
    try {
      window.speechSynthesis?.cancel();
    } catch {}
  }
  speak(text, done) {
    this.stop();
    const generation = this.generation;
    let finished = false;
    const finish = () => {
      if (finished || generation !== this.generation) return;
      finished = true;
      clearTimeout(this.timer);
      this.utterance = null;
      done?.();
    };
    text = cleanTTSText(text);
    const readMs = Math.min(
      180000,
      Math.max(3000, text.split(/\s+/).length * 320),
    );
    if (
      !settings.tts ||
      !window.speechSynthesis ||
      typeof SpeechSynthesisUtterance === "undefined"
    ) {
      this.timer = setTimeout(finish, readMs);
      return;
    }
    const utterance = new SpeechSynthesisUtterance(text),
      voices = speechSynthesis.getVoices();
    this.utterance = utterance;
    utterance.voice =
      voices.find((v) => v.name === localStorage.getItem("avg25-voice")) ||
      voices.find((v) => v.lang.startsWith("de") && v.localService) ||
      voices.find((v) => v.lang.startsWith("de")) ||
      null;
    utterance.lang = utterance.voice?.lang || "de-DE";
    utterance.rate = Number(localStorage.getItem("avg25-rate") || 0.97);
    utterance.onend = finish;
    utterance.onerror = () => {
      toast("Sprachausgabe nicht verfügbar. Die Szene bleibt lesbar.");
      finish();
    };
    try {
      speechSynthesis.resume();
      speechSynthesis.speak(utterance);
      const watchdog = () => {
        if (generation !== this.generation || finished) return;
        if (speechSynthesis.paused) {
          this.timer = setTimeout(watchdog, 5000);
          return;
        }
        speechSynthesis.cancel();
        finish();
      };
      this.timer = setTimeout(watchdog, Math.max(15000, readMs * 2));
    } catch {
      finish();
    }
  }
}
const narrationPlayer = new NarrationPlayer();
function narrateBlock(text, done) {
  narrationPlayer.speak(text, done);
}
function stopTTS() {
  narrationPlayer.stop();
}

/** Keep live playback brief; the unabridged source remains in the result report. */
function compactLiveNarration(scene, text) {
  if (scene.shortText) return scene.shortText;
  const sentences = cleanNarrationText(text).match(/[^.!?]+[.!?](?:\s|$)/g) || [
    text,
  ];
  if (sentences.join(" ").split(/\s+/).length <= 100) return text;
  const moves = scene.moves || [];
  const actionSentences = sentences.filter((s) =>
    moves.some((m) => s.includes(m)),
  );
  const candidates = actionSentences.length ? actionSentences : sentences;
  const result = [];
  let words = 0;
  for (const sentence of candidates) {
    const n = sentence.trim().split(/\s+/).length;
    if (words + n > 85) continue;
    result.push(sentence.trim());
    words += n;
    if (words >= 60 || result.length >= 4) break;
  }
  if (scene.kind === "ko")
    result.push(
      `${scene.attacker.name} entscheidet das Duell gegen ${scene.defender.name}.`,
    );
  return result.join(" ") || sentences[0];
}

</script>
<script id="v29-sharing">
/** Teilbares Ergebnis: Score und Teams im PNG und als eigenständiger Ergebnis-Link. */
function resultSnapshot() {
  const r = game.result;
  return {
    v: 1,
    winner: r.winner,
    wins1: r.wins1,
    wins2: r.wins2,
    mvp: r.mvp.id,
    teams: [game.teams[1].map((c) => c.id), game.teams[2].map((c) => c.id)],
  };
}
function snapshotLink(snapshot) {
  const bytes = new TextEncoder().encode(JSON.stringify(snapshot));
  const encoded = btoa(String.fromCharCode(...bytes))
    .replaceAll("+", "-")
    .replaceAll("/", "_")
    .replace(/=+$/, "");
  const base =
    location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? RELAY_URL + "/"
      : location.origin + location.pathname;
  return base + "#result=" + encoded;
}
function parseResultLink(hashValue) {
  const match = hashValue.match(/^#result=([\w-]{1,8000})$/);
  if (!match) return null;
  try {
    const bytes = Uint8Array.from(
      atob(match[1].replaceAll("-", "+").replaceAll("_", "/")),
      (c) => c.charCodeAt(0),
    );
    const s = JSON.parse(new TextDecoder().decode(bytes));
    if (
      s.v !== 1 ||
      ![1, 2].includes(s.winner) ||
      ![s.wins1, s.wins2].every(
        (x) => Number.isInteger(x) && x >= 0 && x <= 30,
      ) ||
      s.wins1 === s.wins2 ||
      s.winner !== (s.wins1 > s.wins2 ? 1 : 2) ||
      !BY_ID.has(s.mvp) ||
      !Array.isArray(s.teams) ||
      s.teams.length !== 2 ||
      !s.teams.every(
        (t) =>
          Array.isArray(t) &&
          t.length > 0 &&
          t.length <= 7 &&
          t.every((id) => BY_ID.has(id)),
      )
    )
      return null;
    return s;
  } catch {
    return null;
  }
}
function resultCaption(s) {
  return `ANIME VERSUS GAME · ${s.wins1}:${s.wins2} · Player ${s.winner === 1 ? "One" : "Two"} gewinnt · MVP: ${BY_ID.get(s.mvp)?.name || "—"}`;
}
function createResultCanvas(s) {
  const canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 1000;
  const ctx = canvas.getContext("2d"),
    g = ctx.createLinearGradient(0, 0, 1200, 1000);
  g.addColorStop(0, "#101a34");
  g.addColorStop(1, "#090916");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1200, 1000);
  function text(value, x, y, size, color = "#f5f7ff", align = "left") {
    ctx.font = `700 ${size}px Arial`;
    ctx.fillStyle = color;
    ctx.textAlign = align;

const ResultShare = {
  snapshot: null,
  blob: null,
  url: null,
  pending: null,
  prepare(s) {
    const key = JSON.stringify(s);
    if (this.key === key && this.pending) return this.pending;
    this.key = key;
    this.snapshot = s;
    this.blob = null;
    if (this.url) URL.revokeObjectURL(this.url);

          );
        if (this.key === key) {

    );

  },
  async open(s) {

  async copyLink() {

${esc(text)}</textarea

  },

}

  stopTTS();
  const h = game.hybrid;
  dispatch("hybridNext", {
    round: h.round,
    seed: game.seed,
    matchNo: game.matchNo,
  });
}
function handleHybridAction(action, p, player) {
  if (
    !game?.hybrid ||
    game.phase !== "battle" ||
    (online.mode !== "local" && !online.connected) ||
    p.round !== game.hybrid.round ||
    p.seed !== game.seed ||
    p.matchNo !== game.matchNo
  )
    return false;
  return action === "hybridChoose"
    ? hybridBattle.choose(player, p.id)
    : hybridBattle.next(player);
}

</script>

unpackGameState=function(s){

};

const v29HandleActionBase=handleAction;
